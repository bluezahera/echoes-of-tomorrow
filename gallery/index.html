<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0806;--bg2:#110904;--bg3:#1a0f06;
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.3);--gold-glow:rgba(201,168,76,.12);
  --text:#e8d8b0;--text-dim:#9b7a4a;--text-muted:#7a5e32;
  --border:rgba(139,106,58,.22);--border-gold:rgba(201,168,76,.38);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;font-size:16px}

/* ── Header ── */
.hdr{
  background:linear-gradient(180deg,#0a0603 0%,#110904 100%);
  border-bottom:1px solid var(--border-gold);
  padding:22px 28px 20px;
  position:relative;
  display:flex;
  align-items:center;
  gap:28px;
}
.hdr-back{
  flex-shrink:0;
  display:inline-flex;align-items:center;gap:7px;
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  text-decoration:none;letter-spacing:1px;cursor:pointer;
  padding:8px 16px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.7);
  transition:all .22s;
  white-space:nowrap;
}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.hdr-text{flex:1;text-align:center}
.hdr-eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.hdr-title{font-family:'Ephesis',cursive;font-size:60px;color:#d42020;line-height:1.05;text-shadow:0 2px 24px rgba(180,20,20,.45)}
.hdr-sub{font-family:'Cormorant Upright',serif;font-size:20px;font-weight:600;color:var(--gold);margin-top:8px;letter-spacing:.8px}
.hdr-rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:14px auto 0}

/* ── Header Carousel ── */
/* ── Header Carousel ── */
.hdr-carousel{
  flex:0 0 230px;height:195px;
  position:relative;overflow:hidden;
  border-radius:10px;
  background:rgba(0,0,0,.25);
}
.car-stage{position:relative;width:100%;height:100%}
.car-img{
  position:absolute;top:50%;left:50%;
  width:124px;height:155px;       /* 4:5 portrait — matches 3200×4000 source */
  object-fit:cover;border-radius:8px;
  border:1px solid rgba(201,168,76,.18);
  transition:transform .92s cubic-bezier(.4,0,.2,1),opacity .92s cubic-bezier(.4,0,.2,1);
  will-change:transform,opacity;
}
.car-img.car-active{
  transform:translate(-50%,-50%) scale(1.22);  /* 151×189px — fits 195px tall container */
  opacity:1;z-index:4;
  box-shadow:0 6px 24px rgba(0,0,0,.85),0 0 0 2px rgba(201,168,76,.45),0 0 14px rgba(201,168,76,.15);
}
.car-img.car-entering{
  transform:translate(calc(-50% + 64px),-50%) scale(0.72);
  opacity:.62;z-index:2;
}
.car-img.car-exiting{
  transform:translate(calc(-50% - 180px),-50%) scale(0.70);
  opacity:0;z-index:2;
}
.car-img.car-hidden{
  transform:translate(calc(-50% + 185px),-50%) scale(0.70);
  opacity:0;z-index:1;
  transition:none;
}

/* ── Category Tabs ── */
.cat-nav{
  display:flex;justify-content:center;gap:10px;
  padding:22px 32px 0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.cat-tab{
  padding:10px 30px 11px;border-radius:22px 22px 0 0;
  border:1px solid transparent;border-bottom:none;
  background:transparent;
  color:var(--text-dim);
  font-family:'Charm',cursive;font-size:18px;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  position:relative;bottom:-1px;
}
.cat-tab:hover{color:var(--text);background:var(--gold-glow)}
.cat-tab.active{
  background:var(--bg2);color:var(--gold);
  border-color:var(--border-gold);border-bottom-color:var(--bg2);
}

/* ── Gallery Wrap ── */
.gallery-wrap{
  background:var(--bg2);
  min-height:72vh;
  padding:32px 36px 48px;
}
.gallery-section{display:none}
.gallery-section.active{display:block}
.gallery-empty{
  text-align:center;padding:90px 20px;
  color:var(--text-muted);font-style:italic;font-size:20px;
  font-family:'Cormorant Garamond',serif;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:22px;
}

/* ── Image Card ── */
.g-card{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s;
  position:relative;
}
.g-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,168,76,.22);
  border-color:var(--border-gold);
}
.g-thumb-wrap{
  position:relative;width:100%;padding-bottom:125%; /* default 4:5 (3200×4000 book artwork) */
  overflow:hidden;background:#080503;cursor:pointer;
}
/* Book Artwork — contain so the full image always shows inside the frame */
#grid-book .g-thumb-wrap img{object-fit:contain}
/* Character portraits are 8.5"×11" → height:width = 11÷8.5 = 129.41% */
#grid-characters .g-thumb-wrap{padding-bottom:129.41%}
.g-thumb-wrap img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  transition:transform .38s;
  display:block;
}
.g-card:hover .g-thumb-wrap img{transform:scale(1.05)}
.g-zoom-hint{
  position:absolute;inset:0;
  background:rgba(0,0,0,0);transition:background .22s;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.g-card:hover .g-zoom-hint{background:rgba(0,0,0,.18)}
.g-zoom-icon{
  opacity:0;transform:scale(.7);transition:opacity .22s,transform .22s;
  width:44px;height:44px;border-radius:50%;
  background:rgba(12,8,4,.75);border:1px solid var(--border-gold);
  display:flex;align-items:center;justify-content:center;
}
.g-card:hover .g-zoom-icon{opacity:1;transform:scale(1)}
.g-zoom-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.8}

/* Title top / bottom */
.g-title{
  padding:10px 14px;
  font-family:'Charm',cursive;font-size:17px;
  color:var(--gold);letter-spacing:.3px;
  text-align:center;line-height:1.3;
}
.g-title.top{border-bottom:1px solid var(--border)}
.g-title.bottom{border-top:1px solid var(--border)}

/* Comment button */
.g-note-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:9px 14px;
  background:rgba(201,168,76,.05);
  border:none;border-top:1px solid var(--border);
  color:var(--text-muted);font-family:'Charm',cursive;font-size:13px;
  letter-spacing:1.2px;text-transform:uppercase;
  cursor:pointer;transition:all .18s;
}
.g-note-btn:hover{background:var(--gold-glow);color:var(--gold)}
.g-note-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}

/* ── Lightbox ── */
.lb-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(4,2,1,.93);
  align-items:center;justify-content:center;
  padding:20px;
}
.lb-overlay.open{display:flex}
.lb-wrap{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  max-width:92vw;max-height:92vh;
}
.lb-img{
  max-width:88vw;max-height:78vh;
  object-fit:contain;
  border:1px solid var(--border-gold);
  border-radius:4px;
  display:block;
}
.lb-close{
  position:absolute;top:-16px;right:-16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(16,8,4,.92);border:1px solid var(--border-gold);
  color:var(--gold);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;line-height:1;font-family:'Charm',cursive;
  flex-shrink:0;
}
.lb-close:hover{background:rgba(201,168,76,.15);transform:scale(1.08)}
.lb-footer{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-top:14px;
}
.lb-title{
  font-family:'Charm',cursive;font-size:20px;
  color:var(--gold);letter-spacing:.8px;text-align:center;
}
.lb-note-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 22px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.8);
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  transition:all .2s;
}
.lb-note-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.lb-note-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Comment / Book-Page Overlay ── */
.cm-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(4,2,1,.88);
  align-items:center;justify-content:center;
  padding:24px;
}
.cm-overlay.open{display:flex}
.cm-page{
  background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;
  color:#1a0a02;
  border-radius:6px;
  border:1px solid rgba(155,115,42,.45);
  box-shadow:
    0 24px 70px rgba(0,0,0,.72),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 0 60px rgba(120,90,28,.06);
  max-width:600px;width:100%;max-height:82vh;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}
/* Spine shadow on left edge */
.cm-page::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:34px;
  background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);
  pointer-events:none;
}
/* Top edge sheen */
.cm-page::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);
  pointer-events:none;
}
/* Ruling lines beneath body text (decorative) */
.cm-page-inner{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.cm-hdr{
  padding:28px 32px 16px 44px;
  border-bottom:1px solid rgba(155,115,42,.18);
  flex-shrink:0;
}
.cm-page-title{
  font-family:'Charm',cursive;font-size:28px;font-weight:700;
  color:#7a4010;line-height:1.2;
  text-shadow:0 1px 3px rgba(0,0,0,.13);
}
.cm-page-sub{
  font-family:'Playfair Display',serif;font-size:19px;font-weight:700;
  color:#7a4010;margin-top:7px;font-style:normal;
}
.cm-scroll{
  flex:1;overflow-y:auto;
  padding:18px 32px 22px 44px;
}
.cm-scroll::-webkit-scrollbar{width:4px}
.cm-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3)}
.cm-text{
  font-family:'Lora',serif;font-size:16px;font-style:italic;
  color:#1a0a02;line-height:1.88;
}
.cm-text p{margin-bottom:.9em}
.cm-text p:last-child{margin-bottom:0}
.cm-text p.cm-sub-inline{
  font-family:'Playfair Display',serif;font-size:18px;font-weight:700;
  font-style:normal;color:#7a4010;
  margin:1em 0 .25em;line-height:1.3;
}
.cm-foot{
  padding:12px 32px 16px 44px;
  border-top:1px solid rgba(155,115,42,.18);
  display:flex;justify-content:flex-end;flex-shrink:0;
}
.cm-btn-close{
  padding:8px 24px;border-radius:20px;
  background:rgba(155,115,42,.1);
  border:1px solid rgba(155,115,42,.35);
  color:#4a2e0a;font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase;
}
.cm-btn-close:hover{background:rgba(155,115,42,.22)}
.cm-x{
  position:absolute;top:13px;right:14px;
  background:none;border:none;
  color:#4a2e0a;font-size:20px;cursor:pointer;
  padding:4px 8px;border-radius:4px;
  line-height:1;transition:background .15s;font-weight:700;
}
.cm-x:hover{background:rgba(155,115,42,.15)}

/* ── Footer ── */
.gal-foot{
  padding:26px 32px;
  background:var(--bg);
  border-top:1px solid var(--border);
  text-align:center;
}
.gal-foot-link{
  font-family:'Charm',cursive;font-size:15px;
  color:var(--text-muted);letter-spacing:.8px;
  cursor:pointer;background:none;border:none;
  text-decoration:none;transition:color .2s;
  padding:0 2px;
}
.gal-foot-link:hover{color:var(--gold)}
.gal-foot-sep{margin:0 14px;color:var(--border);font-size:14px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <button class="hdr-back" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;border-radius:2px">
    Flipbook
  </button>
  <div class="hdr-text">
    <div class="hdr-eyebrow">Image Gallery</div>
    <div class="hdr-title">Echoes of Tomorrow</div>
    <div class="hdr-sub">A Vampire Diaries Universe Fan Novel</div>
    <div class="hdr-rule"></div>
  </div>
  <div class="hdr-carousel">
    <div class="car-stage">
      <img class="car-img car-active"   src="https://lh3.googleusercontent.com/d/1xe9XBsKuzg1qa7s4nWAnvUJozPygooFQ" alt="">
      <img class="car-img car-entering" src="https://lh3.googleusercontent.com/d/1u9I46kFDu9ZKDSFDu4ciKfZi8zkgvUkk" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1LKJrRB5b4BaXokYJ6b7JuzI7o80CsxBt" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1t2rFv-2vDX1uX0gOnOxqNdYq27yNi2ON" alt="">
    </div>
  </div>
</header>

<!-- Category Navigation -->
<nav class="cat-nav">
  <button class="cat-tab active" id="tab-book" onclick="switchCat('book')">Book Artwork</button>
  <button class="cat-tab" id="tab-characters" onclick="switchCat('characters')">Characters Artwork</button>
</nav>

<!-- Gallery Content -->
<main class="gallery-wrap">
  <div class="gallery-section active" id="section-book">
    <div class="gallery-grid" id="grid-book"></div>
    <div class="gallery-empty" id="empty-book" style="display:none">No book artwork has been added yet.</div>
  </div>
  <div class="gallery-section" id="section-characters">
    <div class="gallery-grid" id="grid-characters"></div>
    <div class="gallery-empty" id="empty-characters" style="display:none">No character artwork has been added yet.</div>
  </div>
</main>

<!-- Footer -->
<footer class="gal-foot">
  <button class="gal-foot-link" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;vertical-align:middle;margin-right:7px;border-radius:2px">Read the Flipbook
  </button>
  <span class="gal-foot-sep">|</span>
  <button class="gal-foot-link" onclick="galScrollTop()">
    Back to Top<img src="https://lh3.googleusercontent.com/d/1UdXIzhjLnglrTz14xu_yOS51hdYCAszS" style="height:18px;width:auto;object-fit:contain;vertical-align:middle;margin-left:6px">
  </button>
</footer>

<!-- Lightbox Overlay -->
<div class="lb-overlay" id="lb-overlay" onclick="lbBgClick(event)">
  <div class="lb-wrap" id="lb-wrap">
    <button class="lb-close" onclick="closeLb()" title="Close">&#215;</button>
    <img class="lb-img" id="lb-img" src="" alt="">
    <div class="lb-footer">
      <div class="lb-title" id="lb-title" style="display:none"></div>
      <button class="lb-note-btn" id="lb-note-btn" onclick="openNote()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h8"/></svg>
        Read About This Image
      </button>
    </div>
  </div>
</div>

<!-- Comment / Book-Page Overlay -->
<div class="cm-overlay" id="cm-overlay" onclick="noteBgClick(event)">
  <div class="cm-page" id="cm-page">
    <button class="cm-x" onclick="closeNote()">&#215;</button>
    <div class="cm-page-inner">
      <div class="cm-hdr">
        <div class="cm-page-title" id="cm-title"></div>
        <div class="cm-page-sub" id="cm-sub" style="display:none"></div>
      </div>
      <div class="cm-scroll">
        <div class="cm-text" id="cm-body"></div>
      </div>
      <div class="cm-foot">
        <button class="cm-btn-close" onclick="closeNote()">Close</button>
      </div>
    </div>

en\x20alive.\x20The\x20grey\x20smoke\x20breathing\x20at\x20the\x20edges\x20is\x20a\x20layer\x20of\x20reality\x20that\x20never\x20leaves\x20this\x20story,\x20present\x20in\x20the\x20background\x20the\x20way\x20death\x20is\x20present\x20in\x20any\x20world\x20where\x20survival\x20is\x20not\x20guaranteed.\x20The\x20ancient\x20ruins\x20and\x20the\x20modern\x20city\x20exist\x20in\x20the\x20same\x20frame\x20because\x20in\x20this\x20narrative\x20they\x20occupy\x20the\x20same\x20moment\x20—\x20the\x20characters\x20are\x20both,\x20simultaneously,\x20and\x20the\x20weight\x20of\x20one\x20never\x20fully\x20lifts\x20to\x20make\x20room\x20for\x20the\x20other.\x0a\x0a!!The\x20Title,\x20Last!!\x0a\x0aThe\x20words\x20arc\x20around\x20the\x20clock\x20face\x20in\x20red\x20and\x20deep\x20amber\x20—\x20a\x20color\x20that\x20reads\x20as\x20both\x20heat\x20and\x20warning,\x20the\x20visual\x20representation\x20of\x20something\x20that\x20was\x20forged\x20rather\x20than\x20simply\x20made.\x20The\x20title\x20is\x20the\x20last\x20thing\x20the\x20eye\x20settles\x20on\x20and\x20the\x20first\x20thing\x20it\x20returns\x20to.\x20It\x20names\x20the\x20premise\x20with\x20deliberate\x20precision:\x20not\x20echoes\x20of\x20the\x20past,\x20but\x20echoes\x20of\x20a\x20tomorrow\x20that\x20is\x20still\x20coming,\x20that\x20a\x20small\x20group\x20of\x20people\x20decided\x20they\x20were\x20unwilling\x20to\x20inherit.\x20The\x20logo\x20makes\x20no\x20promises\x20about\x20whether\x20they\x20change\x20it.\x20It\x20simply\x20marks\x20the\x20beginning\x20of\x20their\x20attempt\x20—\x20and\x20the\x20color\x20it\x20burns\x20in\x20tells\x20you\x20something\x20about\x20what\x20that\x20attempt\x20cost\x20the\x20people\x20who\x20made\x20it.\x0a\x0a**_The\x20full\x20symbolic\x20breakdown\x20of\x20this\x20image\x20—\x20every\x20color,\x20every\x20structural\x20choice,\x20every\x20layer\x20of\x20meaning\x20embedded\x20in\x20the\x20design\x20—\x20lives\x20in\x20the\x20About\x20the\x20Book\x20&\x20the\x20Story\x20section\x20 0was\x20and\x20what\x20will\x20be,\x20in\x20the\x20moment\x20before\x20the\x20hands\x20settle\x20and\x20the\x20future\x20becomes\x20fixed.\x0a\x0a!!What\x20Holds\x20Your\x20Place!!\x0a\x0aThis\x20bookmark\x20is\x20holding\x20more\x20than\x20your\x20place\x20in\x20the\x20book.\x20It\x20is\x20holding\x20the\x20image\x20of\x20the\x20story\x27s\x20central\x20condition:\x20a\x20present\x20moment\x20that\x20is\x20still\x20in\x20motion,\x20watched\x20over\x20by\x20every\x20instrument\x20of\x20navigation\x20and\x20time\x20that\x20the\x20story\x20has\x20to\x20offer,\x20waiting\x20to\x20see\x20which\x20way\x20it\x20resolves.'}},{'url':'https://lh3.googleusercontent.com/d/1oALhEbuxpWKEMrRIEcTNVPVomlwlhx4H','title':_0x3b4080(0x10b),'titlePosition':_0x3b4080(0x9b),'pov':'','color':'','comment':{'title':_0x3b4080(0xf5),'body':_0x3b4080(0x12f)}},{'url':_0x3b4080(0xf2),'title':_0x3b4080(0x143),'titlePosition':_0x3b4080(0x9b),'pov':'','color':'','comment':{'title':_0x3b4080(0xe2),'body':'The\x20Back\x20arrow\x20is\x20cast\x20in\x20aged\x20bronze\x20and\x20copper.\x20Every\x20surface\x20of\x20it\x20is\x20alive\x20with\x20nature\x20—\x20leaves,\x20acanthus\x20scrollwork,\x20botanical\x20tendrils\x20curling\x20along\x20the\x20shaft\x20and\x20unfurling\x20from\x20the\x20fletching\x20in\x20the\x20unmistakable\x20motif\x20of\x20Gaia\x27s\x20presence.\x20In\x20**Echoes\x20of\x20Tomorrow**,\x20nature\x20magic\x20is\x20the\x20force\x20that\x20made\x20time\x20travel\x20possible.\x20Gaia,\x20the\x20primordial\x20earth\x20goddess\x20who\x20moves\x20beneath\x20every\x20visible\x20event\x20in\x20this\x20story,\x20used\x20the\x20oldest\x20magic\x20in\x20existence\x20—\x20nature\x27s\x20magic\x20—\x20to\x20power\x20the\x20spell\x20that\x20sent\x20the\x20travelers\x20back.\x20Her\x20signature\x20is\x20growth,\x20living\x20things,\x20the\x20relentless\x20forward\x20motion\x20of\x20nature\x20that\x20simultaneously\x20reaches\x20backward\x20into\x20root\x20and\x20soil.\x20That\x20magic\x20is\x20woven\x20into\x20these\x20arrows\x20because\x20direction\x20and\x20nature\x27s\x20power\x20and\x20influence\x20are\x20inseparable\x20in\x20this\x20story.\x0a\x0aBut\x20nature\x20magic\x20that\x20is\x20used\x20to\x20bend\x20time\x20does\x20not\x20simply\x20spend\x20itself\x20and\x20disappear.\x20It\x20seeks\x20balance.\x20Every\x20person\x20touched\x20by\x20the\x20time\x20spell\x20in\x20the\x20present\x20timeline\x20carries\x20a\x20cost\x20—\x20the\x20magic\x20pressing\x20against\x20them\x20the\x20way\x20a\x20living\x20thing\x20presses\x20toward\x20equilibrium,\x20wanting\x20to\x20restore\x20what\x20was\x20displaced.\x20The\x20arrow\x20points\x20left,\x20back\x20through\x20the\x20pages,\x20back\x20through\x20the\x20timeline,\x20back\x20toward\x20what\x20came\x20before.\x20In\x20the\x20world\x20of\x20this\x20story,\x20that\x20direction\x20is\x20where\x20the\x20travelers\x20returned\x20to,\x20and\x20the\x20magic\x20that\x20brought\x20them\x20there\x20has\x20never\x20stopped\x20pulling.'}},{'url':_0x3b4080(0xc1),'title':_0x3b4080(0x127),'titlePosition':_0x3b4080(0x9b),'pov':'','color':'','comment':{'title':_0x3b4080(0xdb),'body':_0x3b4080(0xd3)}},{'url':_0x3b4080(0x13e),'title':_0x3b4080(0x111),'titlePosition':'top','pov':'','color':'','comment':{'title':_0x3b4080(0xb0),'body':'The\x20clock\x20that\x20serves\x20as\x20the\x20page\x20tracker\x20is\x20a\x20skeleton\x20timepiece\x20—\x20its\x20face\x20open,\x20its\x20gears\x20fully\x20visible,\x20its\x20inner\x20workings\x20exposed.\x20The\x20same\x20way\x20the\x20mechanisms\x20of\x20time\x20became\x20exposed\x20to\x20those\x20who\x20reached\x20through\x20time\x20to\x20change\x20it.\x20The\x20clock\x27s\x20frame\x20is\x20bronze\x20and\x20green\x20enamel,\x20the\x20same\x20color\x20combination\x20woven\x20through\x20the\x20flipbook\x27s\x20entire\x20visual\x20language.\x20But\x20the\x20clock\x20does\x20not\x20exist\x20alone.\x20Dark\x20tendrils\x20of\x20blood\x20move\x20through\x20and\x20around\x20it\x20—\x20coiling\x20between\x20the\x20gears,\x20wrapping\x20across\x20the\x20numerals,\x20pressing\x20toward\x20the\x20hands.\x20They\x20came\x20through\x20time\x20with\x20the\x20travelers.\x20They\x20have\x20never\x20left.\x0a\x0aThe\x20blood\x20is\x20everything\x20the\x20mission\x20demands,\x20across\x20every\x20timeline\x20at\x20once.\x20The\x20lives\x20already\x20lost\x20in\x20the\x20future\x20they\x20came\x20back\x20to\x20prevent.\x20The\x20blood\x20already\x20spilled\x20in\x20a\x20timeline\x20they\x20are\x20trying\x20to\x20unmake.\x20The\x20grief\x20of\x20mourning\x20people\x20who\x20are\x20still\x20alive\x20and\x20unknowing\x20in\x20the\x20present.\x20The\x20relationships\x20and\x20the\x20loved\x20ones\x20that\x20may\x20never\x20exist\x20in\x20this\x20timeline\x20because\x20the\x20travelers\x20are\x20changing\x20the\x20very\x20circumstances\x20that\x20created\x20them\x20—\x20futures\x20that\x20were\x20real\x20to\x20them,\x20being\x20unmade\x20by\x20their\x20own\x20hands.\x20And\x20then\x20the\x20blood\x20still\x20coming:\x20the\x20sacrifices\x20already\x20decided\x20on\x20but\x20not\x20yet\x20fully\x20paid,\x20the\x20question\x20each\x20character\x20is\x20answering\x20in\x20real\x20time\x20of\x20how\x20far\x20they\x20are\x20willing\x20to\x20go,\x20how\x20much\x20blood\x20they\x20are\x20prepared\x20to\x20spill,\x20what\x20they\x20are\x20willing\x20to\x20become,\x20to\x20keep\x20the\x20events\x20of\x20the\x20future\x20from\x20happening.\x0a\x0aThe\x20page\x20tracker\x20marks\x20where\x20you\x20are\x20in\x20the\x20story.\x20The\x20blood\x20marks\x20what\x20the\x20story\x20is\x20made\x20of\x20—\x20blood\x20already\x20spilled,\x20blood\x20being\x20spilled\x20now,\x20and\x20blood\x20that\x20has\x20yet\x20to\x20be\x20shed,\x20and\x20the\x20cost\x20and\x20consequences\x20of\x20it.\x20The\x20blood\x20came\x20through\x20time\x20because\x20it\x20belongs\x20to\x20the\x20people\x20who\x20did.\x20It\x20reaches\x20toward\x20the\x20hands\x20of\x20the\x20clock\x20because\x20time\x20is\x20precisely\x20what\x20it\x20is\x20owed.'}},{'url':'https://lh3.googleusercontent.com/d/1xe9XBsKuzg1qa7s4nWAnvUJozPygooFQ','title':_0x3b4080(0x155),'titlePosition':_0x3b4080(0x9b),'pov':'','color':'','comment':{'title':_0x3b4080(0xb2),'body':_0x3b4080(0x14b)}},{'url':'https://lh3.googleusercontent.com/d/18btOGfdtjz-sNGYf8O7asVv3UOf-uoAj','title':_0x3b4080(0x95),'titlePosition':_0x3b4080(0x9b),'pov':'','color':'','comment':{'title':_0x3b4080(0xa4),'body':'The\x20North\x20Star\x20is\x20the\x20symbol\x20of\x20orientation\x20—\x20the\x20fixed\x20point\x20that\x20navigators\x20have\x20used\x20for\x20millennia\x20to\x20find\x20their\x20bearing\x20when\x20everything\x20else\x20was\x20moving,\x20when\x20the\x20sea\x20was\x20dark\x20and\x20the\x20horizon\x20had\x20disappeared.\x20In\x20the\x20flipbook\x20it\x20serves\x20as\x20the\x20Bookmark\x20button:\x20the\x20marker\x20that\x20holds\x20your\x20place,\x20the\x20fixed\x20point\x20you\x20can\x20return\x20to\x20when\x20you\x20set\x20the\x20story\x20down\x20and\x20need\x20to\x20find\x20your\x20way\x20back.\x20That\x20function\x20and\x20that\x20symbol\x20are\x20inseparable.\x20In\x20a\x20story\x20about\x20people\x20who\x20have\x20lost\x20their\x20fixed\x20point\x20—\x20who\x20have\x20watched\x20their\x20future\x20destroyed\x20and\x20traveled\x20to\x20the\x20past\x20with\x20nothing\x20certain\x20except\x20their\x20memories\x20of\x20what\x20must\x20not\x20happen\x20again\x20—\x20the\x20act\x20of\x20bookmarking\x20a\x20page\x20carries\x20genuine\x20thematic\x20weight.\x20You\x20are\x20marking\x20where\x20you\x20are.\x20You\x20are\x20making\x20sure\x20you\x20can\x20return.\x0a\x0aThe\x20star\x20is\x20rendered\x20in\x20the\x20same\x20hammered\x20bronze\x20and\x20copper\x20as\x20every\x20navigational\x20element\x20in\x20the\x20flipbook,\x20its\x20twelve\x20points\x20precise\x20and\x20symmetrical,\x20an\x20engraved\x20medallion\x20at\x20its\x20center.\x20It\x20appears\x20again\x20on\x20the\x20bookmark\x20image\x20itself\x20—\x20the\x20tall,\x20illustrated\x20bookmark\x20that\x20holds\x20your\x20place\x20within\x20the\x20story\x27s\x20visual\x20world\x20—\x20where\x20it\x20anchors\x20the\x20full\x20composition\x20at\x20its\x20base.\x20Two\x20appearances,\x20one\x20meaning:\x20this\x20is\x20where\x20you\x20are.\x20This\x20is\x20how\x20you\x20find\x20your\x20way\x20back.'}},{'url':_0x3b4080(0xcc),'title':_0x3b4080(0x10f),'titlePosition':_0x3b4080(0x9b),'pov':'','color':'','comment':{'title':_0x3b4080(0x9d),'body':_0x3b4080(0x124)}},{'url':_0x3b4080(0x157),'title':_0x3b4080(0x10e),'titlePosition':_0x3b4080(0x9b),'pov':'','color':'','comment':{'title':_0x3b4080(0xef),'body':_0x3b4080(0x13a)}},{'url':_0x3b4080(0x154),'title':_0x3b4080(0xa3),'titlePosition':_0x3b4080(0x9b),'pov':'','color':'','comment':{'title':_0x3b4080(0x93),'body':_0x3b4080(0xa5)}}],'charactersArtwork':[{'url':_0x3b4080(0xe1),'title':_0x3b4080(0xf7),'titlePosition':_0x3b4080(0x9b),'pov':'Caroline\x20Forbes','color':'gold','comment':{'title':_0x3b4080(0x14f),'body':'!!The\x20Moment!!\x0a\x0aThe\x20morning\x20after\x20Klaus\x27s\x20hybrid\x20ritual\x20is\x20the\x20moment\x20two\x20timelines\x20split\x20apart.\x20While\x20Mystic\x20Falls\x20holds\x20its\x20breath\x20and\x20the\x20supernatural\x20world\x20shifts\x20on\x20its\x20axis,\x20Caroline\x20Forbes\x20wakes\x20up\x20on\x20the\x20Lockwood\x20mansion\x20couch\x20with\x20a\x20migraine,\x20future\x20memories\x20bleeding\x20into\x20her\x20present\x20like\x20ink\x20dropped\x20into\x20still\x20water,\x20and\x20the\x20quiet,\x20absolute\x20certainty\x20that\x20everything\x20is\x20about\x20to\x20change.\x20She\x20has\x20already\x20lived\x20through\x20the\x20apocalypse\x20once.\x20She\x20has\x20already\x20watched\x20everyone\x20she\x20loves\x20die.\x20She\x20came\x20back\x20anyway\x20—\x20not\x20because\x20Gaia\x20promised\x20her\x20victory,\x20but\x20because\x20possibility\x20was\x20enough.\x0a\x0a!!The\x20Image!!\x0a\x0aThis\x20portrait\x20captures\x20Caroline\x20in\x20the\x20present\x20timeline,\x20the\x20moment\x20when\x20the\x20transformation\x20Gaia\x20has\x20set\x20in\x20motion\x20begins\x20to\x20declare\x20itself\x20to\x20the\x20world\x20around\x20her.\x20The\x20forest\x20is\x20already\x20responding\x20to\x20her.\x20Trees\x20lean\x20inward,\x20energy\x20trails\x20from\x20her\x20in\x20curving\x20ribbons\x20of\x20gold\x20and\x20white,\x20a\x20glowing\x20sigil\x20hangs\x20above\x20her\x20in\x20the\x20dark\x20like\x20a\x20second\x20moon\x20—\x20the\x20divine\x20signature\x20of\x20something\x20ancient\x20recognizing\x20its\x20own,\x20translated\x20through\x20the\x20specific\x20body\x20of\x20a\x20girl\x20from\x20Mystic\x20Falls\x20who\x20chose\x20to\x20carry\x20it.\x20The\x20forest\x20floor\x20is\x20already\x20changing\x20beneath\x20her\x20feet,\x20though\x20she\x20hasn\x27t\x20asked\x20it\x20to\x20or\x20know\x20it\x20yet.\x0a\x0a!!What\x20This\x20Image\x20Holds!!\x0a\x0aThe\x20characters\x20of\x20this\x20story\x20are\x20never\x20posed\x20for\x20the\x20viewer.\x20They\x20are\x20immersed\x20in\x20their\x20world,\x20caught\x20inside\x20the\x20moment,\x20absorbed\x20entirely\x20in\x20what\x20is\x20happening\x20to\x20them.\x20Caroline\x20is\x20no\x20exception.\x20She\x20is\x20facing\x20forward\x20because\x20she\x20does\x20not\x20look\x20back\x20—\x20not\x20even\x20when\x20the\x20cost\x20of\x20what\x20lies\x20ahead\x20is\x20something\x20she\x20has\x20already\x20paid\x20once\x20and\x20remembers\x20in\x20full.\x20The\x20golden\x20light\x20surrounding\x20her\x20is\x20hers.\x20The\x20question\x20the\x20story\x20spends\x20its\x20pages\x20answering\x20is\x20whether\x20she\x20will\x20learn\x20to\x20hold\x20it\x20before\x20it\x20holds\x20her.\x0a\x0a!!Why\x20She\x20Is\x20Here!!\x0a\x0aCaroline\x20did\x20not\x20come\x20back\x20to\x20save\x20the\x20world.\x20She\x20came\x20back\x20for\x20specific\x20people,\x20specific\x20faces,\x20specific\x20losses\x20she\x20could\x20not\x20carry\x20a\x20second\x20time.\x20She\x20made\x20a\x20deal\x20with\x20a\x20primordial\x20goddess\x20and\x20bound\x20herself\x20to\x20a\x20destiny\x20she\x20cannot\x20fully\x20read,\x20and\x20she\x20did\x20it\x20without\x20hesitation,\x20because\x20the\x20alternative\x20was\x20unbearable.\x20That\x20choice\x20—\x20not\x20the\x20power,\x20not\x20the\x20transformation,\x20not\x20the\x20divine\x20sigil\x20of\x20Gaia\x27s\x20mark\x20glowing\x20above\x20her\x20in\x20the\x20dark\x20—\x20is\x20what\x20this\x20portrait\x20is\x20really\x20about.\x20The\x20forest\x20is\x20answering\x20her\x20because\x20she\x20is\x20the\x20kind\x20of\x20person\x20the\x20earth\x20recognizes\x20as\x20its\x20own.\x20She\x20always\x20was.\x20She\x20simply\x20did\x20not\x20know\x20it\x20yet.'}},{'url':_0x3b4080(0xf3),'title':'Kol\x20Mikaelson\x20-\x20POV\x20Transitioning\x20Portrait','titlePosition':_0x3b4080(0x9b),'pov':_0x3b4080(0x116),'color':_0x3b4080(0xfb),'comment':{'title':_0x3b4080(0xe6),'body':'!!The\x20Inner\x20World!!\x0a\x0aBefore\x20Esther\x20turned\x20her\x20children\x20into\x20vampires,\x20Kol\x20Mikaelson\x20was\x20a\x20witch.\x20He\x20was\x20born\x20with\x20magic\x20—\x20not\x20inherited\x20secondhand,\x20not\x20studied\x20into\x20existence,\x20but\x20genuinely\x20his,\x20woven\x20into\x20his\x20nature\x20the\x20way\x20a\x20vampire\x27s\x20speed\x20is\x20woven\x20into\x20theirs.\x20The\x20night\x20his\x20mother\x20made\x20him\x20immortal,\x20she\x20took\x20it\x20from\x20him.\x20Vampires\x20cannot\x20perform\x20magic.\x20The\x20transformation\x20is\x20permanent,\x20the\x20loss\x20is\x20permanent,\x20and\x20Kol\x20has\x20spent\x20a\x20thousand\x20years\x20inside\x20that\x20absence\x20—\x20obsessed,\x20methodical,\x20relentless\x20in\x20the\x20accumulation\x20of\x20everything\x20he\x20can\x20no\x20longer\x20do\x20himself.\x20He\x20has\x20become,\x20in\x20the\x20centuries\x20since,\x20the\x20living\x20person\x20with\x20the\x20most\x20magical\x20knowledge\x20on\x20the\x20planet.\x20None\x20of\x20it\x20gives\x20back\x20what\x20was\x20taken.\x20He\x20studies\x20it\x20anyway.\x0a\x0a!!The\x20Image! nter\x20it\x20with\x20something\x20older\x20and\x20more\x20precise.\x20The\x20loss\x20is\x20still\x20the\x20loss.\x20The\x20portrait\x20is\x20what\x20a\x20thousand\x20years\x20of\x20refusing\x20to\x20accept\x20it\x20looks\x20like.\x0a\x0a!!What\x20He\x20Agreed\x20To\x20Carry!!\x0a\x0aOf\x20the\x20three\x20people\x20who\x20carried\x20future\x20memories\x20back\x20through\x20time,\x20Kol\x20was\x20chosen\x20because\x20his\x20knowledge\x20of\x20dark\x20objects,\x20sacrificial\x20magic,\x20and\x20ancient\x20spellwork\x20is\x20the\x20resource\x20that\x20did\x20not\x20exist\x20the\x20first\x20time\x20—\x20the\x20thing\x20that\x20makes\x20the\x20difference\x20between\x20surviving\x20what\x20is\x20coming\x20and\x20not.\x20He\x20agreed\x20knowing\x20the\x20price:\x20that\x20every\x20wound\x20from\x20the\x20original\x20timeline\x20would\x20find\x20him\x20again,\x20that\x20death\x20was\x20already\x20written,\x20that\x20he\x20could\x20see\x20the\x20shape\x20of\x20it\x20clearly.\x20He\x20came\x20anyway.\x20The\x20portrait\x20captures\x20the\x20quality\x20that\x20makes\x20that\x20possible:\x20a\x20man\x20surrounded\x20by\x20the\x20record\x20of\x20everything\x20he\x20has\x20learned\x20in\x20place\x20of\x20everything\x20he\x20lost,\x20entirely\x20clear-eyed\x20about\x20what\x20the\x20room\x20around\x20him\x20cost,\x20still\x20thinking\x20about\x20what\x20to\x20do\x20with\x20it\x20next.'}},{'url':_0x3b4080(0x14d),'title':_0x3b4080(0xa6),'titlePosition':'top','pov':'Elijah\x20Mikaelson','color':_0x3b4080(0xfb),'comment':null},{'url':_0x3b4080(0xff),'title':'Cleo\x20Sowande\x20-\x20POV\x20Transitioning\x20Portrait','titlePosition':'top','pov':'Cleo\x20Sowande','color':_0x3b4080(0x11e),'comment':null},{'url':_0x3b4080(0xc6),'title':_0x3b4080(0xa9),'titlePosition':'top','pov':_0x3b4080(0xc8),'color':_0x3b4080(0xfb),'comment':null},{'url':_0x3b4080(0xe0),'title':_0x3b4080(0x140),'titlePosition':_0x3b4080(0x9b),'pov':'Bonnie\x20Bennett','color':_0x3b4080(0xfb),'comment':null},{'url':_0x3b
