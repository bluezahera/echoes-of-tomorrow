<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0806;--bg2:#110904;--bg3:#1a0f06;
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.3);--gold-glow:rgba(201,168,76,.12);
  --text:#e8d8b0;--text-dim:#9b7a4a;--text-muted:#7a5e32;
  --border:rgba(139,106,58,.22);--border-gold:rgba(201,168,76,.38);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;font-size:16px}

/* ── Header ── */
.hdr{
  background:linear-gradient(180deg,#0a0603 0%,#110904 100%);
  border-bottom:1px solid var(--border-gold);
  padding:22px 28px 20px;
  position:relative;
  display:flex;
  align-items:center;
  gap:28px;
}
.hdr-back{
  flex-shrink:0;
  display:inline-flex;align-items:center;gap:7px;
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  text-decoration:none;letter-spacing:1px;cursor:pointer;
  padding:8px 16px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.7);
  transition:all .22s;
  white-space:nowrap;
}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.hdr-text{flex:1;text-align:center}
.hdr-eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.hdr-title{font-family:'Ephesis',cursive;font-size:60px;color:#d42020;line-height:1.05;text-shadow:0 2px 24px rgba(180,20,20,.45)}
.hdr-sub{font-family:'Cormorant Upright',serif;font-size:20px;font-weight:600;color:var(--gold);margin-top:8px;letter-spacing:.8px}
.hdr-rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:14px auto 0}

/* ── Header Carousel ── */
/* ── Header Carousel ── */
.hdr-carousel{
  flex:0 0 230px;height:195px;
  position:relative;overflow:hidden;
  border-radius:10px;
  background:rgba(0,0,0,.25);
}
.car-stage{position:relative;width:100%;height:100%}
.car-img{
  position:absolute;top:50%;left:50%;
  width:124px;height:155px;       /* 4:5 portrait — matches 3200×4000 source */
  object-fit:cover;border-radius:8px;
  border:1px solid rgba(201,168,76,.18);
  transition:transform .92s cubic-bezier(.4,0,.2,1),opacity .92s cubic-bezier(.4,0,.2,1);
  will-change:transform,opacity;
}
.car-img.car-active{
  transform:translate(-50%,-50%) scale(1.22);  /* 151×189px — fits 195px tall container */
  opacity:1;z-index:4;
  box-shadow:0 6px 24px rgba(0,0,0,.85),0 0 0 2px rgba(201,168,76,.45),0 0 14px rgba(201,168,76,.15);
}
.car-img.car-entering{
  transform:translate(calc(-50% + 64px),-50%) scale(0.72);
  opacity:.62;z-index:2;
}
.car-img.car-exiting{
  transform:translate(calc(-50% - 180px),-50%) scale(0.70);
  opacity:0;z-index:2;
}
.car-img.car-hidden{
  transform:translate(calc(-50% + 185px),-50%) scale(0.70);
  opacity:0;z-index:1;
  transition:none;
}

/* ── Category Tabs ── */
.cat-nav{
  display:flex;justify-content:center;gap:10px;
  padding:22px 32px 0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.cat-tab{
  padding:10px 30px 11px;border-radius:22px 22px 0 0;
  border:1px solid transparent;border-bottom:none;
  background:transparent;
  color:var(--text-dim);
  font-family:'Charm',cursive;font-size:18px;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  position:relative;bottom:-1px;
}
.cat-tab:hover{color:var(--text);background:var(--gold-glow)}
.cat-tab.active{
  background:var(--bg2);color:var(--gold);
  border-color:var(--border-gold);border-bottom-color:var(--bg2);
}

/* ── Gallery Wrap ── */
.gallery-wrap{
  background:var(--bg2);
  min-height:72vh;
  padding:32px 36px 48px;
}
.gallery-section{display:none}
.gallery-section.active{display:block}
.gallery-empty{
  text-align:center;padding:90px 20px;
  color:var(--text-muted);font-style:italic;font-size:20px;
  font-family:'Cormorant Garamond',serif;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:22px;
}

/* ── Image Card ── */
.g-card{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s;
  position:relative;
}
.g-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,168,76,.22);
  border-color:var(--border-gold);
}
.g-thumb-wrap{
  position:relative;width:100%;padding-bottom:125%; /* default 4:5 (3200×4000 book artwork) */
  overflow:hidden;background:#080503;cursor:pointer;
}
/* Book Artwork — contain so the full image always shows inside the frame */
#grid-book .g-thumb-wrap img{object-fit:contain}
/* Character portraits are 8.5"×11" → height:width = 11÷8.5 = 129.41% */
#grid-characters .g-thumb-wrap{padding-bottom:129.41%}
.g-thumb-wrap img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  transition:transform .38s;
  display:block;
}
.g-card:hover .g-thumb-wrap img{transform:scale(1.05)}
.g-zoom-hint{
  position:absolute;inset:0;
  background:rgba(0,0,0,0);transition:background .22s;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.g-card:hover .g-zoom-hint{background:rgba(0,0,0,.18)}
.g-zoom-icon{
  opacity:0;transform:scale(.7);transition:opacity .22s,transform .22s;
  width:44px;height:44px;border-radius:50%;
  background:rgba(12,8,4,.75);border:1px solid var(--border-gold);
  display:flex;align-items:center;justify-content:center;
}
.g-card:hover .g-zoom-icon{opacity:1;transform:scale(1)}
.g-zoom-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.8}

/* Title top / bottom */
.g-title{
  padding:10px 14px;
  font-family:'Charm',cursive;font-size:17px;
  color:var(--gold);letter-spacing:.3px;
  text-align:center;line-height:1.3;
}
.g-title.top{border-bottom:1px solid var(--border)}
.g-title.bottom{border-top:1px solid var(--border)}

/* Comment button */
.g-note-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:9px 14px;
  background:rgba(201,168,76,.05);
  border:none;border-top:1px solid var(--border);
  color:var(--text-muted);font-family:'Charm',cursive;font-size:13px;
  letter-spacing:1.2px;text-transform:uppercase;
  cursor:pointer;transition:all .18s;
}
.g-note-btn:hover{background:var(--gold-glow);color:var(--gold)}
.g-note-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}

/* ── Lightbox ── */
.lb-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(4,2,1,.93);
  align-items:center;justify-content:center;
  padding:20px;
}
.lb-overlay.open{display:flex}
.lb-wrap{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  max-width:92vw;max-height:92vh;
}
.lb-img{
  max-width:88vw;max-height:78vh;
  object-fit:contain;
  border:1px solid var(--border-gold);
  border-radius:4px;
  display:block;
}
.lb-close{
  position:absolute;top:-16px;right:-16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(16,8,4,.92);border:1px solid var(--border-gold);
  color:var(--gold);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;line-height:1;font-family:'Charm',cursive;
  flex-shrink:0;
}
.lb-close:hover{background:rgba(201,168,76,.15);transform:scale(1.08)}
.lb-footer{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-top:14px;
}
.lb-title{
  font-family:'Charm',cursive;font-size:20px;
  color:var(--gold);letter-spacing:.8px;text-align:center;
}
.lb-note-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 22px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.8);
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  transition:all .2s;
}
.lb-note-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.lb-note-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Comment / Book-Page Overlay ── */
.cm-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(4,2,1,.88);
  align-items:center;justify-content:center;
  padding:24px;
}
.cm-overlay.open{display:flex}
.cm-page{
  background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;
  color:#1a0a02;
  border-radius:6px;
  border:1px solid rgba(155,115,42,.45);
  box-shadow:
    0 24px 70px rgba(0,0,0,.72),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 0 60px rgba(120,90,28,.06);
  max-width:600px;width:100%;max-height:82vh;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}
/* Spine shadow on left edge */
.cm-page::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:34px;
  background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);
  pointer-events:none;
}
/* Top edge sheen */
.cm-page::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);
  pointer-events:none;
}
/* Ruling lines beneath body text (decorative) */
.cm-page-inner{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.cm-hdr{
  padding:28px 32px 16px 44px;
  border-bottom:1px solid rgba(155,115,42,.18);
  flex-shrink:0;
}
.cm-page-title{
  font-family:'Charm',cursive;font-size:28px;font-weight:700;
  color:#7a4010;line-height:1.2;
  text-shadow:0 1px 3px rgba(0,0,0,.13);
}
.cm-page-sub{
  font-family:'Playfair Display',serif;font-size:19px;font-weight:700;
  color:#7a4010;margin-top:7px;font-style:normal;
}
.cm-scroll{
  flex:1;overflow-y:auto;
  padding:18px 32px 22px 44px;
}
.cm-scroll::-webkit-scrollbar{width:4px}
.cm-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3)}
.cm-text{
  font-family:'Lora',serif;font-size:16px;font-style:italic;
  color:#1a0a02;line-height:1.88;
}
.cm-text p{margin-bottom:.9em}
.cm-text p:last-child{margin-bottom:0}
.cm-text p.cm-sub-inline{
  font-family:'Playfair Display',serif;font-size:18px;font-weight:700;
  font-style:normal;color:#7a4010;
  margin:1em 0 .25em;line-height:1.3;
}
.cm-foot{
  padding:12px 32px 16px 44px;
  border-top:1px solid rgba(155,115,42,.18);
  display:flex;justify-content:flex-end;flex-shrink:0;
}
.cm-btn-close{
  padding:8px 24px;border-radius:20px;
  background:rgba(155,115,42,.1);
  border:1px solid rgba(155,115,42,.35);
  color:#4a2e0a;font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase;
}
.cm-btn-close:hover{background:rgba(155,115,42,.22)}
.cm-x{
  position:absolute;top:13px;right:14px;
  background:none;border:none;
  color:#4a2e0a;font-size:20px;cursor:pointer;
  padding:4px 8px;border-radius:4px;
  line-height:1;transition:background .15s;font-weight:700;
}
.cm-x:hover{background:rgba(155,115,42,.15)}

/* ── Footer ── */
.gal-foot{
  padding:26px 32px;
  background:var(--bg);
  border-top:1px solid var(--border);
  text-align:center;
}
.gal-foot-link{
  font-family:'Charm',cursive;font-size:15px;
  color:var(--text-muted);letter-spacing:.8px;
  cursor:pointer;background:none;border:none;
  text-decoration:none;transition:color .2s;
  padding:0 2px;
}
.gal-foot-link:hover{color:var(--gold)}
.gal-foot-sep{margin:0 14px;color:var(--border);font-size:14px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <button class="hdr-back" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;border-radius:2px">
    Flipbook
  </button>
  <div class="hdr-text">
    <div class="hdr-eyebrow">Image Gallery</div>
    <div class="hdr-title">Echoes of Tomorrow</div>
    <div class="hdr-sub">A Vampire Diaries Universe Fan Novel</div>
    <div class="hdr-rule"></div>
  </div>
  <div class="hdr-carousel">
    <div class="car-stage">
      <img class="car-img car-active"   src="https://lh3.googleusercontent.com/d/1xe9XBsKuzg1qa7s4nWAnvUJozPygooFQ" alt="">
      <img class="car-img car-entering" src="https://lh3.googleusercontent.com/d/1u9I46kFDu9ZKDSFDu4ciKfZi8zkgvUkk" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1LKJrRB5b4BaXokYJ6b7JuzI7o80CsxBt" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1t2rFv-2vDX1uX0gOnOxqNdYq27yNi2ON" alt="">
    </div>
  </div>
</header>

<!-- Category Navigation -->
<nav class="cat-nav">
  <button class="cat-tab active" id="tab-book" onclick="switchCat('book')">Book Artwork</button>
  <button class="cat-tab" id="tab-characters" onclick="switchCat('characters')">Characters Artwork</button>
</nav>

<!-- Gallery Content -->
<main class="gallery-wrap">
  <div class="gallery-section active" id="section-book">
    <div class="gallery-grid" id="grid-book"></div>
    <div class="gallery-empty" id="empty-book" style="display:none">No book artwork has been added yet.</div>
  </div>
  <div class="gallery-section" id="section-characters">
    <div class="gallery-grid" id="grid-characters"></div>
    <div class="gallery-empty" id="empty-characters" style="display:none">No character artwork has been added yet.</div>
  </div>
</main>

<!-- Footer -->
<footer class="gal-foot">
  <button class="gal-foot-link" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;vertical-align:middle;margin-right:7px;border-radius:2px">Read the Flipbook
  </button>
  <span class="gal-foot-sep">|</span>
  <button class="gal-foot-link" onclick="galScrollTop()">
    Back to Top<img src="https://lh3.googleusercontent.com/d/1UdXIzhjLnglrTz14xu_yOS51hdYCAszS" style="height:18px;width:auto;object-fit:contain;vertical-align:middle;margin-left:6px">
  </button>
</footer>

<!-- Lightbox Overlay -->
<div class="lb-overlay" id="lb-overlay" onclick="lbBgClick(event)">
  <div class="lb-wrap" id="lb-wrap">
    <button class="lb-close" onclick="closeLb()" title="Close">&#215;</button>
    <img class="lb-img" id="lb-img" src="" alt="">
    <div class="lb-footer">
      <div class="lb-title" id="lb-title" style="display:none"></div>
      <button class="lb-note-btn" id="lb-note-btn" onclick="openNote()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h8"/></svg>
        Read About This Image
      </button>
    </div>
  </div>
</div>

<!-- Comment / Book-Page Overlay -->
<div class="cm-overlay" id="cm-overlay" onclick="noteBgClick(event)">
  <div class="cm-page" id="cm-page">
    <button class="cm-x" onclick="closeNote()">&#215;</button>
    <div class="cm-page-inner">
      <div class="cm-hdr">
        <div class="cm-page-title" id="cm-title"></div>
        <div class="cm-page-sub" id="cm-sub" style="display:none"></div>
      </div>
      <div class="cm-scroll">
        <div class="cm-text" id="cm-body"></div>
      </div>
      <div class="cm-foot">
        <button class="cm-btn-close" onclick="closeNote()">Close</button>
      </div>
    </div>

single\x20statement\x20this\x20page\x20is\x20making\x20before\x20the\x20story\x20begins.\x0a\x0a!!Metal\x20in\x20the\x20Forge!!\x0a\x0aThe\x20letters\x20of\x20**Echoes\x20of\x20Tomorrow**\x20glow\x20red-hot.\x20Not\x20painted,\x20not\x20written\x20—\x20heated.\x20The\x20title\x20burns\x20with\x20the\x20color\x20of\x20metal\x20that\x20has\x20been\x20heated\x20into\x20the\x20state\x20where\x20it\x20can\x20be\x20reshaped\x20into\x20something\x20it\x20was\x20not\x20before.\x20This\x20is\x20the\x20story\x27s\x20central\x20act\x20made\x20visible\x20in\x20the\x20title\x20itself:\x20the\x20present\x20is\x20being\x20reforged.\x20The\x20timeline\x20the\x20travelers\x20stepped\x20into\x20is\x20not\x20fixed.\x20It\x20is\x20material.\x20It\x20is\x20in\x20the\x20forge\x20right\x20now,\x20while\x20you\x20are\x20reading,\x20being\x20beaten\x20against\x20the\x20past\x20until\x20it\x20takes\x20a\x20different\x20shape.\x20The\x20glowing\x20red\x20letters\x20are\x20a\x20statement\x20of\x20process\x20—\x20this\x20is\x20what\x20is\x20happening.\x20It\x20started\x20before\x20the\x20first\x20chapter\x20opened.\x0a\x0a!!The\x20Blood\x20That\x20Cannot\x20Be\x20Contained!!\x0a\x0aReforging\x20is\x20never\x20clean.\x20Blood\x20pools\x20at\x20the\x20base\x20of\x20each\x20letter\x20and\x20drips\x20downward\x20from\x20the\x20curves\x20and\x20strokes\x20of\x20the\x20script\x20—\x20not\x20ink,\x20not\x20paint,\x20but\x20the\x20consequence\x20of\x20what\x20reshaping\x20the\x20timeline\x20requires.\x20Every\x20life\x20altered.\x20Every\x20sacrifice\x20made\x20or\x20yet\x20to\x20be\x20made.\x20Every\x20drop\x20of\x20blood\x20spilled\x20in\x20the\x20original\x20timeline\x20and\x20in\x20this\x20one,\x20by\x20the\x20travelers\x20and\x20by\x20those\x20around\x20them,\x20in\x20the\x20name\x20of\x20preventing\x20the\x20extinction\x20of\x20the\x20supernatural\x20races.\x20The\x20blood\x20does\x20not\x20stop\x20at\x20the\x20letters\x27\x20edges\x20because\x20consequence\x20does\x20not\x20stop\x20at\x20intention\x27s\x20edges.\x20It\x20runs.\x20It\x20pools.\x20It\x20falls\x20toward\x20the\x20bottom\x20of\x20the\x20page\x20in\x20drops\x20that\x20cannot\x20be\x20recalled\x20once\x20they\x20have\x20left\x20the\x20letterform,\x20because\x20that\x20is\x20the\x20nature\x20of\x20blood\x20spilled\x20in\x20the\x20service\x20of\x20something\x20you\x20have\x20decided\x20matters\x20more\x20than\x20the\x20price\x20of\x20it.\x20The\x20reforging\x20demands\x20it.\x20The\x20page\x20does\x20not\x20pretend\x20otherwise.\x0a\x0a!!What\x20Simplicity\x20Does!!\x0a\x0aAfter\x20the\x20richly\x20layered\x20front\x20cover\x20—\x20the\x20ornamental\x20frame,\x20the\x20clock\x20held\x20in\x20blood\x20tendrils,\x20the\x20green\x20gems,\x20the\x20bronze\x20detail\x20—\x20the\x20title\x20page\x20arrives\x20as\x20a\x20silence.\x20The\x20complexity\x20falls\x20away\x20and\x20what\x20remains\x20is\x20parchment,\x20fire,\x20and\x20blood.\x20The\x20reforging\x20and\x20its\x20cost.\x20In\x20a\x20story\x20about\x20people\x20who\x20crossed\x20time\x20carrying\x20everything\x20they\x20could\x20not\x20leave\x20behind,\x20stripped\x20down\x20to\x20nothing\x20except\x20their\x20memories,\x20the\x20choices\x20they\x20could\x20not\x20take\x20back,\x20and\x20the\x20irreversible\x20things\x20they\x20agreed\x20to\x20do,\x20the\x20title\x20page\x20understands\x20its\x20own\x20assignment\x20precisely.\x20It\x20gives\x20you\x20the\x20name\x20of\x20what\x20you\x20are\x20about\x20to\x20read.\x20It\x20shows\x20you\x20what\x20that\x20name\x20is\x20made\x20of\x20and\x20what\x20it\x20is\x20costing.\x20Then\x20it\x20steps\x20aside\x20and\x20lets\x20the\x20story\x20begin.'}},{'url':'https://lh3.googleusercontent.com/d/1g6txVcVyrwc3ySBlNc80tmEXaDwa2fa1','title':_0x5aba20(0x1a2),'titlePosition':'top','pov':'','color':'','comment':{'title':_0x5aba20(0x1db),'body':'The\x20bookmark\x20is\x20a\x20vertical\x20composition\x20that\x20extends\x20the\x20visual\x20language\x20of\x20the\x20logo\x20into\x20a\x20new\x20shape\x20—\x20tall\x20and\x20narrow,\x20the\x20form\x20that\x20has\x20marked\x20pages\x20in\x20physical\x20books\x20for\x20centuries,\x20now\x20carrying\x20the\x20full\x20weight\x20of\x20this\x20story\x27s\x20imagery\x20within\x20it.\x20The\x20same\x20living\x20energy\x20moves\x20through\x20the\x20bookmark\x20that\x20moves\x20through\x20the\x20logo:\x20the\x20green\x20of\x20the\x20oldest\x20force\x20in\x20the\x20story\x20threading\x20alongside\x20traces\x20of\x20red\x20and\x20gold,\x20the\x20grey\x20smoke\x20of\x20the\x20death\x20realms\x20breathing\x20behind\x20everything,\x20the\x20ancient\x20temple\x20on\x20one\x20side\x20and\x20the\x20modern\x20city\x20street\x20on\x20the\x20other\x20—\x20the\x20two\x20worlds\x20this\x20story\x20holds\x20simultaneously,\x20always\x20present\x20together,\x20neither\x20one\x20releasing\x20the\x20other.\x0a\x0a!!The\x20Instruments\x20of\x20Navigation!!\x0a\x0aBut\x20the\x20bookmark\x20adds\x20elements\x20the\x20logo\x20does\x20not\x20carry.\x20It\x20is\x20specifically\x20about\x20the\x20tracking\x20of\x20time\x20and\x20place\x20—\x20about\x20orientation\x20within\x20a\x20story\x20where\x20both\x20are\x20unstable.\x20The\x20North\x20Star\x20anchors\x20the\x20base,\x20the\x20fixed\x20point\x20by\x20which\x20everything\x20else\x20is\x20navigated.\x20A\x20gold\x20arrow\x20points\x20directly\x20upward\x20over\x20the\x20vortex\x20portal,\x20marking\x20the\x20direction\x20of\x20the\x20temporal\x20current,\x20the\x20way\x20through.\x20An\x20hourglass\x20measures\x20duration\x20—\x20not\x20the\x20hours\x20of\x20a\x20day\x20but\x20the\x20weight\x20of\x20borrowed\x20time,\x20time\x20pressing\x20on\x20the\x20people\x20who\x20came\x20back\x20with\x20a\x20finite\x20window\x20to\x20change\x20what\x20they\x20came\x20back\x20to\x20change.\x20A\x20metal\x20atom\x20turns\x20under\x20the\x20clock,\x20the\x20structure\x20of\x20matter\x20itself\x20held\x20under\x20the\x20mechanism\x20of\x20the\x20story\x27s\x20cosmic\x20stakes.\x0a\x0a!!Two\x20Clocks,\x20Two\x20Timelines!!\x0a\x0aAt\x20the\x20heart\x20of\x20the\x20bookmark\x20is\x20a\x20large\x20clock\x20—\x20clear-faced,\x20its\x20Roman\x20numerals\x20precise,\x20its\x20hands\x20readable.\x20This\x20is\x20the\x20timeline\x20that\x20has\x20already\x20been\x20set:\x20history\x20as\x20it\x20existed\x20before\x20the\x20travelers\x20arrived,\x20fixed\x20and\x20legible\x20and\x20done.\x20But\x20inside\x20that\x20clock,\x20contained\x20within\x20it,\x20exist\x20a\x20smaller\x20clock.\x20And\x20on\x20that\x20smaller\x20clock,\x20some\x20of\x20the\x20numerals\x20are\x20not\x20fully\x20shaped.\x20They\x20are\x20partially\x20formed,\x20their\x20outlines\x20unclear,\x20their\x20meaning\x20not\x20yet\x20resolved.\x20This\x20is\x20the\x20present\x20timeline\x20—\x20the\x20one\x20the\x20travelers\x20are\x20inside\x20of\x20right\x20now,\x20the\x20one\x20that\x20is\x20still\x20being\x20reshaped\x20by\x20every\x20choice\x20they\x20make\x20and\x20every\x20event\x20they\x20manage\x20to\x20alter.\x20It\x20has\x20not\x20locked\x20into\x20place.\x20It\x20is\x20still\x20becoming.\x20The\x20story\x20you\x20are\x20reading\x20exists\x20inside\x20that\x20smaller\x20clock,\x20in\x20the\x20unresolved\x20space\x20between\x20what\x20was\x20and\x20what\x20will\x20be,\x20in\x20the\x20moment\x20before\x20the\x20hands\x20settle\x20and\x20the\x20future\x20becomes\x20fixed.\x0a\x0a!!What\x20Holds\x20Your\x20Place!!\x0a\x0aThis\x20bookmark\x20is\x20holding\x20more\x20than\x20your\x20place\x20in\x20the\x20book.\x20It\x20is\x20holding\x20the\x20image\x20of\x20the\x20story\x27s\x20central\x20condition:\x20a\x20present\x20moment\x20that\x20is\x20still\x20in\x20motion,\x20watched\x20over\x20by\x20every\x20instrument\x20of\x20navigation\x20and\x20time\x20that\x20the\x20story\x20has\x20to\x20offer,\x20waiting\x20to\x20see\x20which\x20way\x20it\x20resolves.'}},{'url':_0x5aba20(0x19b),'title':_0x5aba20(0x1ce),'titlePosition':'top','pov':'','color':'','comment':{'title':_0x5aba20(0x185),'body':_0x5aba20(0x15d)}},{'url':_0x5aba20(0x18e),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Back\x20Bottom','titlePosition':_0x5aba20(0x1dd),'pov':'','color':'','comment':{'title':_0x5aba20(0x1d3),'body':_0x5aba20(0x17c)}},{'url':_0x5aba20(0x175),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Next\x20Bottom','titlePosition':_0x5aba20(0x1dd),'pov':'','color':'','comment':{'title':'Right\x20Arrow','body':_0x5aba20(0x193)}},{'url':_0x5aba20(0x191),'title':_0x5aba20(0x194),'titlePosition':'top','pov':'','color':'','comment':{'title':_0x5aba20(0x177),'body':_0x5aba20(0x196)}},{'url':_0x5aba20(0x17a),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Gallery\x20Bottom','titlePosition':'top','pov':'','color':'','comment':{'title':_0x5aba20(0x15c),'body':'The\x20gallery\x20holds\x20the\x20visual\x20record\x20of\x20this\x20story\x27s\x20world\x20—\x20the\x20places\x20that\x20shaped\x20it,\x20the\x20characters\x20who\x20lived\x20inside\x20it,\x20the\x20artwork\x20created\x20to\x20give\x20readers\x20a\x20way\x20to\x20see\x20what\x20the\x20words\x20describe.\x20Every\x20supernatural\x20world\x20has\x20a\x20history\x20that\x20predates\x20its\x20documentation,\x20and\x20**Echoes\x20of\x20Tomorrow**\x20is\x20no\x20exception.\x20The\x20ancient\x20temple\x20and\x20the\x20modern\x20city\x20street,\x20the\x20clock\x27s\x20exposed\x20mechanisms,\x20the\x20green\x20energy\x20of\x20a\x20magic\x20older\x20than\x20recorded\x20history\x20—\x20these\x20are\x20not\x20illustrations.\x20They\x20are\x20visual\x20evidence.\x20The\x20gallery\x20is\x20where\x20that\x20evidence\x20is\x20kept.\x0a\x0aThe\x20icon\x20itself\x20is\x20a\x20journal\x20clasped\x20shut\x20—\x20weathered,\x20marked,\x20carrying\x20the\x20same\x20blood,\x20\x20vine\x20work,\x20and\x20clockwork\x20detail\x20that\x20runs\x20through\x20the\x20entire\x20flipbook\x27s\x20visual\x20language.\x20A\x20stack\x20of\x20images\x20slips\x20out\x20from\x20its\x20pages,\x20partially\x20visible,\x20not\x20yet\x20fully\x20revealed.\x20That\x20is\x20exactly\x20the\x20relations 0speed\x20is\x20woven\x20into\x20theirs.\x20The\x20night\x20his\x20mother\x20made\x20him\x20immortal,\x20she\x20took\x20it\x20from\x20him.\x20Vampires\x20cannot\x20perform\x20magic.\x20The\x20transformation\x20is\x20permanent,\x20the\x20loss\x20is\x20permanent,\x20and\x20Kol\x20has\x20spent\x20a\x20thousand\x20years\x20inside\x20that\x20absence\x20—\x20obsessed,\x20methodical,\x20relentless\x20in\x20the\x20accumulation\x20of\x20everything\x20he\x20can\x20no\x20longer\x20do\x20himself.\x20He\x20has\x20become,\x20in\x20the\x20centuries\x20since,\x20the\x20living\x20person\x20with\x20the\x20most\x20magical\x20knowledge\x20on\x20the\x20planet.\x20None\x20of\x20it\x20gives\x20back\x20what\x20was\x20taken.\x20He\x20studies\x20it\x20anyway.\x0a\x0a!!The\x20Image!!\x0a\x0aKol\x20stands\x20in\x20a\x20room\x20that\x20is\x20half\x20archive,\x20half\x20ritual\x20space\x20—\x20ancient\x20tomes\x20stacked\x20with\x20the\x20particular\x20order\x20of\x20someone\x20who\x20has\x20been\x20doing\x20this\x20for\x20a\x20very\x20long\x20time,\x20candles\x20burning\x20with\x20light\x20that\x20makes\x20the\x20shadows\x20directional,\x20a\x20runic\x20circle\x20on\x20the\x20stone\x20floor\x20still\x20faintly\x20luminous\x20from\x20recent\x20work.\x20His\x20name\x20burns\x20in\x20the\x20background\x20in\x20electric\x20red,\x20modern\x20script\x20over\x20an\x20ancient\x20setting,\x20a\x20signature\x20from\x20a\x20man\x20who\x20has\x20never\x20belonged\x20entirely\x20to\x20any\x20single\x20century.\x20He\x20is\x20not\x20reading.\x20He\x20is\x20well\x20past\x20reading.\x20He\x20stands\x20in\x20the\x20middle\x20of\x20everything\x20he\x20has\x20learned\x20and\x20holds\x20it\x20the\x20way\x20a\x20person\x20holds\x20something\x20that\x20cost\x20them\x20everything\x20to\x20acquire\x20and\x20still\x20cannot\x20fill\x20the\x20specific\x20shape\x20of\x20what\x20they\x20lost.\x0a\x0a!!What\x20This\x20Image\x20Holds!!\x0a\x0aThe\x20books\x20are\x20not\x20trophies.\x20The\x20runic\x20circle\x20is\x20not\x20
