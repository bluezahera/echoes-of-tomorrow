<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0806;--bg2:#110904;--bg3:#1a0f06;
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.3);--gold-glow:rgba(201,168,76,.12);
  --text:#e8d8b0;--text-dim:#9b7a4a;--text-muted:#7a5e32;
  --border:rgba(139,106,58,.22);--border-gold:rgba(201,168,76,.38);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;font-size:16px}

/* ── Header ── */
.hdr{
  background:linear-gradient(180deg,#0a0603 0%,#110904 100%);
  border-bottom:1px solid var(--border-gold);
  padding:22px 28px 20px;
  position:relative;
  display:flex;
  align-items:center;
  gap:28px;
}
.hdr-back{
  flex-shrink:0;
  display:inline-flex;align-items:center;gap:7px;
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  text-decoration:none;letter-spacing:1px;cursor:pointer;
  padding:8px 16px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.7);
  transition:all .22s;
  white-space:nowrap;
}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.hdr-text{flex:1;text-align:center}
.hdr-eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.hdr-title{font-family:'Ephesis',cursive;font-size:60px;color:#d42020;line-height:1.05;text-shadow:0 2px 24px rgba(180,20,20,.45)}
.hdr-sub{font-family:'Cormorant Upright',serif;font-size:20px;font-weight:600;color:var(--gold);margin-top:8px;letter-spacing:.8px}
.hdr-rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:14px auto 0}

/* ── Header Carousel ── */
/* ── Header Carousel ── */
.hdr-carousel{
  flex:0 0 230px;height:195px;
  position:relative;overflow:hidden;
  border-radius:10px;
  background:rgba(0,0,0,.25);
}
.car-stage{position:relative;width:100%;height:100%}
.car-img{
  position:absolute;top:50%;left:50%;
  width:124px;height:155px;       /* 4:5 portrait — matches 3200×4000 source */
  object-fit:cover;border-radius:8px;
  border:1px solid rgba(201,168,76,.18);
  transition:transform .92s cubic-bezier(.4,0,.2,1),opacity .92s cubic-bezier(.4,0,.2,1);
  will-change:transform,opacity;
}
.car-img.car-active{
  transform:translate(-50%,-50%) scale(1.22);  /* 151×189px — fits 195px tall container */
  opacity:1;z-index:4;
  box-shadow:0 6px 24px rgba(0,0,0,.85),0 0 0 2px rgba(201,168,76,.45),0 0 14px rgba(201,168,76,.15);
}
.car-img.car-entering{
  transform:translate(calc(-50% + 64px),-50%) scale(0.72);
  opacity:.62;z-index:2;
}
.car-img.car-exiting{
  transform:translate(calc(-50% - 180px),-50%) scale(0.70);
  opacity:0;z-index:2;
}
.car-img.car-hidden{
  transform:translate(calc(-50% + 185px),-50%) scale(0.70);
  opacity:0;z-index:1;
  transition:none;
}

/* ── Category Tabs ── */
.cat-nav{
  display:flex;justify-content:center;gap:10px;
  padding:22px 32px 0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.cat-tab{
  padding:10px 30px 11px;border-radius:22px 22px 0 0;
  border:1px solid transparent;border-bottom:none;
  background:transparent;
  color:var(--text-dim);
  font-family:'Charm',cursive;font-size:18px;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  position:relative;bottom:-1px;
}
.cat-tab:hover{color:var(--text);background:var(--gold-glow)}
.cat-tab.active{
  background:var(--bg2);color:var(--gold);
  border-color:var(--border-gold);border-bottom-color:var(--bg2);
}

/* ── Gallery Wrap ── */
.gallery-wrap{
  background:var(--bg2);
  min-height:72vh;
  padding:32px 36px 48px;
}
.gallery-section{display:none}
.gallery-section.active{display:block}
.gallery-empty{
  text-align:center;padding:90px 20px;
  color:var(--text-muted);font-style:italic;font-size:20px;
  font-family:'Cormorant Garamond',serif;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:22px;
}

/* ── Image Card ── */
.g-card{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s;
  position:relative;
}
.g-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,168,76,.22);
  border-color:var(--border-gold);
}
.g-thumb-wrap{
  position:relative;width:100%;padding-bottom:125%; /* default 4:5 (3200×4000 book artwork) */
  overflow:hidden;background:#080503;cursor:pointer;
}
/* Book Artwork — contain so the full image always shows inside the frame */
#grid-book .g-thumb-wrap img{object-fit:contain}
/* Character portraits are 8.5"×11" → height:width = 11÷8.5 = 129.41% */
#grid-characters .g-thumb-wrap{padding-bottom:129.41%}
.g-thumb-wrap img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  transition:transform .38s;
  display:block;
}
.g-card:hover .g-thumb-wrap img{transform:scale(1.05)}
.g-zoom-hint{
  position:absolute;inset:0;
  background:rgba(0,0,0,0);transition:background .22s;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.g-card:hover .g-zoom-hint{background:rgba(0,0,0,.18)}
.g-zoom-icon{
  opacity:0;transform:scale(.7);transition:opacity .22s,transform .22s;
  width:44px;height:44px;border-radius:50%;
  background:rgba(12,8,4,.75);border:1px solid var(--border-gold);
  display:flex;align-items:center;justify-content:center;
}
.g-card:hover .g-zoom-icon{opacity:1;transform:scale(1)}
.g-zoom-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.8}

/* Title top / bottom */
.g-title{
  padding:10px 14px;
  font-family:'Charm',cursive;font-size:17px;
  color:var(--gold);letter-spacing:.3px;
  text-align:center;line-height:1.3;
}
.g-title.top{border-bottom:1px solid var(--border)}
.g-title.bottom{border-top:1px solid var(--border)}

/* Comment button */
.g-note-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:9px 14px;
  background:rgba(201,168,76,.05);
  border:none;border-top:1px solid var(--border);
  color:var(--text-muted);font-family:'Charm',cursive;font-size:13px;
  letter-spacing:1.2px;text-transform:uppercase;
  cursor:pointer;transition:all .18s;
}
.g-note-btn:hover{background:var(--gold-glow);color:var(--gold)}
.g-note-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}

/* ── Lightbox ── */
.lb-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(4,2,1,.93);
  align-items:center;justify-content:center;
  padding:20px;
}
.lb-overlay.open{display:flex}
.lb-wrap{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  max-width:92vw;max-height:92vh;
}
.lb-img{
  max-width:88vw;max-height:78vh;
  object-fit:contain;
  border:1px solid var(--border-gold);
  border-radius:4px;
  display:block;
}
.lb-close{
  position:absolute;top:-16px;right:-16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(16,8,4,.92);border:1px solid var(--border-gold);
  color:var(--gold);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;line-height:1;font-family:'Charm',cursive;
  flex-shrink:0;
}
.lb-close:hover{background:rgba(201,168,76,.15);transform:scale(1.08)}
.lb-footer{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-top:14px;
}
.lb-title{
  font-family:'Charm',cursive;font-size:20px;
  color:var(--gold);letter-spacing:.8px;text-align:center;
}
.lb-note-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 22px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.8);
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  transition:all .2s;
}
.lb-note-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.lb-note-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Comment / Book-Page Overlay ── */
.cm-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(4,2,1,.88);
  align-items:center;justify-content:center;
  padding:24px;
}
.cm-overlay.open{display:flex}
.cm-page{
  background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;
  color:#1a0a02;
  border-radius:6px;
  border:1px solid rgba(155,115,42,.45);
  box-shadow:
    0 24px 70px rgba(0,0,0,.72),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 0 60px rgba(120,90,28,.06);
  max-width:600px;width:100%;max-height:82vh;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}
/* Spine shadow on left edge */
.cm-page::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:34px;
  background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);
  pointer-events:none;
}
/* Top edge sheen */
.cm-page::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);
  pointer-events:none;
}
/* Ruling lines beneath body text (decorative) */
.cm-page-inner{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.cm-hdr{
  padding:28px 32px 16px 44px;
  border-bottom:1px solid rgba(155,115,42,.18);
  flex-shrink:0;
}
.cm-page-title{
  font-family:'Charm',cursive;font-size:28px;font-weight:700;
  color:#7a4010;line-height:1.2;
  text-shadow:0 1px 3px rgba(0,0,0,.13);
}
.cm-page-sub{
  font-family:'Playfair Display',serif;font-size:19px;font-weight:700;
  color:#7a4010;margin-top:7px;font-style:normal;
}
.cm-scroll{
  flex:1;overflow-y:auto;
  padding:18px 32px 22px 44px;
}
.cm-scroll::-webkit-scrollbar{width:4px}
.cm-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3)}
.cm-text{
  font-family:'Lora',serif;font-size:16px;font-style:italic;
  color:#1a0a02;line-height:1.88;
}
.cm-text p{margin-bottom:.9em}
.cm-text p:last-child{margin-bottom:0}
.cm-text p.cm-sub-inline{
  font-family:'Playfair Display',serif;font-size:18px;font-weight:700;
  font-style:normal;color:#7a4010;
  margin:1em 0 .25em;line-height:1.3;
}
.cm-foot{
  padding:12px 32px 16px 44px;
  border-top:1px solid rgba(155,115,42,.18);
  display:flex;justify-content:flex-end;flex-shrink:0;
}
.cm-btn-close{
  padding:8px 24px;border-radius:20px;
  background:rgba(155,115,42,.1);
  border:1px solid rgba(155,115,42,.35);
  color:#4a2e0a;font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase;
}
.cm-btn-close:hover{background:rgba(155,115,42,.22)}
.cm-x{
  position:absolute;top:13px;right:14px;
  background:none;border:none;
  color:#4a2e0a;font-size:20px;cursor:pointer;
  padding:4px 8px;border-radius:4px;
  line-height:1;transition:background .15s;font-weight:700;
}
.cm-x:hover{background:rgba(155,115,42,.15)}

/* ── Footer ── */
.gal-foot{
  padding:26px 32px;
  background:var(--bg);
  border-top:1px solid var(--border);
  text-align:center;
}
.gal-foot-link{
  font-family:'Charm',cursive;font-size:15px;
  color:var(--text-muted);letter-spacing:.8px;
  cursor:pointer;background:none;border:none;
  text-decoration:none;transition:color .2s;
  padding:0 2px;
}
.gal-foot-link:hover{color:var(--gold)}
.gal-foot-sep{margin:0 14px;color:var(--border);font-size:14px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <button class="hdr-back" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;border-radius:2px">
    Flipbook
  </button>
  <div class="hdr-text">
    <div class="hdr-eyebrow">Image Gallery</div>
    <div class="hdr-title">Echoes of Tomorrow</div>
    <div class="hdr-sub">A Vampire Diaries Universe Fan Novel</div>
    <div class="hdr-rule"></div>
  </div>
  <div class="hdr-carousel">
    <div class="car-stage">
      <img class="car-img car-active"   src="https://lh3.googleusercontent.com/d/1xe9XBsKuzg1qa7s4nWAnvUJozPygooFQ" alt="">
      <img class="car-img car-entering" src="https://lh3.googleusercontent.com/d/1u9I46kFDu9ZKDSFDu4ciKfZi8zkgvUkk" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1LKJrRB5b4BaXokYJ6b7JuzI7o80CsxBt" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1t2rFv-2vDX1uX0gOnOxqNdYq27yNi2ON" alt="">
    </div>
  </div>
</header>

<!-- Category Navigation -->
<nav class="cat-nav">
  <button class="cat-tab active" id="tab-book" onclick="switchCat('book')">Book Artwork</button>
  <button class="cat-tab" id="tab-characters" onclick="switchCat('characters')">Characters Artwork</button>
</nav>

<!-- Gallery Content -->
<main class="gallery-wrap">
  <div class="gallery-section active" id="section-book">
    <div class="gallery-grid" id="grid-book"></div>
    <div class="gallery-empty" id="empty-book" style="display:none">No book artwork has been added yet.</div>
  </div>
  <div class="gallery-section" id="section-characters">
    <div class="gallery-grid" id="grid-characters"></div>
    <div class="gallery-empty" id="empty-characters" style="display:none">No character artwork has been added yet.</div>
  </div>
</main>

<!-- Footer -->
<footer class="gal-foot">
  <button class="gal-foot-link" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;vertical-align:middle;margin-right:7px;border-radius:2px">Read the Flipbook
  </button>
  <span class="gal-foot-sep">|</span>
  <button class="gal-foot-link" onclick="galScrollTop()">
    Back to Top<img src="https://lh3.googleusercontent.com/d/1UdXIzhjLnglrTz14xu_yOS51hdYCAszS" style="height:18px;width:auto;object-fit:contain;vertical-align:middle;margin-left:6px">
  </button>
</footer>

<!-- Lightbox Overlay -->
<div class="lb-overlay" id="lb-overlay" onclick="lbBgClick(event)">
  <div class="lb-wrap" id="lb-wrap">
    <button class="lb-close" onclick="closeLb()" title="Close">&#215;</button>
    <img class="lb-img" id="lb-img" src="" alt="">
    <div class="lb-footer">
      <div class="lb-title" id="lb-title" style="display:none"></div>
      <button class="lb-note-btn" id="lb-note-btn" onclick="openNote()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h8"/></svg>
        Read About This Image
      </button>
    </div>
  </div>
</div>

<!-- Comment / Book-Page Overlay -->
<div class="cm-overlay" id="cm-overlay" onclick="noteBgClick(event)">
  <div class="cm-page" id="cm-page">
    <button class="cm-x" onclick="closeNote()">&#215;</button>
    <div class="cm-page-inner">
      <div class="cm-hdr">
        <div class="cm-page-title" id="cm-title"></div>
        <div class="cm-page-sub" id="cm-sub" style="display:none"></div>
      </div>
      <div class="cm-scroll">
        <div class="cm-text" id="cm-body"></div>
      </div>
      <div class="cm-foot">
        <button class="cm-btn-close" onclick="closeNote()">Close</button>
      </div>
    </div>

s\x20without\x20cost.'}},{'url':_0x2c0667(0xc3),'title':_0x2c0667(0x174),'titlePosition':_0x2c0667(0xed),'pov':'','color':'','comment':{'title':_0x2c0667(0x157),'body':_0x2c0667(0x183)}},{'url':_0x2c0667(0xe8),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Gallery\x20Bottom','titlePosition':_0x2c0667(0xed),'pov':'','color':'','comment':{'title':_0x2c0667(0x10f),'body':'The\x20gallery\x20holds\x20the\x20visual\x20record\x20of\x20this\x20story\x27s\x20world\x20—\x20the\x20places\x20that\x20shaped\x20it,\x20the\x20characters\x20who\x20lived\x20inside\x20it,\x20the\x20artwork\x20created\x20to\x20give\x20readers\x20a\x20way\x20to\x20see\x20what\x20the\x20words\x20describe.\x20Every\x20supernatural\x20world\x20has\x20a\x20history\x20that\x20predates\x20its\x20documentation,\x20and\x20**Echoes\x20of\x20Tomorrow**\x20is\x20no\x20exception.\x20The\x20ancient\x20temple\x20and\x20the\x20modern\x20city\x20street,\x20the\x20clock\x27s\x20exposed\x20mechanisms,\x20the\x20green\x20energy\x20of\x20a\x20magic\x20older\x20than\x20recorded\x20history\x20—\x20these\x20are\x20not\x20illustrations.\x20They\x20are\x20visual\x20evidence.\x20The\x20gallery\x20is\x20where\x20that\x20evidence\x20is\x20kept.\x0a\x0aThe\x20icon\x20itself\x20is\x20a\x20journal\x20clasped\x20shut\x20—\x20weathered,\x20marked,\x20carrying\x20the\x20same\x20blood,\x20\x20vine\x20work,\x20and\x20clockwork\x20detail\x20that\x20runs\x20through\x20the\x20entire\x20flipbook\x27s\x20visual\x20language.\x20A\x20stack\x20of\x20images\x20slips\x20out\x20from\x20its\x20pages,\x20partially\x20visible,\x20not\x20yet\x20fully\x20revealed.\x20That\x20is\x20exactly\x20the\x20relationship\x20between\x20the\x20navigation\x20button\x20and\x20what\x20lies\x20behind\x20it:\x20a\x20glimpse\x20of\x20what\x20the\x20gallery\x20contains,\x20enough\x20to\x20know\x20that\x20what\x20is\x20inside\x20is\x20worth\x20opening.\x20The\x20journal\x20does\x20not\x20offer\x20everything\x20at\x20once.\x20It\x20never\x20does.\x20You\x20need\x20to\x20open\x20it\x20and\x20explore\x20it\x20to\x20discover\x20what\x20lays\x20inside\x20it.'}},{'url':_0x2c0667(0xd4),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Bookmark\x20Bottom','titlePosition':_0x2c0667(0xed),'pov':'','color':'','comment':{'title':'The\x20North\x20Star','body':'The\x20North\x20Star\x20is\x20the\x20symbol\x20of\x20orientation\x20—\x20the\x20fixed\x20point\x20that\x20navigators\x20have\x20used\x20for\x20millennia\x20to\x20find\x20their\x20bearing\x20when\x20everything\x20else\x20was\x20moving,\x20when\x20the\x20sea\x20was\x20dark\x20and\x20the\x20horizon\x20had\x20disappeared.\x20In\x20the\x20flipbook\x20it\x20serves\x20as\x20the\x20Bookmark\x20button:\x20the\x20marker\x20that\x20holds\x20your\x20place,\x20the\x20fixed\x20point\x20you\x20can\x20return\x20to\x20when\x20you\x20set\x20the\x20story\x20down\x20and\x20need\x20to\x20find\x20your\x20way\x20back.\x20That\x20function\x20and\x20that\x20symbol\x20are\x20inseparable.\x20In\x20a\x20story\x20about\x20people\x20who\x20have\x20lost\x20their\x20fixed\x20point\x20—\x20who\x20have\x20watched\x20their\x20future\x20destroyed\x20and\x20traveled\x20to\x20the\x20past\x20with\x20nothing\x20certain\x20except\x20their\x20memories\x20of\x20what\x20must\x20not\x20happen\x20again\x20—\x20the\x20act\x20of\x20bookmarking\x20a\x20page\x20carries\x20genuine\x20thematic\x20weight.\x20You\x20are\x20marking\x20where\x20you\x20are.\x20You\x20are\x20making\x20sure\x20you\x20can\x20return.\x0a\x0aThe\x20star\x20is\x20rendered\x20in\x20the\x20same\x20hammered\x20bronze\x20and\x20copper\x20as\x20every\x20navigational\x20element\x20in\x20the\x20flipbook,\x20its\x20twelve\x20points\x20precise\x20and\x20symmetrical,\x20an\x20engraved\x20medallion\x20at\x20its\x20center.\x20It\x20appears\x20again\x20on\x20the\x20bookmark\x20image\x20itself\x20—\x20the\x20tall,\x20illustrated\x20bookmark\x20that\x20holds\x20your\x20place\x20within\x20the\x20story\x27s\x20visual\x20world\x20—\x20where\x20it\x20anchors\x20the\x20full\x20composition\x20at\x20its\x20base.\x20Two\x20appearances,\x20one\x20meaning:\x20this\x20is\x20where\x20you\x20are.\x20This\x20is\x20how\x20you\x20find\x20your\x20way\x20back.'}},{'url':_0x2c0667(0x164),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Easier\x20Reading\x20Bottom','titlePosition':'top','pov':'','color':'','comment':{'title':'Open\x20Book','body':_0x2c0667(0x141)}},{'url':_0x2c0667(0xf9),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Story\x20Immersion\x20Bottom','titlePosition':'top','pov':'','color':'','comment':{'title':_0x2c0667(0x197),'body':_0x2c0667(0x15f)}},{'url':'https://lh3.googleusercontent.com/d/180yVkaLfC-U1YlTc4y0V_YHOnlfwL2nA','title':'Flipbook\x20Navigation\x20Element\x20-\x20Contents\x20Bottom','titlePosition':_0x2c0667(0xed),'pov':'','color':'','comment':{'title':_0x2c0667(0x155),'body':'The\x20Contents\x20button\x20is\x20a\x20rolled\x20scroll\x20sealed\x20with\x20a\x20wax\x20stamp\x20—\x20the\x20oldest\x20form\x20of\x20organized\x20knowledge,\x20the\x20format\x20in\x20which\x20records\x20were\x20kept\x20for\x20centuries\x20before\x20the\x20book\x20replaced\x20the\x20scroll\x20as\x20the\x20primary\x20vessel\x20for\x20writing.\x20It\x20carries\x20the\x20four\x20themes\x20of\x20the\x20accompanying\x20journal\x20sections\x20written\x20across\x20its\x20face:\x20Time\x20Events,\x20Knowledge,\x20Changing\x20Fate,\x20Divine\x20Intervention.\x20These\x20are\x20the\x20four\x20pillars\x20of\x20the\x20entire\x20narrative\x20—\x20the\x20forces\x20that\x20drive\x20every\x20chapter,\x20every\x20character\x20decision,\x20every\x20sacrifice.\x20The\x20scroll\x20as\x20a\x20navigation\x20element\x20says\x20something\x20precise\x20about\x20what\x20the\x20Contents\x20page\x20is:\x20not\x20just\x20a\x20list\x20of\x20chapters,\x20but\x20a\x20record.\x20An\x20archive.\x20A\x20document\x20that\x20was\x20written\x20because\x20what\x20happened\x20here\x20needed\x20to\x20be\x20preserved.'}}],'charactersArtwork':[{'url':'https://lh3.googleusercontent.com/d/1Es_JnJh50Vb898cK4GyItZllf2C2Y4pV','title':_0x2c0667(0x165),'titlePosition':_0x2c0667(0xed),'pov':_0x2c0667(0x16a),'color':_0x2c0667(0x109),'comment':{'title':'Caroline\x20-\x20Present\x20Timeline\x20Character\x20Introduction','body':'!!The\x20Moment!!\x0a\x0aThe\x20morning\x20after\x20Klaus\x27s\x20hybrid\x20ritual\x20is\x20the\x20moment\x20two\x20timelines\x20split\x20apart.\x20While\x20Mystic\x20Falls\x20holds\x20its\x20breath\x20and\x20the\x20supernatural\x20world\x20shifts\x20on\x20its\x20axis,\x20Caroline\x20Forbes\x20wakes\x20up\x20on\x20the\x20Lockwood\x20mansion\x20couch\x20with\x20a\x20migraine,\x20future\x20memories\x20bleeding\x20into\x20her\x20present\x20like\x20ink\x20dropped\x20into\x20still\x20water,\x20and\x20the\x20quiet,\x20absolute\x20certainty\x20that\x20everything\x20is\x20about\x20to\x20change.\x20She\x20has\x20already\x20lived\x20through\x20the\x20apocalypse\x20once.\x20She\x20has\x20already\x20watched\x20everyone\x20she\x20loves\x20die.\x20She\x20came\x20back\x20anyway\x20—\x20not\x20because\x20Gaia\x20promised\x20her\x20victory,\x20but\x20because\x20possibility\x20was\x20enough.\x0a\x0a!!The\x20Image!!\x0a\x0aThis\x20portrait\x20captures\x20Caroline\x20in\x20the\x20present\x20timeline,\x20the\x20moment\x20when\x20the\x20transformation\x20Gaia\x20has\x20set\x20in\x20motion\x20begins\x20to\x20declare\x20itself\x20to\x20the\x20world\x20around\x20her.\x20The\x20forest\x20is\x20already\x20responding\x20to\x20her.\x20Trees\x20lean\x20inward,\x20energy\x20trails\x20from\x20her\x20in\x20curving\x20ribbons\x20of\x20gold\x20and\x20white,\x20a\x20glowing\x20sigil\x20hangs\x20above\x20her\x20in\x20the\x20dark\x20like\x20a\x20second\x20moon\x20—\x20the\x20divine\x20signature\x20of\x20something\x20ancient\x20recognizing\x20its\x20own,\x20translated\x20through\x20the\x20specific\x20body\x20of\x20a\x20girl\x20from\x20Mystic\x20Falls\x20who\x20chose\x20to\x20carry\x20it.\x20The\x20forest\x20floor\x20is\x20already\x20changing\x20beneath\x20her\x20feet,\x20though\x20she\x20hasn\x27t\x20asked\x20it\x20to\x20or\x20know\x20it\x20yet.\x0a\x0a!!What\x20This\x20Image\x20Holds!!\x0a\x0aThe\x20characters\x20of\x20this\x20story\x20are\x20never\x20posed\x20for\x20the\x20viewer.\x20They\x20are\x20immersed\x20in\x20their\x20world,\x20caught\x20inside\x20the\x20moment,\x20absorbed\x20entirely\x20in\x20what\x20is\x20happening\x20to\x20them.\x20Caroline\x20is\x20no\x20exception.\x20She\x20is\x20facing\x20forward\x20because\x20she\x20does\x20not\x20look\x20back\x20—\x20not\x20even\x20when\x20the\x20cost\x20of\x20what\x20lies\x20ahead\x20is\x20something\x20she\x20has\x20already\x20paid\x20once\x20and\x20remembers\x20in\x20full.\x20The\x20golden\x20light\x20surrounding\x20her\x20is\x20hers.\x20The\x20question\x20the\x20story\x20spends\x20its\x20pages\x20answering\x20is\x20whether\x20she\x20will\x20learn\x20to\x20hold\x20it\x20before\x20it\x20holds\x20her.\x0a\x0a!!Why\x20She\x20Is\x20Here!!\x0a\x0aCaroline\x20did\x20not\x20come\x20back\x20to\x20save\x20the\x20world.\x20She\x20came\x20back\x20for\x20specific\x20people,\x20specific\x20faces,\x20specific\x20losses\x20she\x20could\x20not\x20carry\x20a\x20second\x20time.\x20She\x20made\x20a\x20deal\x20with\x20a\x20primordial\x20goddess\x20and\x20bound\x20herself\x20to\x20a\x20destiny\x20she\x20cannot\x20fully\x20read,\x20and\x20she\x20did\x20it\x20without\x20hesitation,\x20because\x20the\x20alternative\x20was\x20unbearable.\x20That\x20choice\x20—\x20not\x20the\x20power,\x20not\x20the\x20transformation,\x20not\x20the\x20divine\x20sigil\x20of\x20Gaia\x27s\x20mark\x20glowing\x20above\x20her\x20in\x20the\x20dark\x20—\x20is\x20what\x20this\x20portrait\x20is\x20really\x20about.\x20The\x20forest\x20is\x20answering\x20her\x20because\x20she\x20is\x20the\x20kind\x20of\x20person\x20the\x20earth\x20recognizes\x20as\x20its\x20own.\x20She\x20always\x20was.\x20She\x20simply\x20did\x20not\x20know\x20it\x20yet.'}},{'url':_0x2c0667(0x163),'title':_0x2c0667(0x177),'titlePosition':_0x2c0667(0xed),'pov':'Kol\x20Mikael
