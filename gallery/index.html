<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0806;--bg2:#110904;--bg3:#1a0f06;
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.3);--gold-glow:rgba(201,168,76,.12);
  --text:#e8d8b0;--text-dim:#9b7a4a;--text-muted:#7a5e32;
  --border:rgba(139,106,58,.22);--border-gold:rgba(201,168,76,.38);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;font-size:16px}

/* ── Header ── */
.hdr{
  background:linear-gradient(180deg,#0a0603 0%,#110904 100%);
  border-bottom:1px solid var(--border-gold);
  padding:22px 28px 20px;
  position:relative;
  display:flex;
  align-items:center;
  gap:28px;
}
.hdr-back{
  flex-shrink:0;
  display:inline-flex;align-items:center;gap:7px;
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  text-decoration:none;letter-spacing:1px;cursor:pointer;
  padding:8px 16px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.7);
  transition:all .22s;
  white-space:nowrap;
}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.hdr-text{flex:1;text-align:center}
.hdr-eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.hdr-title{font-family:'Ephesis',cursive;font-size:60px;color:#d42020;line-height:1.05;text-shadow:0 2px 24px rgba(180,20,20,.45)}
.hdr-sub{font-family:'Cormorant Upright',serif;font-size:20px;font-weight:600;color:var(--gold);margin-top:8px;letter-spacing:.8px}
.hdr-rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:14px auto 0}

/* ── Header Carousel ── */
/* ── Header Carousel ── */
.hdr-carousel{
  flex:0 0 230px;height:195px;
  position:relative;overflow:hidden;
  border-radius:10px;
  background:rgba(0,0,0,.25);
}
.car-stage{position:relative;width:100%;height:100%}
.car-img{
  position:absolute;top:50%;left:50%;
  width:124px;height:155px;       /* 4:5 portrait — matches 3200×4000 source */
  object-fit:cover;border-radius:8px;
  border:1px solid rgba(201,168,76,.18);
  transition:transform .92s cubic-bezier(.4,0,.2,1),opacity .92s cubic-bezier(.4,0,.2,1);
  will-change:transform,opacity;
}
.car-img.car-active{
  transform:translate(-50%,-50%) scale(1.22);  /* 151×189px — fits 195px tall container */
  opacity:1;z-index:4;
  box-shadow:0 6px 24px rgba(0,0,0,.85),0 0 0 2px rgba(201,168,76,.45),0 0 14px rgba(201,168,76,.15);
}
.car-img.car-entering{
  transform:translate(calc(-50% + 64px),-50%) scale(0.72);
  opacity:.62;z-index:2;
}
.car-img.car-exiting{
  transform:translate(calc(-50% - 180px),-50%) scale(0.70);
  opacity:0;z-index:2;
}
.car-img.car-hidden{
  transform:translate(calc(-50% + 185px),-50%) scale(0.70);
  opacity:0;z-index:1;
  transition:none;
}

/* ── Category Tabs ── */
.cat-nav{
  display:flex;justify-content:center;gap:10px;
  padding:22px 32px 0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.cat-tab{
  padding:10px 30px 11px;border-radius:22px 22px 0 0;
  border:1px solid transparent;border-bottom:none;
  background:transparent;
  color:var(--text-dim);
  font-family:'Charm',cursive;font-size:18px;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  position:relative;bottom:-1px;
}
.cat-tab:hover{color:var(--text);background:var(--gold-glow)}
.cat-tab.active{
  background:var(--bg2);color:var(--gold);
  border-color:var(--border-gold);border-bottom-color:var(--bg2);
}

/* ── Gallery Wrap ── */
.gallery-wrap{
  background:var(--bg2);
  min-height:72vh;
  padding:32px 36px 48px;
}
.gallery-section{display:none}
.gallery-section.active{display:block}
.gallery-empty{
  text-align:center;padding:90px 20px;
  color:var(--text-muted);font-style:italic;font-size:20px;
  font-family:'Cormorant Garamond',serif;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:22px;
}

/* ── Image Card ── */
.g-card{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s;
  position:relative;
}
.g-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,168,76,.22);
  border-color:var(--border-gold);
}
.g-thumb-wrap{
  position:relative;width:100%;padding-bottom:125%; /* default 4:5 (3200×4000 book artwork) */
  overflow:hidden;background:#080503;cursor:pointer;
}
/* Book Artwork — contain so the full image always shows inside the frame */
#grid-book .g-thumb-wrap img{object-fit:contain}
/* Character portraits are 8.5"×11" → height:width = 11÷8.5 = 129.41% */
#grid-characters .g-thumb-wrap{padding-bottom:129.41%}
.g-thumb-wrap img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  transition:transform .38s;
  display:block;
}
.g-card:hover .g-thumb-wrap img{transform:scale(1.05)}
.g-zoom-hint{
  position:absolute;inset:0;
  background:rgba(0,0,0,0);transition:background .22s;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.g-card:hover .g-zoom-hint{background:rgba(0,0,0,.18)}
.g-zoom-icon{
  opacity:0;transform:scale(.7);transition:opacity .22s,transform .22s;
  width:44px;height:44px;border-radius:50%;
  background:rgba(12,8,4,.75);border:1px solid var(--border-gold);
  display:flex;align-items:center;justify-content:center;
}
.g-card:hover .g-zoom-icon{opacity:1;transform:scale(1)}
.g-zoom-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.8}

/* Title top / bottom */
.g-title{
  padding:10px 14px;
  font-family:'Charm',cursive;font-size:17px;
  color:var(--gold);letter-spacing:.3px;
  text-align:center;line-height:1.3;
}
.g-title.top{border-bottom:1px solid var(--border)}
.g-title.bottom{border-top:1px solid var(--border)}

/* Comment button */
.g-note-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:9px 14px;
  background:rgba(201,168,76,.05);
  border:none;border-top:1px solid var(--border);
  color:var(--text-muted);font-family:'Charm',cursive;font-size:13px;
  letter-spacing:1.2px;text-transform:uppercase;
  cursor:pointer;transition:all .18s;
}
.g-note-btn:hover{background:var(--gold-glow);color:var(--gold)}
.g-note-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}

/* ── Lightbox ── */
.lb-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(4,2,1,.93);
  align-items:center;justify-content:center;
  padding:20px;
}
.lb-overlay.open{display:flex}
.lb-wrap{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  max-width:92vw;max-height:92vh;
}
.lb-img{
  max-width:88vw;max-height:78vh;
  object-fit:contain;
  border:1px solid var(--border-gold);
  border-radius:4px;
  display:block;
}
.lb-close{
  position:absolute;top:-16px;right:-16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(16,8,4,.92);border:1px solid var(--border-gold);
  color:var(--gold);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;line-height:1;font-family:'Charm',cursive;
  flex-shrink:0;
}
.lb-close:hover{background:rgba(201,168,76,.15);transform:scale(1.08)}
.lb-footer{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-top:14px;
}
.lb-title{
  font-family:'Charm',cursive;font-size:20px;
  color:var(--gold);letter-spacing:.8px;text-align:center;
}
.lb-note-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 22px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.8);
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  transition:all .2s;
}
.lb-note-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.lb-note-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Comment / Book-Page Overlay ── */
.cm-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(4,2,1,.88);
  align-items:center;justify-content:center;
  padding:24px;
}
.cm-overlay.open{display:flex}
.cm-page{
  background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;
  color:#1a0a02;
  border-radius:6px;
  border:1px solid rgba(155,115,42,.45);
  box-shadow:
    0 24px 70px rgba(0,0,0,.72),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 0 60px rgba(120,90,28,.06);
  max-width:600px;width:100%;max-height:82vh;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}
/* Spine shadow on left edge */
.cm-page::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:34px;
  background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);
  pointer-events:none;
}
/* Top edge sheen */
.cm-page::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);
  pointer-events:none;
}
/* Ruling lines beneath body text (decorative) */
.cm-page-inner{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.cm-hdr{
  padding:28px 32px 16px 44px;
  border-bottom:1px solid rgba(155,115,42,.18);
  flex-shrink:0;
}
.cm-page-title{
  font-family:'Charm',cursive;font-size:28px;font-weight:700;
  color:#7a4010;line-height:1.2;
  text-shadow:0 1px 3px rgba(0,0,0,.13);
}
.cm-page-sub{
  font-family:'Playfair Display',serif;font-size:19px;font-weight:700;
  color:#7a4010;margin-top:7px;font-style:normal;
}
.cm-scroll{
  flex:1;overflow-y:auto;
  padding:18px 32px 22px 44px;
}
.cm-scroll::-webkit-scrollbar{width:4px}
.cm-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3)}
.cm-text{
  font-family:'Lora',serif;font-size:16px;font-style:italic;
  color:#1a0a02;line-height:1.88;
}
.cm-text p{margin-bottom:.9em}
.cm-text p:last-child{margin-bottom:0}
.cm-text p.cm-sub-inline{
  font-family:'Playfair Display',serif;font-size:18px;font-weight:700;
  font-style:normal;color:#7a4010;
  margin:1em 0 .25em;line-height:1.3;
}
.cm-foot{
  padding:12px 32px 16px 44px;
  border-top:1px solid rgba(155,115,42,.18);
  display:flex;justify-content:flex-end;flex-shrink:0;
}
.cm-btn-close{
  padding:8px 24px;border-radius:20px;
  background:rgba(155,115,42,.1);
  border:1px solid rgba(155,115,42,.35);
  color:#4a2e0a;font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase;
}
.cm-btn-close:hover{background:rgba(155,115,42,.22)}
.cm-x{
  position:absolute;top:13px;right:14px;
  background:none;border:none;
  color:#4a2e0a;font-size:20px;cursor:pointer;
  padding:4px 8px;border-radius:4px;
  line-height:1;transition:background .15s;font-weight:700;
}
.cm-x:hover{background:rgba(155,115,42,.15)}

/* ── Footer ── */
.gal-foot{
  padding:26px 32px;
  background:var(--bg);
  border-top:1px solid var(--border);
  text-align:center;
}
.gal-foot-link{
  font-family:'Charm',cursive;font-size:15px;
  color:var(--text-muted);letter-spacing:.8px;
  cursor:pointer;background:none;border:none;
  text-decoration:none;transition:color .2s;
  padding:0 2px;
}
.gal-foot-link:hover{color:var(--gold)}
.gal-foot-sep{margin:0 14px;color:var(--border);font-size:14px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <button class="hdr-back" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;border-radius:2px">
    Flipbook
  </button>
  <div class="hdr-text">
    <div class="hdr-eyebrow">Image Gallery</div>
    <div class="hdr-title">Echoes of Tomorrow</div>
    <div class="hdr-sub">A Vampire Diaries Universe Fan Novel</div>
    <div class="hdr-rule"></div>
  </div>
  <div class="hdr-carousel">
    <div class="car-stage">
      <img class="car-img car-active"   src="https://lh3.googleusercontent.com/d/1xe9XBsKuzg1qa7s4nWAnvUJozPygooFQ" alt="">
      <img class="car-img car-entering" src="https://lh3.googleusercontent.com/d/1u9I46kFDu9ZKDSFDu4ciKfZi8zkgvUkk" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1LKJrRB5b4BaXokYJ6b7JuzI7o80CsxBt" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1t2rFv-2vDX1uX0gOnOxqNdYq27yNi2ON" alt="">
    </div>
  </div>
</header>

<!-- Category Navigation -->
<nav class="cat-nav">
  <button class="cat-tab active" id="tab-book" onclick="switchCat('book')">Book Artwork</button>
  <button class="cat-tab" id="tab-characters" onclick="switchCat('characters')">Characters Artwork</button>
</nav>

<!-- Gallery Content -->
<main class="gallery-wrap">
  <div class="gallery-section active" id="section-book">
    <div class="gallery-grid" id="grid-book"></div>
    <div class="gallery-empty" id="empty-book" style="display:none">No book artwork has been added yet.</div>
  </div>
  <div class="gallery-section" id="section-characters">
    <div class="gallery-grid" id="grid-characters"></div>
    <div class="gallery-empty" id="empty-characters" style="display:none">No character artwork has been added yet.</div>
  </div>
</main>

<!-- Footer -->
<footer class="gal-foot">
  <button class="gal-foot-link" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;vertical-align:middle;margin-right:7px;border-radius:2px">Read the Flipbook
  </button>
  <span class="gal-foot-sep">|</span>
  <button class="gal-foot-link" onclick="galScrollTop()">
    Back to Top<img src="https://lh3.googleusercontent.com/d/1UdXIzhjLnglrTz14xu_yOS51hdYCAszS" style="height:18px;width:auto;object-fit:contain;vertical-align:middle;margin-left:6px">
  </button>
</footer>

<!-- Lightbox Overlay -->
<div class="lb-overlay" id="lb-overlay" onclick="lbBgClick(event)">
  <div class="lb-wrap" id="lb-wrap">
    <button class="lb-close" onclick="closeLb()" title="Close">&#215;</button>
    <img class="lb-img" id="lb-img" src="" alt="">
    <div class="lb-footer">
      <div class="lb-title" id="lb-title" style="display:none"></div>
      <button class="lb-note-btn" id="lb-note-btn" onclick="openNote()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h8"/></svg>
        Read About This Image
      </button>
    </div>
  </div>
</div>

<!-- Comment / Book-Page Overlay -->
<div class="cm-overlay" id="cm-overlay" onclick="noteBgClick(event)">
  <div class="cm-page" id="cm-page">
    <button class="cm-x" onclick="closeNote()">&#215;</button>
    <div class="cm-page-inner">
      <div class="cm-hdr">
        <div class="cm-page-title" id="cm-title"></div>
        <div class="cm-page-sub" id="cm-sub" style="display:none"></div>
      </div>
      <div class="cm-scroll">
        <div class="cm-text" id="cm-body"></div>
      </div>
      <div class="cm-foot">
        <button class="cm-btn-close" onclick="closeNote()">Close</button>
      </div>
    </div>

6d(0x21c)}},{'url':_0x4b426d(0x21b),'title':_0x4b426d(0x249),'titlePosition':'top','pov':'','color':'','comment':{'title':'','body':'!!The\x20First\x20Thing\x20You\x20See!!\x0a\x0aThe\x20front\x20cover\x20of\x20**Echoes\x20of\x20Tomorrow**\x20is\x20not\x20a\x20designed\x20object.\x20It\x20is\x20an\x20event.\x20Aged\x20parchment\x20stretched\x20across\x20a\x20bronze\x20and\x20green\x20frame,\x20already\x20marked\x20before\x20the\x20story\x20has\x20begun\x20—\x20blood\x20drops\x20falling,\x20blood\x20spatters\x20settled\x20into\x20the\x20page,\x20dark\x20tendrils\x20of\x20blood\x20coiling\x20up\x20from\x20the\x20lower\x20left\x20and\x20curling\x20across\x20the\x20corners\x20in\x20the\x20specific\x20way\x20of\x20something\x20that\x20has\x20been\x20moving\x20for\x20a\x20long\x20time\x20and\x20has\x20no\x20intention\x20of\x20stopping.\x20The\x20cover\x20does\x20not\x20promise\x20you\x20a\x20clean\x20story.\x20It\x20shows\x20you\x20what\x20the\x20story\x20is\x20made\x20of\x20before\x20you\x20have\x20read\x20a\x20single\x20word.\x0a\x0a!!What\x20the\x20Frame\x20Holds!!\x0a\x0aThe\x20ornamental\x20border\x20is\x20bronze\x20and\x20deep\x20red,\x20threaded\x20with\x20green\x20—\x20the\x20three\x20colors\x20that\x20run\x20through\x20every\x20element\x20of\x20this\x20story\x27s\x20visual\x20identity.\x20Nature\x27s\x20green,\x20blood\x27s\x20red,\x20and\x20the\x20aged\x20bronze\x20of\x20a\x20world\x20measured\x20in\x20centuries\x20rather\x20than\x20years.\x20The\x20green\x20gem\x20on\x20the\x20right\x20side\x20clasp\x20catches\x20the\x20light\x20the\x20way\x20a\x20living\x20thing\x20catches\x20it\x20—\x20with\x20intention,\x20with\x20presence.\x20At\x20the\x20top\x20of\x20the\x20cover,\x20cradled\x20in\x20a\x20spiral\x20of\x20dark\x20blood\x20tendrils,\x20sits\x20a\x20clock:\x20face\x20open,\x20gears\x20visible,\x20hands\x20marking\x20a\x20moment\x20that\x20the\x20story\x20has\x20not\x20yet\x20named.\x20The\x20clock\x20is\x20the\x20premise.\x20Time\x20is\x20exposed\x20here,\x20its\x20workings\x20visible,\x20because\x20someone\x20has\x20already\x20reached\x20through\x20it.\x0a\x0a!!The\x20Title!!\x0a\x0aAt\x20the\x20center\x20of\x20the\x20parchment,\x20in\x20red\x20letters\x20that\x20glow\x20against\x20the\x20aged\x20background,\x20the\x20title\x20burns:\x20**Echoes\x20of\x20Tomorrow**.\x20Not\x20stamped\x20or\x20printed\x20—\x20written,\x20in\x20the\x20script\x20that\x20belongs\x20to\x20this\x20story,\x20in\x20a\x20color\x20that\x20reads\x20as\x20both\x20fire\x20and\x20blood\x20depending\x20on\x20where\x20the\x20eye\x20lands.\x20Below\x20and\x20around\x20it,\x20blood\x20drops\x20fall\x20in\x20a\x20pattern\x20that\x20is\x20almost\x20deliberate,\x20almost\x20random,\x20the\x20way\x20consequence\x20falls\x20in\x20a\x20story\x20where\x20every\x20event\x20in\x20the\x20past\x20was\x20put\x20in\x20motion\x20by\x20something\x20that\x20had\x20not\x20yet\x20happened.\x20The\x20cover\x20is\x20the\x20story\x27s\x20first\x20sentence.\x20It\x20tells\x20you\x20what\x20you\x20are\x20holding,\x20and\x20what\x20holding\x20it\x20will\x20cost.'}},{'url':_0x4b426d(0x1d4),'title':_0x4b426d(0x262),'titlePosition':_0x4b426d(0x1e3),'pov':'','color':'','comment':{'title':_0x4b426d(0x27f),'body':_0x4b426d(0x236)}},{'url':'https://lh3.googleusercontent.com/d/1g6txVcVyrwc3ySBlNc80tmEXaDwa2fa1','title':_0x4b426d(0x20c),'titlePosition':'top','pov':'','color':'','comment':{'title':_0x4b426d(0x1ee),'body':_0x4b426d(0x1bf)}},{'url':_0x4b426d(0x29c),'title':'Flipbook\x20Back\x20Cover','titlePosition':_0x4b426d(0x1e3),'pov':'','color':'','comment':{'title':_0x4b426d(0x20e),'body':_0x4b426d(0x24b)}},{'url':'https://lh3.googleusercontent.com/d/1HkymrOCKqXNtx0qR1rTktiDpZcW6zorW','title':'Flipbook\x20Navigation\x20Element\x20-\x20Back\x20Bottom','titlePosition':_0x4b426d(0x1e3),'pov':'','color':'','comment':{'title':_0x4b426d(0x1e8),'body':'The\x20Back\x20arrow\x20is\x20cast\x20in\x20aged\x20bronze\x20and\x20copper.\x20Every\x20surface\x20of\x20it\x20is\x20alive\x20with\x20nature\x20—\x20leaves,\x20acanthus\x20scrollwork,\x20botanical\x20tendrils\x20curling\x20along\x20the\x20shaft\x20and\x20unfurling\x20from\x20the\x20fletching\x20in\x20the\x20unmistakable\x20motif\x20of\x20Gaia\x27s\x20presence.\x20In\x20**Echoes\x20of\x20Tomorrow**,\x20nature\x20magic\x20is\x20the\x20force\x20that\x20made\x20time\x20travel\x20possible.\x20Gaia,\x20the\x20primordial\x20earth\x20goddess\x20who\x20moves\x20beneath\x20every\x20visible\x20event\x20in\x20this\x20story,\x20used\x20the\x20oldest\x20magic\x20in\x20existence\x20—\x20nature\x27s\x20magic\x20—\x20to\x20power\x20the\x20spell\x20that\x20sent\x20the\x20travelers\x20back.\x20Her\x20signature\x20is\x20growth,\x20living\x20things,\x20the\x20relentless\x20forward\x20motion\x20of\x20nature\x20that\x20simultaneously\x20reaches\x20backward\x20into\x20root\x20and\x20soil.\x20That\x20magic\x20is\x20woven\x20into\x20these\x20arrows\x20because\x20direction\x20and\x20nature\x27s\x20power\x20and\x20influence\x20are\x20inseparable\x20in\x20this\x20story.\x0a\x0aBut\x20nature\x20magic\x20that\x20is\x20used\x20to\x20bend\x20time\x20does\x20not\x20simply\x20spend\x20itself\x20and\x20disappear.\x20It\x20seeks\x20balance.\x20Every\x20person\x20touched\x20by\x20the\x20time\x20spell\x20in\x20the\x20present\x20timeline\x20carries\x20a\x20cost\x20—\x20the\x20magic\x20pressing\x20against\x20them\x20the\x20way\x20a\x20living\x20thing\x20presses\x20toward\x20equilibrium,\x20wanting\x20to\x20restore\x20what\x20was\x20displaced.\x20The\x20arrow\x20points\x20left,\x20back\x20through\x20the\x20pages,\x20back\x20through\x20the\x20timeline,\x20back\x20toward\x20what\x20came\x20before.\x20In\x20the\x20world\x20of\x20this\x20story,\x20that\x20direction\x20is\x20where\x20the\x20travelers\x20returned\x20to,\x20and\x20the\x20magic\x20that\x20brought\x20them\x20there\x20has\x20never\x20stopped\x20pulling.'}},{'url':_0x4b426d(0x28a),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Next\x20Bottom','titlePosition':_0x4b426d(0x1e3),'pov':'','color':'','comment':{'title':'Right\x20Arrow','body':_0x4b426d(0x242)}},{'url':_0x4b426d(0x23d),'title':_0x4b426d(0x221),'titlePosition':_0x4b426d(0x1e3),'pov':'','color':'','comment':{'title':'The\x20Clock','body':'The\x20clock\x20that\x20serves\x20as\x20the\x20page\x20tracker\x20is\x20a\x20skeleton\x20timepiece\x20—\x20its\x20face\x20open,\x20its\x20gears\x20fully\x20visible,\x20its\x20inner\x20workings\x20exposed.\x20The\x20same\x20way\x20the\x20mechanisms\x20of\x20time\x20became\x20exposed\x20to\x20those\x20who\x20reached\x20through\x20time\x20to\x20change\x20it.\x20The\x20clock\x27s\x20frame\x20is\x20bronze\x20and\x20green\x20enamel,\x20the\x20same\x20color\x20combination\x20woven\x20through\x20the\x20flipbook\x27s\x20entire\x20visual\x20language.\x20But\x20the\x20clock\x20does\x20not\x20exist\x20alone.\x20Dark\x20tendrils\x20of\x20blood\x20move\x20through\x20and\x20around\x20it\x20—\x20coiling\x20between\x20the\x20gears,\x20wrapping\x20across\x20the\x20numerals,\x20pressing\x20toward\x20the\x20hands.\x20They\x20came\x20through\x20time\x20with\x20the\x20travelers.\x20They\x20have\x20never\x20left.\x0a\x0aThe\x20blood\x20is\x20everything\x20the\x20mission\x20demands,\x20across\x20every\x20timeline\x20at\x20once.\x20The\x20lives\x20already\x20lost\x20in\x20the\x20future\x20they\x20came\x20back\x20to\x20prevent.\x20The\x20blood\x20already\x20spilled\x20in\x20a\x20timeline\x20they\x20are\x20trying\x20to\x20unmake.\x20The\x20grief\x20of\x20mourning\x20people\x20who\x20are\x20still\x20alive\x20and\x20unknowing\x20in\x20the\x20present.\x20The\x20relationships\x20and\x20the\x20loved\x20ones\x20that\x20may\x20never\x20exist\x20in\x20this\x20timeline\x20because\x20the\x20travelers\x20are\x20changing\x20the\x20very\x20circumstances\x20that\x20created\x20them\x20—\x20futures\x20that\x20were\x20real\x20to\x20them,\x20being\x20unmade\x20by\x20their\x20own\x20hands.\x20And\x20then\x20the\x20blood\x20still\x20coming:\x20the\x20sacrifices\x20already\x20decided\x20on\x20but\x20not\x20yet\x20fully\x20paid,\x20the\x20question\x20each\x20character\x20is\x20answering\x20in\x20real\x20time\x20of\x20how\x20far\x20they\x20are\x20willing\x20to\x20go,\x20how\x20much\x20blood\x20they\x20are\x20prepared\x20to\x20spill,\x20what\x20they\x20are\x20willing\x20to\x20become,\x20to\x20keep\x20the\x20events\x20of\x20the\x20future\x20from\x20happening.\x0a\x0aThe\x20page\x20tracker\x20marks\x20where\x20you\x20are\x20in\x20the\x20story.\x20The\x20blood\x20marks\x20what\x20the\x20story\x20is\x20made\x20of\x20—\x20blood\x20already\x20spilled,\x20blood\x20being\x20spilled\x20now,\x20and\x20blood\x20that\x20has\x20yet\x20to\x20be\x20shed,\x20and\x20the\x20cost\x20and\x20consequences\x20of\x20it.\x20The\x20blood\x20came\x20through\x20time\x20because\x20it\x20belongs\x20to\x20the\x20people\x20who\x20did.\x20It\x20reaches\x20toward\x20the\x20hands\x20of\x20the\x20clock\x20because\x20time\x20is\x20precisely\x20what\x20it\x20is\x20owed.'}},{'url':_0x4b426d(0x1fb),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Gallery\x20Bottom','titlePosition':_0x4b426d(0x1e3),'pov':'','color':'','comment':{'title':_0x4b426d(0x27d),'body':'The\x20gallery\x20holds\x20the\x20visual\x20record\x20of\x20this\x20story\x27s\x20world\x20—\x20the\x20places\x20that\x20shaped\x20it,\x20the\x20characters\x20who\x20lived\x20inside\x20it,\x20the\x20artwork\x20created\x20to\x20give\x20readers\x20a\x20way\x20to\x20see\x20what\x20the\x20words\x20describe.\x20Every\x20supernatural\x20world\x20has\x20a\x20history\x20that\x20predates\x20its\x20documentation,\x20and\x20**Echoes\x20of\x20Tomorrow**\x20is\x20no\x20exception.\x20The\x20ancient\x20temple\x20and\x20the\x20modern\x20city\x20street,\x20the\x20clock\x27s\x20exposed\x20mechanisms,\x20the\x20green\x20energy\x20of\x20a\x20magic\x20older\x20than\x20recorded\x20history\x20—\x20these\x20are\x20not\x20illustrations.\x20They\x20are\x20visual\x20evidence.\x20The\x20gallery\x20is\x20where\x20that\x20evidence\x20is\x20kept.\x0a\x0aThe\x20icon\x20itsel
