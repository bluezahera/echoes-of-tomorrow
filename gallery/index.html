<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0806;--bg2:#110904;--bg3:#1a0f06;
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.3);--gold-glow:rgba(201,168,76,.12);
  --text:#e8d8b0;--text-dim:#9b7a4a;--text-muted:#7a5e32;
  --border:rgba(139,106,58,.22);--border-gold:rgba(201,168,76,.38);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;font-size:16px}

/* ── Header ── */
.hdr{
  background:linear-gradient(180deg,#0a0603 0%,#110904 100%);
  border-bottom:1px solid var(--border-gold);
  padding:22px 28px 20px;
  position:relative;
  display:flex;
  align-items:center;
  gap:28px;
}
.hdr-back{
  flex-shrink:0;
  display:inline-flex;align-items:center;gap:7px;
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  text-decoration:none;letter-spacing:1px;cursor:pointer;
  padding:8px 16px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.7);
  transition:all .22s;
  white-space:nowrap;
}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.hdr-text{flex:1;text-align:center}
.hdr-eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.hdr-title{font-family:'Ephesis',cursive;font-size:60px;color:#d42020;line-height:1.05;text-shadow:0 2px 24px rgba(180,20,20,.45)}
.hdr-sub{font-family:'Cormorant Upright',serif;font-size:20px;font-weight:600;color:var(--gold);margin-top:8px;letter-spacing:.8px}
.hdr-rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:14px auto 0}

/* ── Header Carousel ── */
/* ── Header Carousel ── */
.hdr-carousel{
  flex:0 0 230px;height:195px;
  position:relative;overflow:hidden;
  border-radius:10px;
  background:rgba(0,0,0,.25);
}
.car-stage{position:relative;width:100%;height:100%}
.car-img{
  position:absolute;top:50%;left:50%;
  width:124px;height:155px;       /* 4:5 portrait — matches 3200×4000 source */
  object-fit:cover;border-radius:8px;
  border:1px solid rgba(201,168,76,.18);
  transition:transform .92s cubic-bezier(.4,0,.2,1),opacity .92s cubic-bezier(.4,0,.2,1);
  will-change:transform,opacity;
}
.car-img.car-active{
  transform:translate(-50%,-50%) scale(1.22);  /* 151×189px — fits 195px tall container */
  opacity:1;z-index:4;
  box-shadow:0 6px 24px rgba(0,0,0,.85),0 0 0 2px rgba(201,168,76,.45),0 0 14px rgba(201,168,76,.15);
}
.car-img.car-entering{
  transform:translate(calc(-50% + 64px),-50%) scale(0.72);
  opacity:.62;z-index:2;
}
.car-img.car-exiting{
  transform:translate(calc(-50% - 180px),-50%) scale(0.70);
  opacity:0;z-index:2;
}
.car-img.car-hidden{
  transform:translate(calc(-50% + 185px),-50%) scale(0.70);
  opacity:0;z-index:1;
  transition:none;
}

/* ── Category Tabs ── */
.cat-nav{
  display:flex;justify-content:center;gap:10px;
  padding:22px 32px 0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.cat-tab{
  padding:10px 30px 11px;border-radius:22px 22px 0 0;
  border:1px solid transparent;border-bottom:none;
  background:transparent;
  color:var(--text-dim);
  font-family:'Charm',cursive;font-size:18px;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  position:relative;bottom:-1px;
}
.cat-tab:hover{color:var(--text);background:var(--gold-glow)}
.cat-tab.active{
  background:var(--bg2);color:var(--gold);
  border-color:var(--border-gold);border-bottom-color:var(--bg2);
}

/* ── Gallery Wrap ── */
.gallery-wrap{
  background:var(--bg2);
  min-height:72vh;
  padding:32px 36px 48px;
}
.gallery-section{display:none}
.gallery-section.active{display:block}
.gallery-empty{
  text-align:center;padding:90px 20px;
  color:var(--text-muted);font-style:italic;font-size:20px;
  font-family:'Cormorant Garamond',serif;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:22px;
}

/* ── Image Card ── */
.g-card{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s;
  position:relative;
}
.g-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,168,76,.22);
  border-color:var(--border-gold);
}
.g-thumb-wrap{
  position:relative;width:100%;padding-bottom:125%; /* default 4:5 (3200×4000 book artwork) */
  overflow:hidden;background:#080503;cursor:pointer;
}
/* Book Artwork — contain so the full image always shows inside the frame */
#grid-book .g-thumb-wrap img{object-fit:contain}
/* Character portraits are 8.5"×11" → height:width = 11÷8.5 = 129.41% */
#grid-characters .g-thumb-wrap{padding-bottom:129.41%}
.g-thumb-wrap img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  transition:transform .38s;
  display:block;
}
.g-card:hover .g-thumb-wrap img{transform:scale(1.05)}
.g-zoom-hint{
  position:absolute;inset:0;
  background:rgba(0,0,0,0);transition:background .22s;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.g-card:hover .g-zoom-hint{background:rgba(0,0,0,.18)}
.g-zoom-icon{
  opacity:0;transform:scale(.7);transition:opacity .22s,transform .22s;
  width:44px;height:44px;border-radius:50%;
  background:rgba(12,8,4,.75);border:1px solid var(--border-gold);
  display:flex;align-items:center;justify-content:center;
}
.g-card:hover .g-zoom-icon{opacity:1;transform:scale(1)}
.g-zoom-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.8}

/* Title top / bottom */
.g-title{
  padding:10px 14px;
  font-family:'Charm',cursive;font-size:17px;
  color:var(--gold);letter-spacing:.3px;
  text-align:center;line-height:1.3;
}
.g-title.top{border-bottom:1px solid var(--border)}
.g-title.bottom{border-top:1px solid var(--border)}

/* Comment button */
.g-note-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:9px 14px;
  background:rgba(201,168,76,.05);
  border:none;border-top:1px solid var(--border);
  color:var(--text-muted);font-family:'Charm',cursive;font-size:13px;
  letter-spacing:1.2px;text-transform:uppercase;
  cursor:pointer;transition:all .18s;
}
.g-note-btn:hover{background:var(--gold-glow);color:var(--gold)}
.g-note-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}

/* ── Lightbox ── */
.lb-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(4,2,1,.93);
  align-items:center;justify-content:center;
  padding:20px;
}
.lb-overlay.open{display:flex}
.lb-wrap{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  max-width:92vw;max-height:92vh;
}
.lb-img{
  max-width:88vw;max-height:78vh;
  object-fit:contain;
  border:1px solid var(--border-gold);
  border-radius:4px;
  display:block;
}
.lb-close{
  position:absolute;top:-16px;right:-16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(16,8,4,.92);border:1px solid var(--border-gold);
  color:var(--gold);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;line-height:1;font-family:'Charm',cursive;
  flex-shrink:0;
}
.lb-close:hover{background:rgba(201,168,76,.15);transform:scale(1.08)}
.lb-footer{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-top:14px;
}
.lb-title{
  font-family:'Charm',cursive;font-size:20px;
  color:var(--gold);letter-spacing:.8px;text-align:center;
}
.lb-note-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 22px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.8);
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  transition:all .2s;
}
.lb-note-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.lb-note-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Comment / Book-Page Overlay ── */
.cm-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(4,2,1,.88);
  align-items:center;justify-content:center;
  padding:24px;
}
.cm-overlay.open{display:flex}
.cm-page{
  background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;
  color:#1a0a02;
  border-radius:6px;
  border:1px solid rgba(155,115,42,.45);
  box-shadow:
    0 24px 70px rgba(0,0,0,.72),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 0 60px rgba(120,90,28,.06);
  max-width:600px;width:100%;max-height:82vh;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}
/* Spine shadow on left edge */
.cm-page::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:34px;
  background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);
  pointer-events:none;
}
/* Top edge sheen */
.cm-page::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);
  pointer-events:none;
}
/* Ruling lines beneath body text (decorative) */
.cm-page-inner{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.cm-hdr{
  padding:28px 32px 16px 44px;
  border-bottom:1px solid rgba(155,115,42,.18);
  flex-shrink:0;
}
.cm-page-title{
  font-family:'Charm',cursive;font-size:28px;font-weight:700;
  color:#7a4010;line-height:1.2;
  text-shadow:0 1px 3px rgba(0,0,0,.13);
}
.cm-page-sub{
  font-family:'Playfair Display',serif;font-size:19px;font-weight:700;
  color:#7a4010;margin-top:7px;font-style:normal;
}
.cm-scroll{
  flex:1;overflow-y:auto;
  padding:18px 32px 22px 44px;
}
.cm-scroll::-webkit-scrollbar{width:4px}
.cm-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3)}
.cm-text{
  font-family:'Lora',serif;font-size:16px;font-style:italic;
  color:#1a0a02;line-height:1.88;
}
.cm-text p{margin-bottom:.9em}
.cm-text p:last-child{margin-bottom:0}
.cm-text p.cm-sub-inline{
  font-family:'Playfair Display',serif;font-size:18px;font-weight:700;
  font-style:normal;color:#7a4010;
  margin:1em 0 .25em;line-height:1.3;
}
.cm-foot{
  padding:12px 32px 16px 44px;
  border-top:1px solid rgba(155,115,42,.18);
  display:flex;justify-content:flex-end;flex-shrink:0;
}
.cm-btn-close{
  padding:8px 24px;border-radius:20px;
  background:rgba(155,115,42,.1);
  border:1px solid rgba(155,115,42,.35);
  color:#4a2e0a;font-family:'Charm',cursive;font-size:14px;
  letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase;
}
.cm-btn-close:hover{background:rgba(155,115,42,.22)}
.cm-x{
  position:absolute;top:13px;right:14px;
  background:none;border:none;
  color:#4a2e0a;font-size:20px;cursor:pointer;
  padding:4px 8px;border-radius:4px;
  line-height:1;transition:background .15s;font-weight:700;
}
.cm-x:hover{background:rgba(155,115,42,.15)}

/* ── Footer ── */
.gal-foot{
  padding:26px 32px;
  background:var(--bg);
  border-top:1px solid var(--border);
  text-align:center;
}
.gal-foot-link{
  font-family:'Charm',cursive;font-size:15px;
  color:var(--text-muted);letter-spacing:.8px;
  cursor:pointer;background:none;border:none;
  text-decoration:none;transition:color .2s;
  padding:0 2px;
}
.gal-foot-link:hover{color:var(--gold)}
.gal-foot-sep{margin:0 14px;color:var(--border);font-size:14px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <button class="hdr-back" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;border-radius:2px">
    Flipbook
  </button>
  <div class="hdr-text">
    <div class="hdr-eyebrow">Image Gallery</div>
    <div class="hdr-title">Echoes of Tomorrow</div>
    <div class="hdr-sub">A Vampire Diaries Universe Fan Novel</div>
    <div class="hdr-rule"></div>
  </div>
  <div class="hdr-carousel">
    <div class="car-stage">
      <img class="car-img car-active"   src="https://lh3.googleusercontent.com/d/1xe9XBsKuzg1qa7s4nWAnvUJozPygooFQ" alt="">
      <img class="car-img car-entering" src="https://lh3.googleusercontent.com/d/1u9I46kFDu9ZKDSFDu4ciKfZi8zkgvUkk" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1LKJrRB5b4BaXokYJ6b7JuzI7o80CsxBt" alt="">
      <img class="car-img car-hidden"   src="https://lh3.googleusercontent.com/d/1t2rFv-2vDX1uX0gOnOxqNdYq27yNi2ON" alt="">
    </div>
  </div>
</header>

<!-- Category Navigation -->
<nav class="cat-nav">
  <button class="cat-tab active" id="tab-book" onclick="switchCat('book')">Book Artwork</button>
  <button class="cat-tab" id="tab-characters" onclick="switchCat('characters')">Characters Artwork</button>
</nav>

<!-- Gallery Content -->
<main class="gallery-wrap">
  <div class="gallery-section active" id="section-book">
    <div class="gallery-grid" id="grid-book"></div>
    <div class="gallery-empty" id="empty-book" style="display:none">No book artwork has been added yet.</div>
  </div>
  <div class="gallery-section" id="section-characters">
    <div class="gallery-grid" id="grid-characters"></div>
    <div class="gallery-empty" id="empty-characters" style="display:none">No character artwork has been added yet.</div>
  </div>
</main>

<!-- Footer -->
<footer class="gal-foot">
  <button class="gal-foot-link" onclick="goFlipbook()">
    <img src="https://lh3.googleusercontent.com/d/1vd2pp-Uvo61CR6y3vifRM2aTBs5n7Bgj" style="height:28px;width:auto;object-fit:contain;vertical-align:middle;margin-right:7px;border-radius:2px">Read the Flipbook
  </button>
  <span class="gal-foot-sep">|</span>
  <button class="gal-foot-link" onclick="galScrollTop()">
    Back to Top<img src="https://lh3.googleusercontent.com/d/1UdXIzhjLnglrTz14xu_yOS51hdYCAszS" style="height:18px;width:auto;object-fit:contain;vertical-align:middle;margin-left:6px">
  </button>
</footer>

<!-- Lightbox Overlay -->
<div class="lb-overlay" id="lb-overlay" onclick="lbBgClick(event)">
  <div class="lb-wrap" id="lb-wrap">
    <button class="lb-close" onclick="closeLb()" title="Close">&#215;</button>
    <img class="lb-img" id="lb-img" src="" alt="">
    <div class="lb-footer">
      <div class="lb-title" id="lb-title" style="display:none"></div>
      <button class="lb-note-btn" id="lb-note-btn" onclick="openNote()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h8"/></svg>
        Read About This Image
      </button>
    </div>
  </div>
</div>

<!-- Comment / Book-Page Overlay -->
<div class="cm-overlay" id="cm-overlay" onclick="noteBgClick(event)">
  <div class="cm-page" id="cm-page">
    <button class="cm-x" onclick="closeNote()">&#215;</button>
    <div class="cm-page-inner">
      <div class="cm-hdr">
        <div class="cm-page-title" id="cm-title"></div>
        <div class="cm-page-sub" id="cm-sub" style="display:none"></div>
      </div>
      <div class="cm-scroll">
        <div class="cm-text" id="cm-body"></div>
      </div>
      <div class="cm-foot">
        <button class="cm-btn-close" onclick="closeNote()">Close</button>
      </div>
    </div>

x20about\x20the\x20tracking\x20of\x20time\x20and\x20place\x20—\x20about\x20orientation\x20within\x20a\x20story\x20where\x20both\x20are\x20unstable.\x20The\x20North\x20Star\x20anchors\x20the\x20base,\x20the\x20fixed\x20point\x20by\x20which\x20everything\x20else\x20is\x20navigated.\x20A\x20gold\x20arrow\x20points\x20directly\x20upward\x20over\x20the\x20vortex\x20portal,\x20marking\x20the\x20direction\x20of\x20the\x20temporal\x20current,\x20the\x20way\x20through.\x20An\x20hourglass\x20measures\x20duration\x20—\x20not\x20the\x20hours\x20of\x20a\x20day\x20but\x20the\x20weight\x20of\x20borrowed\x20time,\x20time\x20pressing\x20on\x20the\x20people\x20who\x20came\x20back\x20with\x20a\x20finite\x20window\x20to\x20change\x20what\x20they\x20came\x20back\x20to\x20change.\x20A\x20metal\x20atom\x20turns\x20under\x20the\x20clock,\x20the\x20structure\x20of\x20matter\x20itself\x20held\x20under\x20the\x20mechanism\x20of\x20the\x20story\x27s\x20cosmic\x20stakes.\x0a\x0a!!Two\x20Clocks,\x20Two\x20Timelines!!\x0a\x0aAt\x20the\x20heart\x20of\x20the\x20bookmark\x20is\x20a\x20large\x20clock\x20—\x20clear-faced,\x20its\x20Roman\x20numerals\x20precise,\x20its\x20hands\x20readable.\x20This\x20is\x20the\x20timeline\x20that\x20has\x20already\x20been\x20set:\x20history\x20as\x20it\x20existed\x20before\x20the\x20travelers\x20arrived,\x20fixed\x20and\x20legible\x20and\x20done.\x20But\x20inside\x20that\x20clock,\x20contained\x20within\x20it,\x20exist\x20a\x20smaller\x20clock.\x20And\x20on\x20that\x20smaller\x20clock,\x20some\x20of\x20the\x20numerals\x20are\x20not\x20fully\x20shaped.\x20They\x20are\x20partially\x20formed,\x20their\x20outlines\x20unclear,\x20their\x20meaning\x20not\x20yet\x20resolved.\x20This\x20is\x20the\x20present\x20timeline\x20—\x20the\x20one\x20the\x20travelers\x20are\x20inside\x20of\x20right\x20now,\x20the\x20one\x20that\x20is\x20still\x20being\x20reshaped\x20by\x20every\x20choice\x20they\x20make\x20and\x20every\x20event\x20they\x20manage\x20to\x20alter.\x20It\x20has\x20not\x20locked\x20into\x20place.\x20It\x20is\x20still\x20becoming.\x20The\x20story\x20you\x20are\x20reading\x20exists\x20inside\x20that\x20smaller\x20clock,\x20in\x20the\x20unresolved\x20space\x20between\x20what\x20was\x20and\x20what\x20will\x20be,\x20in\x20the\x20moment\x20before\x20the\x20hands\x20settle\x20and\x20the\x20future\x20becomes\x20fixed.\x0a\x0a!!What\x20Holds\x20Your\x20Place!!\x0a\x0aThis\x20bookmark\x20is\x20holding\x20more\x20than\x20your\x20place\x20in\x20the\x20book.\x20It\x20is\x20holding\x20the\x20image\x20of\x20the\x20story\x27s\x20central\x20condition:\x20a\x20present\x20moment\x20that\x20is\x20still\x20in\x20motion,\x20watched\x20over\x20by\x20every\x20instrument\x20of\x20navigation\x20and\x20time\x20that\x20the\x20story\x20has\x20to\x20offer,\x20waiting\x20to\x20see\x20which\x20way\x20it\x20resolves.'}},{'url':_0x216b40(0x20d),'title':_0x216b40(0x183),'titlePosition':_0x216b40(0x210),'pov':'','color':'','comment':{'title':_0x216b40(0x1c8),'body':_0x216b40(0x1df)}},{'url':_0x216b40(0x1ee),'title':_0x216b40(0x198),'titlePosition':'top','pov':'','color':'','comment':{'title':_0x216b40(0x196),'body':'The\x20Back\x20arrow\x20is\x20cast\x20in\x20aged\x20bronze\x20and\x20copper.\x20Every\x20surface\x20of\x20it\x20is\x20alive\x20with\x20nature\x20—\x20leaves,\x20acanthus\x20scrollwork,\x20botanical\x20tendrils\x20curling\x20along\x20the\x20shaft\x20and\x20unfurling\x20from\x20the\x20fletching\x20in\x20the\x20unmistakable\x20motif\x20of\x20Gaia\x27s\x20presence.\x20In\x20**Echoes\x20of\x20Tomorrow**,\x20nature\x20magic\x20is\x20the\x20force\x20that\x20made\x20time\x20travel\x20possible.\x20Gaia,\x20the\x20primordial\x20earth\x20goddess\x20who\x20moves\x20beneath\x20every\x20visible\x20event\x20in\x20this\x20story,\x20used\x20the\x20oldest\x20magic\x20in\x20existence\x20—\x20nature\x27s\x20magic\x20—\x20to\x20power\x20the\x20spell\x20that\x20sent\x20the\x20travelers\x20back.\x20Her\x20signature\x20is\x20growth,\x20living\x20things,\x20the\x20relentless\x20forward\x20motion\x20of\x20nature\x20that\x20simultaneously\x20reaches\x20backward\x20into\x20root\x20and\x20soil.\x20That\x20magic\x20is\x20woven\x20into\x20these\x20arrows\x20because\x20direction\x20and\x20nature\x27s\x20power\x20and\x20influence\x20are\x20inseparable\x20in\x20this\x20story.\x0a\x0aBut\x20nature\x20magic\x20that\x20is\x20used\x20to\x20bend\x20time\x20does\x20not\x20simply\x20spend\x20itself\x20and\x20disappear.\x20It\x20seeks\x20balance.\x20Every\x20person\x20touched\x20by\x20the\x20time\x20spell\x20in\x20the\x20present\x20timeline\x20carries\x20a\x20cost\x20—\x20the\x20magic\x20pressing\x20against\x20them\x20the\x20way\x20a\x20living\x20thing\x20presses\x20toward\x20equilibrium,\x20wanting\x20to\x20restore\x20what\x20was\x20displaced.\x20The\x20arrow\x20points\x20left,\x20back\x20through\x20the\x20pages,\x20back\x20through\x20the\x20timeline,\x20back\x20toward\x20what\x20came\x20before.\x20In\x20the\x20world\x20of\x20this\x20story,\x20that\x20direction\x20is\x20where\x20the\x20travelers\x20returned\x20to,\x20and\x20the\x20magic\x20that\x20brought\x20them\x20there\x20has\x20never\x20stopped\x20pulling.'}},{'url':_0x216b40(0x17f),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Next\x20Bottom','titlePosition':_0x216b40(0x210),'pov':'','color':'','comment':{'title':_0x216b40(0x185),'body':'The\x20Next\x20arrow\x20shares\x20every\x20design\x20element\x20of\x20its\x20counterpart\x20—\x20the\x20same\x20aged\x20bronze\x20and\x20copper,\x20the\x20same\x20botanical\x20scrollwork\x20covering\x20the\x20shaft,\x20the\x20same\x20acanthus\x20leaves\x20and\x20curling\x20tendrils\x20of\x20Gaia\x27s\x20nature\x20magic\x20worked\x20into\x20every\x20surface.\x20Where\x20the\x20Back\x20arrow\x27s\x20ornamentation\x20trails\x20behind\x20the\x20point\x20like\x20something\x20being\x20pulled\x20from\x20where\x20it\x20came,\x20the\x20Next\x20arrow\x27s\x20flourishes\x20reach\x20forward,\x20unfurling\x20ahead\x20of\x20the\x20tip\x20in\x20the\x20direction\x20of\x20what\x20has\x20not\x20yet\x20been\x20revealed.\x20It\x20moves\x20forward\x20through\x20the\x20pages,\x20forward\x20through\x20the\x20events\x20of\x20the\x20story\x20as\x20they\x20unfold,\x20in\x20the\x20same\x20way\x20nature\x20grows\x20forward.\x20It\x20does\x20not\x20choose\x20to.\x20It\x20is\x20what\x20nature\x20does\x20—\x20reach\x20toward\x20the\x20next\x20moment,\x20the\x20next\x20season,\x20the\x20next\x20form\x20it\x20will\x20take.\x20The\x20travelers\x20in\x20this\x20story\x20are\x20doing\x20the\x20same\x20thing,\x20inside\x20a\x20timeline\x20that\x20Gaia\x27s\x20magic\x20shaped\x20specifically\x20so\x20they\x20could.\x0a\x0aTogether,\x20the\x20two\x20arrows\x20define\x20the\x20reader\x27s\x20movement\x20through\x20the\x20story\x20in\x20the\x20same\x20terms\x20the\x20story\x20uses\x20for\x20everything\x20else:\x20as\x20a\x20navigation\x20problem\x20inside\x20a\x20world\x20where\x20time\x20is\x20not\x20fixed\x20and\x20the\x20direction\x20you\x20move\x20carries\x20consequence.\x20The\x20botanical\x20detail\x20on\x20both\x20arrows\x20is\x20Gaia\x27s\x20reminder\x20that\x20the\x20path\x20through\x20this\x20story\x20—\x20forward\x20or\x20back\x20—\x20runs\x20on\x20her\x20magic,\x20and\x20nature\x20magic\x20never\x20moves\x20without\x20cost.'}},{'url':_0x216b40(0x20f),'title':_0x216b40(0x171),'titlePosition':_0x216b40(0x210),'pov':'','color':'','comment':{'title':_0x216b40(0x165),'body':'The\x20clock\x20that\x20serves\x20as\x20the\x20page\x20tracker\x20is\x20a\x20skeleton\x20timepiece\x20—\x20its\x20face\x20open,\x20its\x20gears\x20fully\x20visible,\x20its\x20inner\x20workings\x20exposed.\x20The\x20same\x20way\x20the\x20mechanisms\x20of\x20time\x20became\x20exposed\x20to\x20those\x20who\x20reached\x20through\x20time\x20to\x20change\x20it.\x20The\x20clock\x27s\x20frame\x20is\x20bronze\x20and\x20green\x20enamel,\x20the\x20same\x20color\x20combination\x20woven\x20through\x20the\x20flipbook\x27s\x20entire\x20visual\x20language.\x20But\x20the\x20clock\x20does\x20not\x20exist\x20alone.\x20Dark\x20tendrils\x20of\x20blood\x20move\x20through\x20and\x20around\x20it\x20—\x20coiling\x20between\x20the\x20gears,\x20wrapping\x20across\x20the\x20numerals,\x20pressing\x20toward\x20the\x20hands.\x20They\x20came\x20through\x20time\x20with\x20the\x20travelers.\x20They\x20have\x20never\x20left.\x0a\x0aThe\x20blood\x20is\x20everything\x20the\x20mission\x20demands,\x20across\x20every\x20timeline\x20at\x20once.\x20The\x20lives\x20already\x20lost\x20in\x20the\x20future\x20they\x20came\x20back\x20to\x20prevent.\x20The\x20blood\x20already\x20spilled\x20in\x20a\x20timeline\x20they\x20are\x20trying\x20to\x20unmake.\x20The\x20grief\x20of\x20mourning\x20people\x20who\x20are\x20still\x20alive\x20and\x20unknowing\x20in\x20the\x20present.\x20The\x20relationships\x20and\x20the\x20loved\x20ones\x20that\x20may\x20never\x20exist\x20in\x20this\x20timeline\x20because\x20the\x20travelers\x20are\x20changing\x20the\x20very\x20circumstances\x20that\x20created\x20them\x20—\x20futures\x20that\x20were\x20real\x20to\x20them,\x20being\x20unmade\x20by\x20their\x20own\x20hands.\x20And\x20then\x20the\x20blood\x20still\x20coming:\x20the\x20sacrifices\x20already\x20decided\x20on\x20but\x20not\x20yet\x20fully\x20paid,\x20the\x20question\x20each\x20character\x20is\x20answering\x20in\x20real\x20time\x20of\x20how\x20far\x20they\x20are\x20willing\x20to\x20go,\x20how\x20much\x20blood\x20they\x20are\x20prepared\x20to\x20spill,\x20what\x20they\x20are\x20willing\x20to\x20become,\x20to\x20keep\x20the\x20events\x20of\x20the\x20future\x20from\x20happening.\x0a\x0aThe\x20page\x20tracker\x20marks\x20where\x20you\x20are\x20in\x20the\x20story.\x20The\x20blood\x20marks\x20what\x20the\x20story\x20is\x20made\x20of\x20—\x20blood\x20already\x20spilled,\x20blood\x20being\x20spilled\x20now,\x20and\x20blood\x20that\x20has\x20yet\x20to\x20be\x20shed,\x20and\x20the\x20cost\x20and\x20consequences\x20of\x20it.\x20The\x20blood\x20came\x20through\x20time\x20because\x20it\x20belongs\x20to\x20the\x20people\x20who\x20did.\x20It\x20reaches\x20toward\x20the\x20hands\x20of\x20the\x20clock\x20because\x20time\x20is\x20precisely\x20what\x20it\x20is\x20owed.'}},{'url':'https://lh3.googleusercontent.com/d/1xe9XBsKuzg1qa7s4nWAnvUJozPygooFQ','title':_0x216b40(0x1e4),'titlePosition':'top','pov':'','color':'','comment':{'title':'Artwork\x20Gallery','body':_0x216b40(0x1cc)}},{'url':_0x216b40(0x16d),'title':'Flipbook\x20Navigation\x20Element\x20-\x20Bookmark\x20Bottom','titlePosition':_0x216b40(0x210),'pov':'','color':'','comment':{'title':_0x216b40(0x179),'body':_0x216b40(0x1f2)}},{'url':_0x216b40(0x17a),'title':_0x216b40(0x1a7),'titlePosition':'top','pov':'','color':'','comment':{'title':_0x216b40(0x1d3),'body':'The\x20open\x20book\x20icon\x20switches\x20the\x20flipbook\x20into\x20**Easier\x20Reading**\x20mode\x20—\x20a\x20clean,\x20accessible\x20version\x20of\x20the\x20text\x20rendered\x20in\x20a\x20standard\x20printed\x20font,\x20designed\x20for\x20readers\x20who\x20want\x20to\x20follow\x20the\x20story\x20without\x20the\x20stylistic\x20layer\x20of\x20the\x20journal\x27s\x20handwritten\x20presentation.\x20It\x20depicts\x20the\x20book\x20itself\x20as\x20the\x20story\x20imagines\x20it:\x20aged\x20parchment\x20pages\x20within\x20a\x20carved\x20bronze\x20spine,\x20dark\x20vine\x20work\x20curling\x20up\x20from\x20the\x20binding,\x20blood\x20drops\x20scattered\x20across\x20both\x20pages,\x20a\x20small\x20clock\x20embedded\x20into\x20the\x20left\x20page,\x20the\x20title\x20in\x20deep\x20red\x20script\x20on\x20the\x20right.\x20The\x20image\x20captures\x20everything\x20the\x20story\x20contains\x20—\x20the\x20beauty,\x20the\x20weight,\x20the\x20marks\x20left\x20by\x20the\x20narrative\x20—\x20while\x20the\x20mode\x20it\x20activates\x20steps\x20back\x20from\x20all\x20of\x20that\x20and\x20simply\x20lets\x20the\x20words\x20be\x20read.\x20It\x20is\x20the\x20version\x20of\x20the\x20story\x20for\x20when\x20the\x20experience\x20needed\x20is\x20the\x20story\x20itself,\x20delivered\x20cleanly\x20and\x20without \x20the\x20planet.\x20None\x20of\x20it\x20gives\x20back\x20what\x20was\x20taken.\x20He\x20studies\x20it\x20anyway.\x0a\x0a!!The\x20Image!!\x0a\x0aKol\x20stands\x20in\x20a\x20room\x20that\x20is\x20half\x20archive,\x20half\x20ritual\x20space\x20—\x20ancient\x20tomes\x20stacked\x20with\x20the\x20particular\x20order\x20of\x20someone\x20who\x20has\x20been\x20doing\x20this\x20for\x20a\x20very\x20long\x20time,\x20candles\x20burning\x20with\x20light\x20that\x20makes\x20the\x20shadows\x20directional,\x20a\x20runic\x20circle\x20on\x20the\x20stone\x20floor\x20still\x20faintly\x20luminous\x20from\x20recent\x20work.\x20His\x20name\x20burns\x20in\x20the\x20background\x20in\x20electric\x20red,\x20modern\x20script\x20over\x20an\x20ancient\x20setting,\x20a\x20signature\x20from\x20a\x20man\x20who\x20has\x20never\x20belonged\x20entirely\x20to\x20any\x20single\x20century.\x20He\x20is\x20not\x20reading.\x20He\x20is\x20well\x20past\x20reading.\x20He\x20stands\x20in\x20the\x20middle\x20of\x20everything\x20he\x20has\x20learned\x20and\x20holds\x20it\x20the\x20way\x20a\x20person\x20holds\x20something\x20that\x20cost\x20them\x20everything\x20to\x20acquire\x20and\x20still\x20cannot\x20fill\x20the\x20specific\x20shape\x20of\x20what\x20they\x20lost.\x0a\x0a!!What\x20This\x20Image\x20Holds!!\x0a\x0aThe\x20books\x20are\x20not\x20trophies.\x20The\x20runic\x20circle\x20is\x20not\x20a\x20performance.\x20The\x20thousand\x20years\x20of\x20accumulated\x20knowledge\x20is\x20the\x20answer\x20Kol\x20constructed\x20to\x20a\x20question\x20that\x20cannot\x20actually\x20be\x20answered\x20—\x20how\x20to\x20be\x20the\x20person\x20you\x20were\x20supposed\x20to\x20be\x20when\x20the\x20thing\x20that\x20made\x20you\x20that\x20person\x20was\x20removed\x20before\x20you\x20fully\x20understood\x20what\x20it\x20was.\x20He\x20cannot\x20cast\x20a\x20spell.\x20He\x20can\x20teach\x20a\x20witch\x20how\x20to\x20cast\x20it\x20in\x20more\x20ways\x20than\x20she\x20knew\x20existed.\x20He\x20can\x20recognize\x20every\x20form\x20of\x20magic\x20in\x20practice,\x20trace\x20its\x20origin,\x20identify\x20its\x20components,\x20predict\x20its\x20consequences,\x20and\x20counter\x20it\x20with\x20something\x20older\x20and\x20more\x20precise.\x20The\x20loss\x20is\x20still\x20the\x20loss.\x20The\x20portrait\x20is\x20what\x20a\x20thousand\x20years\x20of\x20refusing\x20to\x20accept\x20it\x20looks\x20like.\x0a\x0a!!What\x20He\x20Agreed\x20To\x20Carry!!\x0a\x0aOf\x20the\x20three\x20people\x20who\x20carried\x20future\x20memories\x20back\x20through\x20time,\x20Kol\x20was\x20chosen\x20because\x20his\x20knowledge\x20of\x20dark\x20objects,\x20sacrificial\x20magic,\x20and\x20ancient\x20spellwork\x20is\x20the\x20resource\x20that\x20did\x20not\x20exist\x20the\x20first\x20time\x20—\x20the\x20thing\x20that\x20makes\x20the\x20difference\x20between\x20surviving\x20what\x20is\x20coming\x20and\x20not.\x20He\x20agreed\x20knowing\x20the\x20price:\x20that\x20every\x20wound\x20from\x20the\x20original\x20timeline\x20would\x20find\x20him\x20again,\x20that\x20death\x20was\x20already\x20written,\x20that\x20he\x20could\x20see\x20the\x20shape\x20of\x20it\x20clearly.\x20He\x20came\x20anyway.\x20The\x20portrait\x20captures\x20the\x20quality\x20that\x20makes\x20that\x20possible:\x20a\x20man\x20surrounded\x20by\x20the\x20record\x20of\x20everything\x20he\x20has\x20learned\x20in\x20place\x20of\x20everything\x20he\x20lost,\x20entirely\x20clear-eyed\x20about\x20what\x20the\x20room\x20around\x20him\x20cost,\x20still\x20thinking\x20about\x20what\x20to\x20do\x20with\x20it\x20next.'}},{'url':'https://lh3.googleusercontent.com/d/15X_FkD-JQmCMeduwjQWXXVtd9ieg6Vmf','title':_0x216b40(0x204),'titlePosition':'top','pov':_0x216b40(0x19c),'color':_0x216b40(0x191),'comment':null},{'url':_0x216b40(0x209),'title':_0x216b40(0x186),'titlePosition':'top','pov':'Cleo\x20Sowande','color':_0x216b40(0x182),'comment':null},{'url':_0x216b40(0x1cb),'title':_0x216b40(0x218),'titlePosition':_0x216b40(0x210),'pov':'Davina\x20Claire','color':_0x216b40(0x191),'comment'
