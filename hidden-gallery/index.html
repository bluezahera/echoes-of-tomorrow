<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Upright:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica:ital@1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oregano&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Allison&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Seaweed+Script&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Moon+Dance&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Over+the+Rainbow&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zeyada&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Corinthia&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dawning+of+a+New+Day&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pompiere&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Waiting+for+the+Sunrise&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montez&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0806;--bg2:#110904;--bg3:#1a0f06;
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.3);--gold-glow:rgba(201,168,76,.12);
  --text:#e8d8b0;--text-dim:#9b7a4a;--text-muted:#7a5e32;
  --border:rgba(139,106,58,.22);--border-gold:rgba(201,168,76,.38);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;font-size:16px}

/* ── Letter Intro Overlay ── */
.lt-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(4,2,1,.96);
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
  transition:opacity .75s ease;
}
.lt-overlay.fade-out{opacity:0;pointer-events:none}
.lt-overlay.gone{display:none}
.lt-page{
  background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;
  color:#1a0a02;border-radius:6px;
  border:1px solid rgba(155,115,42,.45);
  box-shadow:0 24px 70px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 60px rgba(120,90,28,.06),-4px 0 18px rgba(0,0,0,.2),4px 0 18px rgba(0,0,0,.2);
  width:100%;max-width:580px;max-height:88vh;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.lt-page::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:34px;
  background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);
  pointer-events:none;
}
.lt-page::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);
  pointer-events:none;
}
.lt-hdr{
  padding:28px 32px 16px 44px;
  border-bottom:1px solid rgba(155,115,42,.18);
  flex-shrink:0;background:rgba(244,234,208,.35);
}
.lt-eyebrow{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;
  color:#7a5e32;text-transform:uppercase;margin-bottom:8px;
}
.lt-title{
  font-family:'Charm',cursive;font-size:30px;font-weight:700;
  color:#7a4010;line-height:1.2;
  text-shadow:0 1px 3px rgba(0,0,0,.13);
}
.lt-scroll{
  flex:1;overflow-y:auto;
  padding:20px 32px 24px 44px;
  scrollbar-width:thin;scrollbar-color:rgba(155,115,42,.3) transparent;
}
.lt-scroll::-webkit-scrollbar{width:4px}
.lt-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3);border-radius:2px}
.lt-text{
  font-family:'Lora',serif;font-size:16px;font-style:italic;
  color:#1a0a02;line-height:1.88;
}
.lt-text p{margin-bottom:.9em}
.lt-text p:last-child{margin-bottom:0}
.lt-text p.lt-sub{
  font-family:'Playfair Display',serif;font-size:18px;font-weight:700;
  font-style:normal;color:#7a4010;margin:1em 0 .25em;line-height:1.3;
}
.lt-text p.lt-sig{
  font-family:'Montez',cursive;
  font-style:normal;font-weight:700;
  text-align:right;margin-top:1.4em;font-size:1.9em;
  line-height:1.4;
}
.lt-foot{
  padding:14px 32px 18px 44px;
  border-top:1px solid rgba(155,115,42,.18);
  display:flex;justify-content:flex-end;
  flex-shrink:0;background:rgba(244,234,208,.25);
}
.lt-enter-btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:10px 28px;border-radius:22px;
  background:rgba(122,64,16,.12);
  border:1px solid rgba(155,115,42,.45);
  color:#4a2e0a;font-family:'Charm',cursive;font-size:16px;
  letter-spacing:1px;cursor:pointer;transition:all .2s;
}
.lt-enter-btn:hover{background:rgba(122,64,16,.26);border-color:rgba(155,115,42,.7)}
.lt-enter-btn svg{flex-shrink:0}

/* ── Header ── */
.hdr{
  background:linear-gradient(180deg,#0a0603 0%,#110904 100%);
  border-bottom:1px solid var(--border-gold);
  padding:28px 32px 24px;
  position:relative;
  text-align:center;
}
.hdr-back{
  position:absolute;left:24px;top:50%;transform:translateY(-50%);
  display:inline-flex;align-items:center;gap:7px;
  color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;
  text-decoration:none;letter-spacing:1px;cursor:pointer;
  padding:8px 16px;border-radius:22px;
  border:1px solid var(--border-gold);
  background:rgba(12,8,4,.7);
  transition:all .22s;white-space:nowrap;
}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.hdr-eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.hdr-title{font-family:'Ephesis',cursive;font-size:60px;color:#d42020;line-height:1.05;text-shadow:0 2px 24px rgba(180,20,20,.45)}
.hdr-sub{font-family:'Cormorant Upright',serif;font-size:20px;font-weight:600;color:var(--gold);margin-top:8px;letter-spacing:.8px}
.hdr-rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:16px auto 0}

/* ── Category Tabs ── */
.cat-nav{
  display:flex;justify-content:center;gap:10px;
  padding:22px 32px 0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.cat-tab{
  padding:10px 30px 11px;border-radius:22px 22px 0 0;
  border:1px solid transparent;border-bottom:none;
  background:transparent;color:var(--text-dim);
  font-family:'Charm',cursive;font-size:18px;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;position:relative;bottom:-1px;
}
.cat-tab:hover{color:var(--text);background:var(--gold-glow)}
.cat-tab.active{background:var(--bg2);color:var(--gold);border-color:var(--border-gold);border-bottom-color:var(--bg2)}

/* ── Gallery Wrap ── */
.gallery-wrap{background:var(--bg2);min-height:72vh;padding:32px 36px 48px}
.gallery-section{display:none}
.gallery-section.active{display:block}
.gallery-empty{text-align:center;padding:90px 20px;color:var(--text-muted);font-style:italic;font-size:20px;font-family:'Cormorant Garamond',serif}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}

/* ── Image Card ── */
.g-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:transform .22s,box-shadow .22s,border-color .22s;position:relative}
.g-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,168,76,.22);border-color:var(--border-gold)}
.g-thumb-wrap{position:relative;width:100%;padding-bottom:125%;overflow:hidden;background:#080503;cursor:pointer}
#grid-book .g-thumb-wrap img{object-fit:contain}
#grid-characters .g-thumb-wrap{padding-bottom:129.41%}
.g-thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .38s;display:block}
.g-card:hover .g-thumb-wrap img{transform:scale(1.05)}
.g-zoom-hint{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .22s;display:flex;align-items:center;justify-content:center;pointer-events:none}
.g-card:hover .g-zoom-hint{background:rgba(0,0,0,.18)}
.g-zoom-icon{opacity:0;transform:scale(.7);transition:opacity .22s,transform .22s;width:44px;height:44px;border-radius:50%;background:rgba(12,8,4,.75);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center}
.g-card:hover .g-zoom-icon{opacity:1;transform:scale(1)}
.g-zoom-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.8}
.g-title{padding:10px 14px;font-family:'Charm',cursive;font-size:17px;color:var(--gold);letter-spacing:.3px;text-align:center;line-height:1.3}
.g-title.top{border-bottom:1px solid var(--border)}
.g-title.bottom{border-top:1px solid var(--border)}
.g-note-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px 14px;background:rgba(201,168,76,.05);border:none;border-top:1px solid var(--border);color:var(--text-muted);font-family:'Charm',cursive;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;transition:all .18s}
.g-note-btn:hover{background:var(--gold-glow);color:var(--gold)}
.g-note-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}

/* ── Lightbox ── */
.lb-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(4,2,1,.93);align-items:center;justify-content:center;padding:20px}
.lb-overlay.open{display:flex}
.lb-wrap{position:relative;display:flex;flex-direction:column;align-items:center;max-width:92vw;max-height:92vh}
.lb-img{max-width:88vw;max-height:78vh;object-fit:contain;border:1px solid var(--border-gold);border-radius:4px;display:block}
.lb-close{position:absolute;top:-16px;right:-16px;width:38px;height:38px;border-radius:50%;background:rgba(16,8,4,.92);border:1px solid var(--border-gold);color:var(--gold);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;line-height:1;font-family:'Charm',cursive;flex-shrink:0}
.lb-close:hover{background:rgba(201,168,76,.15);transform:scale(1.08)}
.lb-footer{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
.lb-title{font-family:'Charm',cursive;font-size:20px;color:var(--gold);letter-spacing:.8px;text-align:center}
.lb-note-btn{display:flex;align-items:center;gap:8px;padding:9px 22px;border-radius:22px;border:1px solid var(--border-gold);background:rgba(12,8,4,.8);color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.lb-note-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.lb-note-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Comment / Book-Page Overlay ── */
.cm-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(4,2,1,.88);align-items:center;justify-content:center;padding:24px}
.cm-overlay.open{display:flex}
.cm-page{
  background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;
  color:#1a0a02;border-radius:6px;border:1px solid rgba(155,115,42,.45);
  box-shadow:0 24px 70px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 60px rgba(120,90,28,.06);
  max-width:600px;width:100%;max-height:82vh;display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.cm-page::before{content:'';position:absolute;left:0;top:0;bottom:0;width:34px;background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);pointer-events:none}
.cm-page::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);pointer-events:none}
.cm-page-inner{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cm-hdr{padding:28px 32px 16px 44px;border-bottom:1px solid rgba(155,115,42,.18);flex-shrink:0}
.cm-page-title{font-family:'Charm',cursive;font-size:28px;font-weight:700;color:#7a4010;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.13)}
.cm-page-sub{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:#7a4010;margin-top:7px;font-style:normal}
.cm-scroll{flex:1;overflow-y:auto;padding:18px 32px 22px 44px;scrollbar-width:thin;scrollbar-color:rgba(155,115,42,.3) transparent}
.cm-scroll::-webkit-scrollbar{width:4px}
.cm-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3)}
.cm-text{font-family:'Lora',serif;font-size:16px;font-style:italic;color:#1a0a02;line-height:1.88}
.cm-text p{margin-bottom:.9em}
.cm-text p:last-child{margin-bottom:0}
.cm-text p.cm-sub-inline{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;font-style:normal;color:#7a4010;margin:1em 0 .25em;line-height:1.3}
.cm-foot{padding:12px 32px 16px 44px;border-top:1px solid rgba(155,115,42,.18);display:flex;justify-content:flex-end;flex-shrink:0}
.cm-btn-close{padding:8px 24px;border-radius:20px;background:rgba(155,115,42,.1);border:1px solid rgba(155,115,42,.35);color:#4a2e0a;font-family:'Charm',cursive;font-size:14px;letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase}
.cm-btn-close:hover{background:rgba(155,115,42,.22)}
.cm-x{position:absolute;top:13px;right:14px;background:none;border:none;color:#4a2e0a;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px;line-height:1;transition:background .15s;font-weight:700}
.cm-x:hover{background:rgba(155,115,42,.15)}

/* ── Footer ── */
.gal-foot{padding:26px 32px;background:var(--bg);border-top:1px solid var(--border);text-align:center}
.gal-foot-link{font-family:'Charm',cursive;font-size:15px;color:var(--text-muted);letter-spacing:.8px;cursor:pointer;background:none;border:none;text-decoration:none;transition:color .2s;padding:0 2px}
.gal-foot-link:hover{color:var(--gold)}
.gal-foot-sep{margin:0 14px;color:var(--border);font-size:14px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- Letter Intro Overlay -->
<div class="lt-overlay" id="lt-overlay">
  <div class="lt-page">
    <div class="lt-hdr">
      <div class="lt-eyebrow">A Message from the Author</div>
      <div class="lt-title" id="lt-title">Dear Reader</div>
    </div>
    <div class="lt-scroll">
      <div class="lt-text" id="lt-body"></div>
    </div>
    <div class="lt-foot">
      <button class="lt-enter-btn" onclick="enterGallery()">
        Enter the Hidden Gallery
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Header -->
<header class="hdr">
  <button class="hdr-back" onclick="goFlipbook()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Flipbook
  </button>
  <div class="hdr-eyebrow">Hidden Gallery</div>
  <div class="hdr-title">Echoes of Tomorrow</div>
  <div class="hdr-sub">A Vampire Diaries Universe Fan Novel</div>
  <div class="hdr-rule"></div>
</header>

<!-- Category Navigation -->
<nav class="cat-nav">
  <button class="cat-tab active" id="tab-book" onclick="switchCat('book')">Book Artwork</button>
  <button class="cat-tab" id="tab-characters" onclick="switchCat('characters')">Characters Artwork</button>
</nav>

<!-- Gallery Content -->
<main class="gallery-wrap">
  <div class="gallery-section active" id="section-book">
    <div class="gallery-grid" id="grid-book"></div>
    <div class="gallery-empty" id="empty-book" style="display:none">No book artwork has been added yet.</div>
  </div>
  <div class="gallery-section" id="section-characters">
    <div class="gallery-grid" id="grid-characters"></div>
    <div class="gallery-empty" id="empty-characters" style="display:none">No character artwork has been added yet.</div>
  </div>
</main>

<!-- Footer -->
<footer class="gal-foot">
  <button class="gal-foot-link" onclick="goFlipbook()">&#9660; Read the Flipbook</button>
  <span class="gal-foot-sep">|</span>
  <button class="gal-foot-link" onclick="galScrollTop()">&#9650; Back to Top</button>
</footer>

<!-- Lightbox Overlay -->
<div class="lb-overlay" id="lb-overlay" onclick="lbBgClick(event)">
  <div class="lb-wrap" id="lb-wrap">
    <button class="lb-close" onclick="closeLb()" title="Close">&#215;</button>
    <img class="lb-img" id="lb-img" src="" alt="">
    <div class="lb-footer">
      <div class="lb-title" id="lb-title" style="display:none"></div>
      <button class="lb-note-btn" id="lb-note-btn" onclick="openNote()" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h8"/></svg>
        Read About This Image
      </button>
    </div>
  </div>
</div>

<!-- Comment / Book-Page Overlay -->
<div class="cm-overlay" id="cm-overlay" onclick="noteBgClick(event)">
  <div class="cm-page" id="cm-page">
    <button class="cm-x" onclick="closeNote()">&#215;</button>
    <div class="cm-page-inner">
      <div class="cm-hdr">
        <div class="cm-page-title" id="cm-title"></div>
        <div class="cm-page-sub" id="cm-sub" style="display:none"></div>
      </div>
      <div class="cm-scroll">
        <div class="cm-text" id="cm-body"></div>
      </div>
      <div class="cm-foot">
        <button class="cm-btn-close" onclick="closeNote()">Close</button>
      </div>
    </div>
