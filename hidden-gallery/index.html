<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0806;--bg2:#110904;--bg3:#1a0f06;
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.3);--gold-glow:rgba(201,168,76,.12);
  --text:#e8d8b0;--text-dim:#9b7a4a;--text-muted:#7a5e32;
  --border:rgba(139,106,58,.22);--border-gold:rgba(201,168,76,.38);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cormorant Garamond',serif;font-size:16px}

/* ── Letter Overlay ── */
.lt-overlay{position:fixed;inset:0;z-index:500;background:rgba(4,2,1,.96);display:flex;align-items:center;justify-content:center;padding:24px 16px;transition:opacity .75s ease}
.lt-overlay.fade-out{opacity:0;pointer-events:none}
.lt-overlay.gone{display:none}
.lt-page{background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;color:#1a0a02;border-radius:6px;border:1px solid rgba(155,115,42,.45);box-shadow:0 24px 70px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.5),-4px 0 18px rgba(0,0,0,.2),4px 0 18px rgba(0,0,0,.2);width:100%;max-width:580px;max-height:88vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lt-page::before{content:'';position:absolute;left:0;top:0;bottom:0;width:34px;background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);pointer-events:none}
.lt-page::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);pointer-events:none}
.lt-hdr{padding:28px 32px 16px 44px;border-bottom:1px solid rgba(155,115,42,.18);flex-shrink:0;background:rgba(244,234,208,.35)}
.lt-eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:#7a5e32;text-transform:uppercase;margin-bottom:8px}
.lt-title{font-family:'Charm',cursive;font-size:40px;font-weight:700;color:#7a4010;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.13)}
.lt-scroll{flex:1;overflow-y:auto;padding:20px 32px 24px 44px;scrollbar-width:thin;scrollbar-color:rgba(155,115,42,.3) transparent}
.lt-scroll::-webkit-scrollbar{width:4px}
.lt-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3);border-radius:2px}
.lt-text{font-family:'Lora',serif;font-size:24px;font-style:italic;color:#1a0a02;line-height:1.88}
.lt-text p{margin-bottom:.9em}
.lt-text p:last-child{margin-bottom:0}
.lt-text p.lt-sub{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;font-style:normal;color:#7a4010;margin:1em 0 .25em;line-height:1.3}
.lt-text p.lt-sig{font-family:'Montez',cursive;font-style:normal;font-weight:700;text-align:right;margin-top:1.4em;font-size:1.9em;line-height:1.4}
.lt-foot{padding:14px 32px 18px 44px;border-top:1px solid rgba(155,115,42,.18);display:flex;justify-content:flex-end;flex-shrink:0;background:rgba(244,234,208,.25)}
.lt-enter-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 28px;border-radius:22px;background:rgba(122,64,16,.12);border:1px solid rgba(155,115,42,.45);color:#4a2e0a;font-family:'Charm',cursive;font-size:22px;letter-spacing:1px;cursor:pointer;transition:all .2s}
.lt-enter-btn:hover{background:rgba(122,64,16,.26);border-color:rgba(155,115,42,.7)}

/* ── Chapter Reader Overlay ── */
.cr-overlay{position:fixed;inset:0;z-index:300;background:rgba(4,2,1,.98);display:none;flex-direction:column}
.cr-overlay.open{display:flex}
.cr-hdr{background:linear-gradient(180deg,#0a0603,#110904);border-bottom:1px solid var(--border-gold);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.cr-close{background:none;border:none;color:var(--gold);font-size:40px;cursor:pointer;padding:6px 12px;border-radius:4px;font-family:'Charm',cursive;line-height:1;transition:background .15s;flex-shrink:0}
.cr-close:hover{background:rgba(201,168,76,.15)}
.cr-hdr-info{flex:1;min-width:0}
.cr-hdr-label{font-family:'Cinzel',serif;font-size:18px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase}
.cr-hdr-title{font-family:'Playball',cursive;font-size:22px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-er-btn{padding:7px 16px;border-radius:20px;border:1px solid var(--border-gold);background:rgba(12,8,4,.8);color:var(--text-dim);font-family:'Charm',cursive;font-size:24px;letter-spacing:1px;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.cr-er-btn:hover{background:rgba(201,168,76,.12);color:var(--gold)}
.cr-er-btn.active{background:rgba(45,92,62,.2);border-color:#4caf7d;color:#4caf7d}
.cr-page-wrap{flex:1;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;scrollbar-width:thin;scrollbar-color:rgba(139,106,58,.25) transparent}
.cr-page-wrap::-webkit-scrollbar{width:4px}
.cr-page-wrap::-webkit-scrollbar-thumb{background:rgba(139,106,58,.25)}
.cr-page{background:linear-gradient(rgba(244,234,208,.08),rgba(244,234,208,.08)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;width:100%;max-width:560px;min-height:500px;border-radius:4px;padding:46px 48px;box-shadow:0 8px 40px rgba(0,0,0,.6);color:#1a0a02;position:relative}
.cr-nav{background:rgba(8,4,2,.9);border-top:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cr-nav-btn{padding:8px 20px;border-radius:20px;border:1px solid var(--border-gold);background:rgba(12,8,4,.8);color:var(--gold);font-family:'Charm',cursive;font-size:24px;letter-spacing:1px;cursor:pointer;transition:all .2s}
.cr-nav-btn:hover:not(:disabled){background:rgba(201,168,76,.15)}
.cr-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.cr-page-info{font-family:'Cinzel',serif;font-size:22px;letter-spacing:2px;color:var(--text-muted)}

/* Chapter reader typography — Story Immersion */
.cr-page .cn{font-family:'Playball',cursive;font-size:39px;color:#8b1a1a;text-align:center;letter-spacing:1px;margin-bottom:6px}
.cr-page h2.ct{font-family:'Playball',cursive;font-size:39px;font-weight:700;color:#1a0f05;text-align:center;letter-spacing:1px;margin-bottom:18px}
.cr-page hr.div{border:none;border-top:1px solid rgba(139,106,58,.35);margin:14px auto;width:80%}
.cr-page .eq{font-family:'Parisienne',cursive;font-size:33px;color:#2a1a0a;text-align:center;line-height:1.8;margin:14px 10px}
.cr-page .eqa{font-family:'Parisienne',cursive;font-size:33px;font-weight:700;color:#8b1a1a;text-align:center;margin-top:6px}
.cr-page .ch{font-family:'Parisienne',cursive;font-size:28px;color:#1a0f05;font-weight:700;margin:18px 0 22px}
.cr-page .bt{font-family:'La Belle Aurore',cursive;font-size:28px;color:#120c04;line-height:1.55}
.cr-page .bt p{margin-bottom:1em}
.cr-page .bt p.op{font-size:29px;margin-bottom:13px}
.cr-page .sub{font-family:'Cormorant Upright',serif;font-size:36px;font-weight:700;color:#8b1a1a;margin:1.2em 0 0.3em;display:block;line-height:1.2}
.cr-page .sub2{font-family:'Cormorant Upright',serif;font-size:36px;font-weight:700;color:#cc1111;margin:1.2em 0 0.3em;display:block;line-height:1.2}
.cr-page .beat{font-weight:700}
.cr-page .pnum{text-align:center;margin-top:28px;font-family:'Cinzel',serif;font-size:10px;color:#9b7a4a;letter-spacing:2px}
/* Easier Reading overrides */
.cr-page.easy-read .cn{font-family:'Cinzel Decorative',serif;font-style:italic}
.cr-page.easy-read h2.ct{font-family:'Cinzel Decorative',serif;font-style:italic}
.cr-page.easy-read .eq{font-family:'Quintessential',cursive;font-style:italic}
.cr-page.easy-read .eqa{font-family:'Quintessential',cursive;font-style:italic}
.cr-page.easy-read .ch{font-family:'Cinzel Decorative',serif;font-style:italic}
.cr-page.easy-read .bt{font-family:'EB Garamond',serif!important;font-size:34px!important;line-height:1.75!important}
.cr-page.easy-read .bt p.op{font-size:22px!important}
.cr-page.easy-read .sub{font-family:'Playfair Display',serif!important;font-style:normal!important;font-weight:700!important}
.cr-page.easy-read .sub2{font-family:'Playfair Display',serif!important;font-style:normal!important;font-weight:700!important}

/* ── Character Contents List ── */
.cc-list{display:flex;flex-direction:column;gap:14px}
.cc-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .22s}
.cc-card:hover{border-color:var(--border-gold);background:rgba(201,168,76,.05);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.cc-info{flex:1;min-width:0}
.cc-label{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px}
.cc-chapter-title{font-family:'Playball',cursive;font-size:28px;color:var(--gold)}
.cc-section{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--text-dim);font-style:italic;margin-top:4px}
.cc-meta{font-size:17px;color:var(--text-muted);margin-top:6px}
.cc-arrow{color:var(--text-muted);font-size:22px;flex-shrink:0}

/* ── Header ── */
.hdr{background:linear-gradient(180deg,#0a0603 0%,#110904 100%);border-bottom:1px solid var(--border-gold);padding:28px 32px 28px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hdr-back{display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);font-family:'Charm',cursive;font-size:30px;text-decoration:none;letter-spacing:1px;cursor:pointer;padding:10px 22px;border-radius:22px;border:1px solid var(--border-gold);background:rgba(12,8,4,.7);transition:all .22s;white-space:nowrap;margin-top:18px;align-self:flex-start}
.hdr-back:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.hdr-eyebrow{font-family:'Cinzel',serif;font-size:13px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.hdr-title{font-family:'Ephesis',cursive;font-size:90px;color:#d42020;line-height:1.05;text-shadow:0 2px 24px rgba(180,20,20,.45)}
.hdr-sub{font-family:'Cormorant Upright',serif;font-size:26px;font-weight:600;color:var(--gold);margin-top:8px;letter-spacing:.8px}
.hdr-rule{width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:16px auto 0}

/* ── Category Tabs ── */
.cat-nav{display:flex;justify-content:center;gap:10px;padding:22px 32px 0;background:var(--bg2);border-bottom:1px solid var(--border)}
.cat-tab{padding:10px 30px 11px;border-radius:22px 22px 0 0;border:1px solid transparent;border-bottom:none;background:transparent;color:var(--text-dim);font-family:'Charm',cursive;font-size:22px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;position:relative;bottom:-1px}
.cat-tab:hover{color:var(--text);background:var(--gold-glow)}
.cat-tab.active{background:var(--bg2);color:var(--gold);border-color:var(--border-gold);border-bottom-color:var(--bg2)}

/* ── Gallery Wrap ── */
.gallery-wrap{background:var(--bg2);min-height:72vh;padding:32px 36px 48px}
.gallery-section{display:none}
.gallery-section.active{display:block}
.gallery-empty{text-align:center;padding:90px 20px;color:var(--text-muted);font-style:italic;font-size:20px;font-family:'Cormorant Garamond',serif}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}

/* ── Image Card ── */
.g-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:transform .22s,box-shadow .22s,border-color .22s;position:relative}
.g-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,168,76,.22);border-color:var(--border-gold)}
.g-thumb-wrap{position:relative;width:100%;padding-bottom:129.41%;overflow:hidden;background:#080503;cursor:pointer}
.g-thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .38s;display:block}
.g-card:hover .g-thumb-wrap img{transform:scale(1.05)}
.g-zoom-hint{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .22s;display:flex;align-items:center;justify-content:center;pointer-events:none}
.g-card:hover .g-zoom-hint{background:rgba(0,0,0,.18)}
.g-zoom-icon{opacity:0;transform:scale(.7);transition:opacity .22s,transform .22s;width:44px;height:44px;border-radius:50%;background:rgba(12,8,4,.75);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center}
.g-card:hover .g-zoom-icon{opacity:1;transform:scale(1)}
.g-zoom-icon svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.8}
.g-title{padding:10px 14px;font-family:'Charm',cursive;font-size:17px;color:var(--gold);letter-spacing:.3px;text-align:center;line-height:1.3}
.g-title.top{border-bottom:1px solid var(--border)}
.g-title.bottom{border-top:1px solid var(--border)}
.g-note-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px 14px;background:rgba(201,168,76,.05);border:none;border-top:1px solid var(--border);color:var(--text-muted);font-family:'Charm',cursive;font-size:16px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;transition:all .18s}
.g-note-btn:hover{background:var(--gold-glow);color:var(--gold)}
.g-note-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}

/* ── Lightbox ── */
.lb-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(4,2,1,.93);align-items:center;justify-content:center;padding:20px}
.lb-overlay.open{display:flex}
.lb-wrap{position:relative;display:flex;flex-direction:column;align-items:center;max-width:92vw;max-height:92vh}
.lb-img{max-width:88vw;max-height:78vh;object-fit:contain;border:1px solid var(--border-gold);border-radius:4px;display:block}
.lb-close{position:absolute;top:-16px;right:-16px;width:38px;height:38px;border-radius:50%;background:rgba(16,8,4,.92);border:1px solid var(--border-gold);color:var(--gold);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;line-height:1;font-family:'Charm',cursive;flex-shrink:0}
.lb-close:hover{background:rgba(201,168,76,.15);transform:scale(1.08)}
.lb-footer{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
.lb-title{font-family:'Charm',cursive;font-size:20px;color:var(--gold);letter-spacing:.8px;text-align:center}
.lb-note-btn{display:flex;align-items:center;gap:8px;padding:9px 22px;border-radius:22px;border:1px solid var(--border-gold);background:rgba(12,8,4,.8);color:var(--text-dim);font-family:'Charm',cursive;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.lb-note-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.08)}
.lb-note-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Comment Overlay ── */
.cm-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(4,2,1,.88);align-items:center;justify-content:center;padding:24px}
.cm-overlay.open{display:flex}
.cm-page{background:linear-gradient(rgba(244,234,208,.10),rgba(244,234,208,.10)),url('https://lh3.googleusercontent.com/d/1bEYTKNhtDXlcdgZCNrhYJM4n-piv4aoh') center/cover no-repeat #f4ead0;color:#1a0a02;border-radius:6px;border:1px solid rgba(155,115,42,.45);box-shadow:0 24px 70px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.5);max-width:600px;width:100%;max-height:82vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.cm-page::before{content:'';position:absolute;left:0;top:0;bottom:0;width:34px;background:linear-gradient(90deg,rgba(100,70,20,.12),transparent);pointer-events:none}
.cm-page::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(200,160,55,.4),transparent);pointer-events:none}
.cm-page-inner{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cm-hdr{padding:28px 32px 16px 44px;border-bottom:1px solid rgba(155,115,42,.18);flex-shrink:0}
.cm-page-title{font-family:'Charm',cursive;font-size:28px;font-weight:700;color:#7a4010;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.13)}
.cm-page-sub{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:#7a4010;margin-top:7px;font-style:normal}
.cm-scroll{flex:1;overflow-y:auto;padding:18px 32px 22px 44px;scrollbar-width:thin;scrollbar-color:rgba(155,115,42,.3) transparent}
.cm-scroll::-webkit-scrollbar{width:4px}
.cm-scroll::-webkit-scrollbar-thumb{background:rgba(155,115,42,.3)}
.cm-text{font-family:'Lora',serif;font-size:19px;font-style:italic;color:#1a0a02;line-height:1.88}
.cm-text p{margin-bottom:.9em}
.cm-text p:last-child{margin-bottom:0}
.cm-text p.cm-sub-inline{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;font-style:normal;color:#7a4010;margin:1em 0 .25em;line-height:1.3}
.cm-foot{padding:12px 32px 16px 44px;border-top:1px solid rgba(155,115,42,.18);display:flex;justify-content:flex-end;flex-shrink:0}
.cm-btn-close{padding:8px 24px;border-radius:20px;background:rgba(155,115,42,.1);border:1px solid rgba(155,115,42,.35);color:#4a2e0a;font-family:'Charm',cursive;font-size:14px;letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase}
.cm-btn-close:hover{background:rgba(155,115,42,.22)}
.cm-x{position:absolute;top:13px;right:14px;background:none;border:none;color:#4a2e0a;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px;line-height:1;transition:background .15s;font-weight:700}
.cm-x:hover{background:rgba(155,115,42,.15)}

/* ── Footer ── */

\x20even\x20know\x20how\x20I\x20know\x20I\x27m\x20forgetting\x20it.\x0aAnother\x20thing\x20added\x20to\x20the\x20growing\x20list\x20of\x20things\x20to\x20figure\x20out\x20later,\x20alongside\x20approximately\x20seventeen\x20others\x20from\x20this\x20morning.\x0a\x0a“Caroline!\x20Are\x20you\x20alright?”\x20Matt\x20asks\x20in\x20the\x20same\x20fast\x20and\x20slightly\x20high\x20pitched\x20tone\x20he\x20used\x20before.\x20His\x20left\x20knee\x20is\x20bouncing\x20again.\x20His\x20eyes\x20widen\x20as\x20he\x20looks\x20at\x20me.\x0a\x0aOkay.\x20Okay,\x20Caroline.\x20One\x20thing\x20at\x20a\x20time.\x20You\x27re\x20here.\x20That\x27s\x20the\x20point.\x20That\x27s\x20why\x20you\x27re\x20here.\x0a\x0aMatt\x20is\x20now\x20watching\x20me\x20with\x20an\x20expression\x20I\x20recognize\x20even\x20though\x20it\x27s\x20never\x20been\x20aimed\x20at\x20me\x20before.\x20The\x20guilt\x20of\x20someone\x20who\x20has\x20decided\x20to\x20do\x20something\x20that\x20will\x20be\x20emotionally\x20hurtful\x20to\x20that\x20other\x20person\x20and\x20hates\x20how\x20relieved\x20he\x20is\x20to\x20be\x20acting\x20on\x20it.\x0a\x0aI\x20know\x20how\x20this\x20conversation\x20ends.\x0a\x0aI\x20could\x20tell\x20him.\x20I\x20could\x20lay\x20out\x20the\x20whole\x20road\x20ahead\x20of\x20him\x20—\x20every\x20terrible\x20thing\x20that\x20chips\x20away\x20at\x20him\x20—\x20and\x20then\x20the\x20other\x20side\x20of\x20it,\x20the\x20part\x20where\x20he\x20builds\x20something\x20real.\x20Maybe\x20knowing\x20would\x20help\x20him\x20brace\x20for\x20it.\x20Maybe\x20knowing\x20would\x20save\x20him\x20the\x20worst\x20of\x20it.\x0a\x0aBut\x20I\x20told\x20myself\x20that\x20about\x20Josie\x20too,\x20before\x20sending\x20my\x20memories\x20to\x20my\x20past\x20self.\x20That\x20knowing\x20would\x20help.\x0a\x0aIt\x20didn\x27t.\x0a\x0aI\x20know,\x20and\x20I\x20can\x27t\x20tell\x20him,\x20and\x20I\x20have\x20to\x20sit\x20here\x20and\x20absorb\x20his\x20guilt\x20while\x20carrying\x20grief\x20for\x20losses\x20I\x20haven\x27t\x20experienced\x20yet,\x20not\x20in\x20this\x20body,\x20not\x20in\x20this\x20timeline,\x20and\x20I\x20genuinely\x20don\x27t\x20know\x20how\x20I\x27m\x20supposed\x20to\x20hold\x20all\x20of\x20that\x20and\x20also\x20function\x20like\x20a\x20normal\x20person\x20in\x20the\x20next\x20thirty\x20seconds.\x0a\x0a\x22I\x27m\x20not\x20built\x20for\x20this\x20kind\x20of\x20life.\x22\x20His\x20voice\x20cracks\x20on\x20the\x20last\x20word.\x20He\x20means\x20it\x20kindly.\x20He\x20means\x20it\x20apologetically.\x20He\x20means\x20it\x20with\x20so\x20much\x20guilt\x20that\x20I\x20almost\x20want\x20to\x20tell\x20him\x20to\x20stop,\x20that\x20I\x27m\x20not\x20going\x20to\x20fall\x20apart\x20—\x0a\x0aI\x27m\x20not\x20going\x20to\x20fall\x20apart.\x20At\x20least\x20not\x20because\x20of\x20him.\x0a\x0a\x22I\x20understand.\x22\x0a\x0a---\x0aIt\x20comes\x20out\x20softer\x20than\x20I\x20intend,\x20carrying\x20more\x20weight\x20than\x20those\x20two\x20words\x20should\x20be\x20able\x20to\x20hold.\x20Something\x20in\x20his\x20face\x20shifts\x20—\x20he\x27d\x20been\x20bracing\x20for\x20a\x20fight\x20and\x20found\x20something\x20else,\x20and\x20the\x20relief\x20moving\x20through\x20his\x20expression\x20is\x20almost\x20worse\x20than\x20anger\x20would\x20have\x20been,\x20because\x20it\x20means\x20I\x20read\x20him\x20correctly,\x20which\x20means\x20I\x20managed\x20his\x20feelings\x20so\x20neatly\x20that\x20nobody\x20notices\x20mine\x20are\x20still\x20there\x20underneath,\x20waiting.\x0a\x0aHe\x20starts\x20to\x20say\x20something\x20—\x20Care,\x20I\x20—\x20and\x20I\x20can\x20hear\x20the\x20apology\x20forming,\x20the\x20whole\x20careful\x20Matt\x20speech\x20about\x20how\x20it\x27s\x20not\x20me,\x20it\x27s\x20the\x20situation,\x20and\x20I\x20cannot.\x20I\x20cannot\x20sit\x20here\x20and\x20receive\x20his\x20guilt\x20on\x20top\x20of\x20everything\x20else\x20I\x27m\x20already\x20carrying\x20this\x20morning.\x20My\x20eyes\x20are\x20burning\x20and\x20if\x20I\x20let\x20him\x20be\x20kind\x20to\x20me\x20right\x20now\x20I\x27m\x20going\x20to\x20cry,\x20and\x20then\x20he\x27ll\x20feel\x20worse,\x20and\x20then\x20I\x27ll\x20feel\x20worse\x20about\x20making\x20him\x20feel\x20worse,\x20and\x20he\x20will\x20think\x20it\x27s\x20because\x20of\x20him.\x20I\x20can\x27t\x20tell\x20him\x20it’s\x20not,\x20and\x20I\x20genuinely\x20do\x20not\x20have\x20the\x20bandwidth\x20for\x20that\x20particular\x20spiral\x20today.\x0a\x0aThe\x20thud\x20from\x20the\x20front\x20porch\x20lands\x20like\x20a\x20gift.\x0a\x0aMatt\x20flinches.\x20I\x27m\x20already\x20moving,\x20grateful\x20for\x20the\x20task,\x20grateful\x20for\x20something\x20my\x20body\x20knows\x20how\x20to\x20do\x20while\x20my\x20brain\x20is\x20still\x20trying\x20to\x20catch\x20up\x20with\x20the\x20fact\x20that\x20I\x20have\x20twenty-four\x20years\x20of\x20memories\x20I\x20shouldn\x27t\x20have\x20and\x20a\x20future\x20I\x20have\x20to\x20somehow\x20prevent\x20and\x20also\x20apparently\x20a\x20breakup\x20to\x20get\x20through\x20before\x20nine\x20in\x20the\x20morning.\x0a\x0aTyler.\x20Post-transformation.\x20The\x20werewolf\x20metabolism\x20runs\x20hot\x20during\x20the\x20change\x20but\x20crashes\x20after.\x0a\x0aI\x20know\x20this\x20the\x20way\x20I\x20know\x20Matt’s\x20nervous\x20tick.\x20From\x20somewhere\x20I\x20don\x27t\x20have\x20time\x20to\x20examine.\x0a\x0aI\x20don\x27t\x20examine\x20it.\x20I\x20move.\x0a\x0a\x22No,\x20Caroline!\x20Don\x27t\x20go\x20outside.\x22\x20Matt\x20scrambles\x20from\x20his\x20chair,\x20nearly\x20tripping\x20over\x20the\x20coffee\x20table\x20in\x20his\x20haste.\x20Genuine\x20panic\x20colors\x20his\x20voice,\x20and\x20I\x20can\x20see\x20him\x20imagining\x20every\x20possible\x20threat\x20waiting\x20outside\x20—\x20werewolf,\x20vampire,\x20angry\x20townsperson\x20with\x20a\x20stake\x20—\x20running\x20through\x20the\x20complete\x20list\x20of\x20things\x20that\x20want\x20us\x20dead.\x0a\x0aWhich\x20is\x20sweet.\x20Completely\x20unnecessary\x20since\x20I\x27m\x20literally\x20a\x20vampire\x20and\x20he\x27s\x20breakable\x20human\x20Matt,\x20but\x20sweet.\x0a\x0aI\x20stride\x20toward\x20the\x20door\x20despite\x20his\x20protests,\x20and\x20my\x20movements\x20feel\x20different\x20—\x20more\x20purposeful,\x20more\x20efficient,\x20like\x20my\x20body\x20remembers\x20a\x20version\x20of\x20this\x20it\x20hasn\x27t\x20lived\x20yet.\x20Each\x20step\x20across\x20Mrs.\x20Lockwood\x27s\x20Persian\x20rug\x20feels\x20both\x20familiar\x20and\x20strange,\x20like\x20walking\x20through\x20a\x20memory\x20that\x20hasn\x27t\x20finished\x20forming.\x0a\x0a\x22It\x27s\x20fine.\x22\x20I\x20tell\x20him\x20as\x20I\x20reach\x20the\x20door,\x20my\x20hand\x20on\x20the\x20brass\x20knob.\x20\x22It\x27s\x20Tyler.\x22\x0a\x0a\x22How\x20do\x20you—\x22\x20He\x20stops,\x20shakes\x20his\x20head.\x20\x22Of\x20course\x20you\x20know.\x20Super\x20hearing.\x22\x0a\x0a---\x0aRight.\x20Super\x20hearing.\x20That\x27s\x20definitely\x20why\x20I\x20know.\x20Not\x20because\x20I\x27ve\x20been\x20through\x20this\x20exact\x20morning\x20in\x20another\x20timeline.\x20Super\x20hearing\x20is\x20a\x20perfectly\x20logical\x20explanation,\x20Caroline.\x20Stop\x20overthinking.\x0a\x0aI\x20open\x20the\x20door,\x20and\x20—\x0a\x0aOh,\x20Tyler.\x0a\x0aHe\x20lies\x20curled\x20on\x20the\x20wooden\x20planks\x20like\x20a\x20fallen\x20angel,\x20skin\x20marble-pale\x20in\x20the\x20dawn\x20light\x20and\x20covered\x20in\x20goosebumps\x20from\x20the\x20morning\x20chill.\x20Leaves\x20are\x20caught\x20in\x20his\x20hair,\x20and\x20dirt\x20streaks\x20across\x20his\x20shoulders,\x20hands,\x20and\x20face.\x20There\x27s\x20a\x20fresh\x20scrape\x20on\x20his\x20ribs\x20that\x27s\x20already\x20healing,\x20dried\x20blood\x20on\x20his\x20knuckles\x20from\x20wounds\x20that\x20closed\x20themselves\x20sometime\x20in\x20the\x20night.\x0a\x0aHe\x20looks\x20so\x20young.\x20How\x20did\x20I\x20never\x20pay\x20attention\x20to\x20how\x20young\x20we\x20all\x20were?\x0a\x22Give\x20me\x20your\x20jacket.\x22\x20It\x20comes\x20out\x20more\x20commanding\x20than\x20I\x20intend,\x20but\x20there\x27s\x20no\x20time\x20for\x20polite\x20requests.\x20\x0a\x0aMatt\x27s\x20eyes\x20widen\x20as\x20he\x20cautiously\x20approaches,\x20seeing\x20Tyler\x27s\x20naked\x20figure\x20on\x20the\x20porch\x20floor.\x20For\x20a\x20second\x20he\x20just\x20stares,\x20processing,\x20and\x20I\x20can\x20practically\x20see\x20him\x20adding\x20dealing\x20with\x20naked\x20werewolf\x20transformations\x20to\x20his\x20list\x20of\x20reasons\x20this\x20life\x20is\x20too\x20much.\x20He\x20pulls\x20off\x20his\x20jacket\x20and\x20hands\x20it\x20to\x20me\x20with\x20hurried\x20movements,\x20careful\x20not\x20to\x20look\x20directly\x20at\x20Tyler.\x0a\x0a\x22Help\x20me\x20get\x20him\x20inside.\x22\x20I\x20drape\x20Matt\x27s\x20letterman\x20jacket\x20over\x20Tyler\x27s\x20shivering\x20form,\x20the\x20fabric\x20inadequate\x20but\x20better\x20than\x20nothing.\x20The\x20jacket\x20smells\x20of\x20laundry\x20detergent\x20and\x20cologne\x20—\x20achingly\x20normal\x20scents\x20that\x20remind\x20me,\x20briefly,\x20that\x20not\x20everything\x20is\x20divine\x20wars\x20and\x20time\x20travel\x20and\x20impossible\x20choices.\x0a\x0aTogether,\x20Matt\x20and\x20I\x20maneuver\x20Tyler\x20to\x20the\x20couch\x20I\x20just\x20vacated.\x20Matt\x20takes\x20his\x20shoulders,\x20I\x20take\x20his\x20legs,\x20and\x20we\x20move\x20in\x20awkward\x20synchronization\x20—\x20too\x20many\x20limbs,\x20not\x20enough\x20coordination,\x20Tyler\x27s\x20dead\x20weight\x20not\x20helping\x20anyone.\x20His\x20skin\x20is\x20fever-hot\x20against\x20mine\x20despite\x20the\x20morning\x20chill,\x20hot\x20enough\x20that\x20it\x27s\x20almost\x20uncomfortable\x20even\x20through\x20vampire\x20healing.\x0a\x0aWe\x20settle\x20him\x20into\x20the\x20cushions\x20with\x20more\x20grace\x20than\x20I\x20expected,\x20and\x20I\x20automatically\x20reach\x20for\x20his\x20wrist\x20to\x20check\x20his\x20pulse.\x20The\x20gesture\x20feels\x20natural,\x20practiced\x20—\x20two\x20fingers\x20pressed\x20to\x20the\x20inside\x20of\x20his\x20wrist,\x20counting\x20beats.\x20His\x20pulse\x20is\x20strong\x20and\x20steady,\x20though\x20faster\x20than\x20human\x20normal.\x20Elevated\x20but\x20not\x20dangerously\x20so.\x20Within\x20acceptable\x20range\x20for\x20post-transformation\x20recovery.\x0a\x0aI\x20freeze.\x0a\x0aHow\x20do\x20I\x20know\x20what\x20acceptable\x20range\x20is\x20for\x20werewolf\x20transformation\x20recovery?\x20How\x20do\x20I\x20know\x20to\x20check\x20his\x20pulse\x20like\x20I\x27m\x20some\x20kind\x20of\x20supernatural\x20medic?\x20I\x20shouldn\x27t\x20know\x20how\x20to\x20do\x20this.\x20Past\x20Caroline\x20—\x20Present\x20Caroline\x20—\x20whatever,\x20I\x20didn\x27t\x20know\x20this\x20stuff.\x20I\x20planned\x20parties\x20and\x20worried\x20about\x20my\x20hair\x20and\x20sometimes\x20remembered\x20to\x20bring\x20cookies\x20to\x20the\x20blood\x20drives,\x20I\x20didn\x27t\x20—\x0a\x0a---\x0a\x22Is\x20he\x20okay?\x22\x20Matt\x27s\x20voice\x20cuts\x20through\x20my\x20spiral,\x20worried\x20and\x20exhausted\x20in\x20equal\x20measure.\x0a\x0aTyler\x20is\x20weak\x20and\x20barely\x20conscious\x20as\x20we\x20position\x20him,\x20the\x20way\x20he\x20turns\x20toward\x20warmth,\x20the\x20way\x20his\x20hand\x20unconsciously\x20seeks\x20contact\x20—\x20and\x20then\x20his\x20eyes\x20flutter\x20open.\x20Confused,\x20frightened,\x20completely\x20disoriented.\x20Even\x20through\x20obvious\x20weakness\x20he\x20tries\x20to\x20sit\x20up,\x20because\x20that\x27s\x20Tyler.\x20Always\x20trying\x20to\x20be\x20strong\x20even\x20when\x20he\x27s\x20breaking.\x0a\x0a\x22Hey,\x20easy.\x22\x20I\x20place\x20a\x20gentle\x20hand\x20on\x20his\x20shoulder\x20before\x20he\x20can\x20manage\x20to\x20sit\x20up\x20and\x20immediately\x20fall\x20back\x20over,\x20which\x20seems\x20like\x20the\x20trajectory\x20he\x27s\x20on.\x20My\x20touch\x20seems\x20to\x20orient\x20him,\x20some\x20of\x20the\x20panic\x20leaving\x20his\x20features\x20as\x20he\x20registers\x20familiar\x20faces.\x20Safe\x20people.\x20\x22You\x27re\x20safe\x20now.\x22\x0a\x0aThe\x20relief\x20that\x20floods\x20his\x20expression\x20is\x20so\x20profound\x20it\x20physically\x20hurts\x20to\x20witness.\x0a\x22Care?\x20Matt?\x22\x20His\x20voice\x20comes\x20out\x20raw\x20and\x20unused,\x20like\x20he\x27s\x20been\x20screaming\x20for\x20hours.\x20Which\x20he\x20probably\x20has\x20been,\x20just\x20not\x20in\x20a\x20way\x20he\x27ll\x20remember.\x20But\x20even\x20through\x20his\x20own\x20confusion,\x20even\x20through\x20what\x20has\x20to\x20be\x20full-body\x20agony\x20from\x20the\x20transformation,\x20there\x27s\x20concern\x20for\x20us\x20in\x20his\x20tone.\x20Not\x20asking\x20where\x20he\x20is\x20or\x20what\x20happened\x20to\x20him\x20—\x20checking\x20if\x20we\x27re\x20okay\x20first.\x0a\x0aGod,\x20Tyler\x20Lockwood,\x20you\x20self-sacrificing\x20idiot.\x0a\x0aI\x20smooth\x20the\x20afghan\x20over\x20his\x20shoulders,\x20tucking\x20it\x20carefully\x20around\x20his\x20frame\x20because\x20I\x20need\x20something\x20to\x20do\x20with\x20my\x20hands,\x20need\x20some\x20way\x20to\x20channel\x20this\x20surge\x20of\x20protective\x20affection\x20that\x20feels\x20too\x20big\x20for\x20my\x20chest.\x20The\x20gesture\x20is\x20automatic,\x20almost\x20maternal\x20in\x20a\x20way\x20that\x20surprises\x20me.\x20When\x20did\x20I\x20become\x20the\x20person\x20who\x20tucks\x20people\x20in?\x20When\x20did\x20I\x20—\x0a\x0aRight.\x20Future.\x20Years\x20of\x20taking\x20care\x20of\x20people.\x20Years\x20of\x20being\x20the\x20one\x20who\x20survived\x20when\x20others\x20didn\x27t.\x0a\x0aNot\x20now,\x20Caroline.\x0a\x0a\x22You\x20don\x27t\x20remember?\x22\x20I\x20keep\x20my\x20voice\x20gentle,\x20even\x20though\x20part\x20of\x20me\x20is\x20already\x20cataloging\x20this.\x0a\x0aHe\x20shakes\x20his\x20head\x20slightly,\x20then\x20immediately\x20winces.\x20\x22Just...\x20fragments.\x20Turning.\x20Being\x20so\x20angry\x20I\x20couldn\x27t\x20think\x20straight.\x22\x20His\x20hand\x20finds\x20mine\x20where\x20I\x27m\x20still\x20adjusting\x20the\x20blanket,\x20grip\x20supernaturally\x20strong\x20—\x20strong\x20enough\x20that\x20it\x20would\x20hurt\x20if\x20I\x20were\x20human,\x20but\x20he\x20doesn\x27t\x20seem\x20to\x20realize\x20he\x27s\x20doing\x20it.\x20\x22Did\x20I\x20hurt\x20anyone?\x20Please\x20tell\x20me\x20I\x20didn\x27t\x20—\x22\x0a\x0aThe\x20raw\x20fear\x20in\x20that\x20question\x20nearly\x20breaks\x20me.\x20This\x20is\x20his\x20nightmare\x20—\x20the\x20thing\x20that\x20terrifies\x20him\x20more\x20than\x20the\x20pain\x20of\x20transformation,\x20more\x20than\x20being\x20a\x20monster.\x20The\x20possibility\x20that\x20he\x20hurt\x20someone\x20while\x20he\x20couldn\x27t\x20control\x20himself.\x0a\x0aAnd\x20I\x20know.\x20God,\x20I\x20know\x20exactly\x20how\x20many\x20times\x20this\x20fear\x20becomes\x20reality,\x20how\x20it\x20eats\x20away\x20at\x20him\x20until\x20he\x20can\x20barely\x20look\x20at\x20himself\x20in\x20the\x20mirror,\x20how\x20the\x20guilt\x20piles\x20up\x20like\x20stones\x20until\x20—\x0a\x0a---\x0a\x22You\x20didn\x27t\x20hurt\x20anyone.\x22\x20The\x20assurance\x20comes\x20out\x20quickly,\x20firmly,\x20with\x20the\x20absolute\x20certainty\x20of\x20someone\x20who\x20needs\x20him\x20to\x20believe\x20it.\x20\x22You\x20stayed\x20away\x20from\x20people,\x20Tyler.\x20You\x20did\x20good.\x22\x20I\x20squeeze\x20his\x20hand,\x20probably\x20harder\x20than\x20necessary,\x20but\x20he\x20doesn\x27t\x20seem\x20to\x20mind.\x20His\x20grip\x20tightens\x20in\x20response,\x20holding\x20on\x20like\x20I\x27m\x20an\x20anchor.\x0a\x0aThere\x27s\x20no\x20need\x20for\x20him\x20to\x20know\x20that\x20staying\x20away\x20from\x20people\x20actually\x20meant\x20his\x20werewolf\x20self\x20was\x20too\x20busy\x20chasing\x20Matt\x20and\x20me\x20through\x20the\x20woods\x20to\x20go\x20after\x20anyone\x20else.\x20No\x20need\x20to\x20tell\x20him\x20Matt\x20and\x20I\x20barely\x20made\x20it,\x20that\x20there\x20were\x20moments\x20where\x20I\x20thought\x20—\x0a\x0aWhat\x20he\x20doesn\x27t\x20know\x20won\x27t\x20hurt\x20him.\x20And\x20he\x27s\x20already\x20hurting\x20enough.\x0a\x0a\x22You\x27re\x20okay\x20now.\x22\x20The\x20words\x20taste\x20like\x20a\x20lie.\x20He\x27s\x20not\x20okay.\x20None\x20of\x20us\x20are\x20okay.\x20We\x27re\x20all\x20just\x20pretending\x20until\x20the\x20next\x20disaster.\x0a\x0aBut\x20his\x20hand\x20in\x20mine\x20is\x20warm\x20and\x20real\x20and\x20alive,\x20and\x20that\x27s\x20something.\x20That\x20has\x20to\x20be\x20enough.\x0a\x0aExcept\x20I\x20can\x27t\x20stay\x20here.\x20The\x20witch\x20house\x20waits.\x20The\x20boxes\x20need\x20retrieving.\x20It\x20all\x20needs\x20to\x20happen\x20now\x20—\x20right\x20now\x20—\x20before\x20anyone\x20else\x20wakes\x20up\x20and\x20starts\x20asking\x20questions\x20I\x20can\x27t\x20answer\x20without\x20sounding\x20completely\x20insane.\x20Before\x20someone\x20notices\x20that\x20Caroline\x20Forbes\x20is\x20acting\x20very\x20strange,\x20even\x20for\x20a\x20new\x20vampire.\x20Before\x20I\x20lose\x20my\x20nerve\x20and\x20convince\x20myself\x20I\x20can\x20wait\x20just\x20a\x20few\x20more\x20minutes\x20—\x0a\x0aThey\x20deserve\x20better\x20than\x20this.\x0a\x0aThey\x20do.\x20But\x20I\x20will\x20be\x20leaving\x20anyway,\x20because\x20I\x20don\x27t\x20have\x20a\x20choice.\x0a\x0a\x22I\x20have\x20to\x20go.\x22\x20It\x20comes\x20out\x20more\x20abruptly\x20than\x20intended\x20—\x20too\x20sharp,\x20too\x20urgent,\x20without\x20any\x20of\x20the\x20gentle\x20lead-in\x20I\x20should\x20have\x20used.\x20I\x20push\x20to\x20my\x20feet,\x20moving\x20too\x20fast.\x20Normal\x20Caroline\x20wouldn\x27t\x20move\x20that\x20fast.\x20But\x20I\x27m\x20already\x20at\x20the\x20door\x20because\x20if\x20I\x20stop,\x20if\x20I\x20let\x20myself\x20actually\x20think\x20about\x20this,\x20I\x20won\x27t\x20be\x20able\x20to\x20leave.\x0a\x0aEach\x20step\x20away\x20from\x20them\x20feels\x20like\x20a\x20small\x20betrayal.\x20Each\x20step\x20is\x20a\x20choice\x20to\x20prioritize\x20the\x20mission\x20over\x20the\x20people\x20right\x20in\x20front\x20of\x20me\x20who\x20need\x20comfort\x20and\x20reassurance\x20and\x20—\x0a
