<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--book-scale:1}
html{height:100%}
body{background:#0c0806;background-image:radial-gradient(ellipse at 50% 30%,#1c120a 0%,#0c0806 100%);min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;font-family:'La Belle Aurore',cursive}
.wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.book-shell{position:relative;width:622px;height:740px;filter:drop-shadow(-6px 10px 28px rgba(0,0,0,.85));transform:scale(var(--book-scale,1));transform-origin:top center;margin-bottom:calc((var(--book-scale,1) - 1) * 740px)}
#spine-wrap{position:absolute;left:0;top:0;z-index:10;filter:drop-shadow(5px 3px 8px rgba(0,0,0,.8)) drop-shadow(2px 1px 3px rgba(0,0,0,.5))}
.spine{width:65px;border-radius:4px 0 0 4px;background-size:100% 100%;background-repeat:no-repeat;background-position:top center}

.page-shell{position:absolute;left:34px;right:0;top:0;height:100%;overflow:hidden;perspective:1800px;border-radius:0 5px 5px 0}
.pv{position:absolute;inset:0;overflow:hidden;border-radius:0 5px 5px 0}
#pg{background:#f4ead0}
#inc{display:none;background:#f4ead0}
.pc{width:100%;height:100%;padding:46px 42px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.pc::-webkit-scrollbar{display:none}
.pnum{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:'Cinzel',serif;font-size:10px;color:#9b7a4a;letter-spacing:2px}
.nav{display:flex;align-items:center;gap:20px}
.nb{height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(201,168,76,.35);background:rgba(18,10,4,.8);color:#c9a84c;font-size:15px;font-family:'Charm',cursive;text-transform:uppercase;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;white-space:nowrap}
.nb:hover:not(:disabled){background:rgba(201,168,76,.18);border-color:#c9a84c}
.nb:disabled{opacity:.25;cursor:not-allowed}
.pi{font-family:'Charm',cursive;font-size:14px;color:#7a5e32;letter-spacing:2px;min-width:80px;text-align:center;text-transform:uppercase}
hr.div{border:none;border-top:1px solid rgba(139,106,58,.35);margin:14px auto;width:80%}
.eq{font-family:'Parisienne',cursive;font-size:37px;color:#2a1a0a;text-align:center;line-height:1.8;margin:16px 10px}
.eqa{font-family:'Parisienne',cursive;font-size:37px;font-weight:700;color:#8b1a1a;text-align:center;margin-top:6px}
.cn{font-family:'Playball',cursive;font-size:39px;color:#8b1a1a;text-align:center;letter-spacing:1px;margin-bottom:6px}
h2.ct{font-family:'Playball',cursive;font-size:46px;font-weight:700;color:#1a0f05;text-align:center;letter-spacing:1px;margin-bottom:18px}
.an-title{font-family:'Playball',cursive;font-size:42px;text-align:left;letter-spacing:1px;margin-bottom:6px}
.bmt{font-family:'Montez',cursive;font-size:37px;color:#120c04;line-height:1.55}
.bmt p{margin-bottom:1em}
.bmt p.beat{font-weight:700}
.bmt em,.bmt i,.bt em,.bt i{font-style:oblique 20deg!important;font-synthesis:style}
.sub,.sub2{font-family:'Cormorant Upright',serif;font-size:36px;font-weight:700;margin:1.2em 0 0.3em;display:block;line-height:1.2}
.sub{color:var(--sub-color,#8b1a1a);text-shadow:var(--sub-shadow,none)}
.sub2{color:var(--sub-color2,#cc1111);text-shadow:var(--sub-shadow2,none)}
.bmt p.sub{margin:1.2em 0 0.3em}
.bmt p.sub2{margin:1.2em 0 0.3em}
.ch{font-family:'Parisienne',cursive;font-size:30px;color:#5a0a0a;font-weight:700;margin:30px 0 64px}
.bt{font-family:'La Belle Aurore',cursive;font-size:28px;color:#120c04;line-height:1.55}
.bt p{margin-bottom:1em}
.bt p.op{font-size:34px;margin-bottom:13px}
.bt p.beat{font-weight:700}
span.beat{font-weight:700}
.toc-h{font-family:'Charm',cursive;font-size:38px;font-weight:600;color:#0d0600;text-align:left;margin-bottom:24px;text-shadow:0 1px 4px rgba(0,0,0,.65);text-transform:uppercase}
.ti{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dotted rgba(80,50,15,.45);cursor:pointer}
.ti:hover .tn,.ti:hover .tp{color:#6b0f0f!important;text-shadow:none!important}
.tn{font-family:'Cormorant Upright',serif;font-size:22px;color:#1a0a02;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tp{font-family:'Cormorant Upright',serif;font-size:15px;color:#4a2e0a;font-weight:400;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.toc-an-list{display:none;padding-left:10px}
.toc-an-list.open{display:block}
.toc-an-arrow{font-size:10px;margin-right:5px;display:inline-block}
.ats-divider-title{font-family:'Cormorant Upright',serif;font-size:56px;font-weight:700;color:#1a0f05;text-align:center;letter-spacing:2px;line-height:1.3;text-transform:uppercase}
@keyframes fout{0%{transform:perspective(1600px) rotateY(0);opacity:1}100%{transform:perspective(1600px) rotateY(88deg);opacity:0}}
@keyframes fin{0%{transform:perspective(1600px) rotateY(88deg);opacity:0}100%{transform:perspective(1600px) rotateY(0);opacity:1}}
@keyframes foutb{0%{transform:perspective(1600px) rotateY(0);opacity:1}100%{transform:perspective(1600px) rotateY(-88deg);opacity:0}}
@keyframes finb{0%{transform:perspective(1600px) rotateY(-88deg);opacity:0}100%{transform:perspective(1600px) rotateY(0);opacity:1}}
.afo{animation:fout .32s ease-in forwards;transform-origin:left center;z-index:2}
.afi{animation:fin .32s ease-out forwards;transform-origin:left center;z-index:1}
.afob{animation:foutb .32s ease-in forwards;transform-origin:left center;z-index:2}
.afib{animation:finb .32s ease-out forwards;transform-origin:left center;z-index:1}

/* Splash screen */
.splash{position:fixed;inset:0;background:#0c0806;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity 1s ease;opacity:1;pointer-events:all}
.splash.hide{opacity:0;pointer-events:none}
.splash img{width:300px;height:300px;object-fit:contain;animation:splashPulse 1.5s ease-in-out infinite alternate}
.splash-title{font-family:'Ephesis',cursive;font-size:68px;color:#e02222;letter-spacing:2px;opacity:0;animation:splashFadeIn 1s ease .4s forwards}
@keyframes splashPulse{0%{opacity:.7;transform:scale(.97)}100%{opacity:1;transform:scale(1.03)}}
@keyframes splashFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}

/* Page corner folds */
.pg-corner{position:absolute;right:0;width:38px;height:38px;cursor:pointer;z-index:20;transition:width .25s ease,height .25s ease,opacity .2s ease;filter:drop-shadow(-3px 3px 5px rgba(0,0,0,.7)) drop-shadow(-1px 1px 2px rgba(0,0,0,.45))}
.pg-corner.next{bottom:0;width:90px;height:90px;background:url('https://lh3.googleusercontent.com/d/14Q2WRlcpp4oYJ5jrTRo6cbmjXUTqGCan') bottom right/contain no-repeat}
.pg-corner.prev{top:0;width:90px;height:90px;background:url('https://lh3.googleusercontent.com/d/1-ZdV8ExUMpfWl83lp7APmcd0yaFyfleF') top right/contain no-repeat}
.pg-corner.hidden{opacity:0;pointer-events:none}
.pg-corner.dim{opacity:0.35}
.pg-corner.next:hover{width:112px;height:112px}
.pg-corner.prev:hover{width:112px;height:112px}

/* Bookmark overlay */
#bm-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);pointer-events:none;z-index:19;border-radius:0 5px 5px 0;transition:background .35s ease}
#bm-overlay.show{background:rgba(0,0,0,0.52);pointer-events:all}

/* Bookmark ribbon */
#bm-wrap{position:absolute;top:-3px;left:60px;z-index:20;filter:drop-shadow(4px 7px 5px rgba(0,0,0,.8)) drop-shadow(1px 2px 2px rgba(0,0,0,.5))}
#bm-ribbon{position:relative;width:30px;height:116px;cursor:pointer;background:transparent;clip-path:polygon(0 0,100% 0,100% 86%,50% 100%,0 86%);transition:width .4s ease,height .4s ease,clip-path .4s ease}
#bm-ribbon img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;object-position:top center;display:block;transition:opacity .4s ease}
#bm-ribbon-small{opacity:1}
#bm-ribbon-img{opacity:0}
#bm-ribbon:hover{width:36px;height:132px}

<script>
// ===== Data: injected by desktop app on export =====
var FLIPBOOK_DATA = {"gistUrl":"https://gist.githubusercontent.com/bluezahera/3091c5c7285cbb9c87c1d8575eb50a16/raw/chapters.json","images":{"cover":"https://lh3.googleusercontent.com/d/1LBNXOTxa8LY8t3_MUoFDU0JGLV4I969g","titlePage":"https://lh3.googleusercontent.com/d/1-12AT5nqjjivPpwdGZ0jpXdFl-9HS8Je","carolinePortrait":"https://lh3.googleusercontent.com/d/1nKz3xy_NwjezSeb2v-UVQWGRg1X_izsN","backCover":"https://lh3.googleusercontent.com/d/1CMY-yc-P61IJmhhe_NgLKLT29od_BMrC"},"chapters":[{"label":"Prologue","title":"Zero Hour","epigraph":"Courage is not the absence of dread. It is standing in full knowledge of what approaches and refusing to move","epauth":"Ancient Proverb","section":"Caroline Forbes (Mystic Falls, Virginia - 2034)","pov":"Caroline Forbes","body":"_Smoke._\n\nThe smell of burning stone, ozone, and something sweet with no name in anything natural coats the back of my throat. It's coming from an open window — and I'm already on my feet before Kol's warning reaches me from the floor below.\n\n**\"They are here. Everyone moves. Now.\"**\n\nThe perimeter monitor alarm screams.\n\nOkay. I'm already running an inventory. Okay. Exits. Main Foyer entrance, kitchen door, back door through the mud room, service door off the Werewolves containment area, basement to the caves. Heartbeats — twenty-four, all accounted for, all spiking.\n\n_Twenty-four. That's good. That's something. Keep going._\n\nWe have fifteen minutes. Maybe less.\n\nI race with vampire speed to the great hall, where everyone is gathering. Shoe rubber squeaks on flagstone as the rest of the school runs in from different parts of the building. The smell of garlic and basil from today's pasta dinner still hangs in the air. Dinner. It was just dinner a few hours ago. \n\n_Put that in the box._ \n\nDavina, Freya, and Hope are already chanting, pushing the boundary spells to their limit. Their magic raises the hair on my arms — electric and warm.\n\nA loud bang from the south side of the property signals the direction the attack is coming from. On one of the oak tables, a glass cup left from dinner rolls to the edge and shatters on the flagstone with a crack. More spells ignite simultaneously. The pressure spikes, sharp and immediate.\n\n---\nTwenty-four heartbeats in the room and I know all of them. I made myself learn all of them — spent weeks memorizing every single one — because I was not going to be the headmistress who couldn't tell her kids apart in the dark. _That was the right call. Focus._\n\nEmma's heartbeat runs faster as she moves toward the younger ones without being told. Which is both impressive and something I feel deeply guilty about at three in the morning, because she is twelve and she learned to do that at eight and never stopped. _Think about that later. You will think about that later and you will deal with it properly. Not now._\n\nCleo has already positioned herself at the door, gathering the children. Theo's heartbeat is spiking and dropping and spiking in that particular rhythm that means his body is making decisions before his brain catches up. Soren anxiously watches him. Nia's is wolf-fast, instincts running ahead of her brain. Luca and Soren heartbeats are bleeding into one continuous terrified rhythm. And Petra — four years old and frantic — is asking about a drawing she lost. I cannot fix that right now—\n\n\"It is face-down on the bench right behind you.\" Nia points to it, walks over, folds it, and gives it to her. \"Put it in your pocket. We need to leave.\" She grabs Petra's hand.\n\n_Okay. Good. Nia handled it. One thing is handled._\n\n**\"Caves. Now.\"** My voice comes out loud and demanding. Good. That's right. Keep that tone. \"Children first. Cleo takes point.\"\n\nCleo's already running, boots loud and fast on the flagstone, hair flying, grimoire tucked under her arm before I finished calling her name. _That's why I assigned her to lead the children out. That's exactly why. The basement door slams open under her hands and the cold cave smell comes up from below — limestone and groundwater and mineral dark — and something in my chest unknots by a few degrees.\n\n_The path is clear. One thing is working. I will absolutely take it._\n\n\"Witches first, protect the front, werewolves after, stay together!\" Freya cuts through the noise from the center of the room, both hands already raised, copper-metallic magic sharp and immediate in the air. Her pendant swings with the movement, catching the light from the fixture above her. _Good. Freya has the containment. That is one less thing on the list. One less thing to worry about._\n\n\"Marcus, Diana, Rachel — rear guard, no one gets left.\" Marcel's voice carries from the south window, one hand flat against the glass panel, feeling the ward pressure through it. That’s the tone he drops into when he's commanding — the one that makes every person in a room straighten without meaning to. Myself included, which I notice and note under things to be embarrassed about later when everyone is alive.\n\n---\nI know what's on his mind. Because it's the same thing that's been running alongside every inventory item in my mental list since the alarm went off. It’s the thought I keep pushing to the back of the queue because if I let it move forward I stop functioning.\n\n_Box. It goes in the box._\n\nEmma has Soren's wrist and she is running, pulling him hard, Soren is grabbing Luca without looking back. Theo pushes Nia — go, go — Nia is still holding Petra's hand, Theo right behind her. Sarah is already running, grimoire under her arm, escorting the children inside the basement.\n\nDavina is spinning toward the south wall, the lit candles on the edge of the wall flare up as she walks past, wax running fast and hot down the sides onto the flagstone, their flames bending sideways in her wake. Her hands are raised, a tracking spell is half-built between her fingers, voice low and rapid in the specific cadence of a working spell.\n\nKol moves — and then he is already there, between one breath and the next, Original-fast, his hand is flat against the south wall, feeling what's coming through the wall.\n\nTheir eyes meet across the room.\n\nNeither of them likes what they're reading. _Don't look at that. Don't think about what that means right now. Box._\n\nBonnie is at the basement door. The warm green-bright electric smell of Bennett magic is charging at her fingertips. She is counting the children as they stream past her. Of course she is. That's Bonnie. That's always my best friend. The tightness in my chest moves in two directions simultaneously.\n\nNikolaus runs toward Freya. In the wrong direction of the basement door.\n\nHe pulls on her hand. \"Mom. Come on. The others are leaving.\" \n\nA tear escapes her. She wipes it away fast. \"Go with Cleo and Maya. I will be right behind you. If anyone attacks you, use your magic to help them protect the other children. I love you, honey,” she tells him in a low tone, bending down to hug him. \n\n\"I don't want to go without you.\"\n\nFreya straightens up and looks at Maya. \"Keep him safe.\"\n\n\"I will.\" Maya moves toward them.\n\nHope crosses the room, pulls Nikolaus into a brief hug, and kisses the top of his forehead. \"Come on, little guy. The others are waiting.\"\n\n---\nMaya picks him up and carries him to the basement entrance where Marcus, Diana, and Rachel stand sentinel. \"Go.\" Marcus steps aside. The three of them cross through the door behind Maya.\n\nThirteen heartbeats are dropping into the cave system. Cleo's voice is getting fainter through the stone walls — \"single file, hand on the wall, keep moving\" — and I count them the way I breathe.\n\n**Emma. Theo. Petra. Nia. Soren. Luca. Nikolaus.**\n\n_Good. Keep going. Keep moving._\n\nEleven of us now. The room feels enormous with the children and six adults gone. Plaster dust is still settling on the oak tables and Petra's empty bench. The floor is vibrating low and steady through my boots, my jaw, and in the base of my skull.\n\nAnother loud bang. The boundary barriers are still holding. We have time. We still have time. Probably ten minutes. Maybe less. That's time. That counts.\n\nRebekah blurs across the room — Original speed — toward Marcel at the window. She reaches him, reads his expression. Then, she cups his face with her right hand and turns his head to her, away from the window.\n\n\"We need to leave.\" Her voice drops low, cracking on the last word. She already knows his answer. I read it in her expression.\n\nMarcel stays silent. Not moving. His gaze is fixed on Rebekah's face. His jaw is locked so hard I can see the veins in his neck bulging. And there it is — the thing I have been running calculations around since the alarm went off, keeping it at the back of the queue because putting it at the front means accepting it. We need more time for the children to clear the caves safely. Some of us have to stay behind to buy those precious minutes. Marcel has already decided he's one of them.\n\nHis decision was made the moment the alarm was triggered. I know it because his contemplative expression hasn't changed since the attack started. Put that in the box.\n\nValerie shifts at my right shoulder — barely, just her weight redistributing. Her heartbeat is dropping into that specific rhythm that means she's already made a decision and moved past it and into logistics — and I don't need to look at her. I already know.\n\nThe two of us exchange a brief glance. Yes. I know. I know.\n\nMarcel can't hold the gods alone. He needs backup. Freya is preparing to hold the boundary spells as long as she can, which means she is planning to stay. Hope and the rest of us won’t let Nikolaus lose his mother tonight. That is not happening. _That is not an option. That goes on the list of things that are simply not options._\n\n---\nJosie is at the hearth, arms wrapped around herself, watching Hope with sad eyes. She's already worked it out — Freya staying, Hope intending to replace her aunt and stay in her place. _Add that to the list of things happening that I cannot stop right now._\n\n\"I'm not going.\" Marcel turns from the window to face Rebekah fully. His tone is flat and final.\n\nSomething moves across Rebekah's face. Not surprise. She already knew. The grief of having it said out loud is a different thing entirely from knowing it was coming, and I feel that specific distinction land in my stomach like a heavy stone.\n\n_Box. Right now. Box._\n\n\"We are. Because I'm not leaving without you, and we still have time to make it out.\" Her jaw is set. Every line of her body is immovable.\n\nOh God. I can already see the shape of where this goes — Marcel won't let her stay, Rebekah won't leave without him, and we have maybe eight minutes left on the wards and zero time for the confrontation that's about to happen. Think. Is there an intervention here? Is there a way to — no. _No, there isn't. There is no version of this where I step between Marcel Gerard and his wife right now. Note that. Move on._\n\nDavina is already crossing the room toward them, her footsteps quick and purposeful on the flagstone.\n\n\"We need to buy time for the children.\" Marcel's voice is measured. Decided. His shoulders are squared, every line of him is already somewhere past the argument. \"After Hope, I'm the strongest vampire here. So I'm staying.\"\n\n\"No.\" Rebekah's grip tightens on his arm. \"Marcel. No.\"\n\n\"Bex.\"\n\nJust that. Just his name for her, in the tone he only ever uses for her alone.\n\nShe stops.\n\nI have seen Rebekah Mikaelson not stop for a great many things. I have seen her not stop for gods, for her own family when her own family was wrong. I have never in all the time I have known her seen her stop for a single word.\n\n_I don't have anywhere to put that. That goes in the box with everything else and I will deal with it later and I am absolutely going to deal with it later._\n\n---\nMarcel cups her face in both hands. Her heartbeat under his palms — is elevated, terrified, unmistakably Rebekah's, the one I could pick out of any room on the planet. He looks at her for one long, unbearable second.\n\nThen he moves. Fast. Certain. Gentle in the way that costs everything.\n\n**Crack.**\n\nHer heartbeat stops.\n\nThere and then not there. Something tightens in my chest so hard it takes actual effort to keep my face from doing anything. _I cannot... I cannot feel it right now—_\n\nHe presses his mouth to her forehead and stays there, holding her against him, and the room doesn't breathe.\n\nEight minutes become seven. The floor is still vibrating, plaster dust still settling on the oak tables completely indifferent to everything happening in this room. The universe has always had terrible timing. There is nothing to be done about that right now.\n\n_Keep moving. Keep counting. Keep moving._\n\nKol is at his side in nothing flat — three seconds, silent — his hand on Marcel's shoulder, and something passes between them that doesn't need words.\n\nMarcel lifts his head. \"When she wakes up. Tell her I love her. Tell her to keep going.\" His voice holds. His eyes are still fixed on her face, like he's trying to memorize every detail of it. I am counting every second of it. \"Tell her... tell her, I said always.\"\n\nKol takes his sister from Marcel's arms with deliberate care. He adjusts his hold, tucks her against his chest with the particular gentleness of someone who has done this before... and pauses.\n\nHe looks at Marcel for one moment. Something moves across his face that doesn't usually live there.\n\n\"We have not always agreed, you and I.\" His voice is low. Even. \"But you have loved her well. You put her safety above everything else.\" A beat. \"That makes you Mikaelson enough for me.\"\n\nMarcel holds his gaze. He nods once.\n\nKol turns toward the basement door without another word, because Kol has always understood that some things don't need to be spoken to be completely heard.\n\nA thousand years of practice. I am not examining what that makes me feel right now. That is a box inside a box.\n\n---\nMarcel turns to Davina. Pulls her into a hug without a word, and she goes into it completely — arms tightening around him, face pressing into his shoulder — and her heartbeat breaks in that very specific pattern. Controlled inhale, losing the exhale, trying again. I hear every hitch. I count them the way I count everything, because counting is the only thing I have right now.\n\n\n\"Having you as my daughter has been a blessing. You and Rebekah are the most important people in my world.\"\n\nHer arms tighten. When she finally speaks, her voice is barely above a whisper, held together by sheer force of will. \"You gave me a home and a family when I had neither. Even if not by blood, you are my dad — you have been my dad from the moment you rescued me from being sacrificed by my coven and my parents.\" A breath. \"Don't you dare make this goodbye.\"\n\nKol stops at the basement door, Rebekah in his arms, and waits. Davina pulls back, wipes her eyes with the back of her hand, turns toward him—\n\n— and stops.\n\nHer gaze finds Josie.\n\nMy daughter is standing at the hearth with wide, watery eyes, watching Davina with an expression I know the way I know her heartbeat — have known it since she was born — and something in my chest does something I don't have a name for right now and don't have time to find one.\n\nDavina goes still for a moment. Then turns to face her fully.\n\n\"We need to move. And I'm not leaving you. I'm not about to lose you too.\" Still wiping the tears spilling freely down her face as she says it, looking directly at Josie.\n\n_Good. That's good. Davina has her. Keep moving._\n\n\"Go.\" Josie's smile is watery and doesn't reach her eyes by a mile. I know that smile. I have worn that smile. It is the smile of someone who has already made a decision and is trying to make it easier for everyone else to accept it. \n\n_Oh God. Josie, no. No, no, no—_\n \n\"I'll wait for Lizzie, mom, Hope, and aunt Bonnie. We'll catch up.\"\n\n\"You don't need to.\" Lizzie has flashed to her twin sister’s side. Her voice is low and tight. Her eyes move once back and forth between Hope and Josie, already cataloguing every worried glance Josie has been sending in their best friend’s direction. She has clocked all of it. Of course she has. These two have been reading each other since before they could talk. \"We are leaving. Now.\" Her hand finds Josie's, her jaw set.\n\n---\n_Thank you, Lizzie. Thank you._\n\n\"Cleo has seven children with her.\" Bonnie's voice carries from the doorway, flat and certain. \"They need your magic down there, Josie.” She already noticed Josie's resistance to leave.\n\n\"Davina and I aren't moving without you, Josie.\" Kol, from the doorway. Steady. Immovable. Arms still full with Rebekah's unconscious body, eyes fixed on Josie with the intensity of someone who means every syllable.\n\nLizzie's gaze moves across the three of them — Kol in the doorway, Davina frozen mid-step, Josie at the hearth wearing a smile that isn't fooling a single person in this room — and something shifts in her expression. \n\n\"I am genuinely moved by the three of you. The silent suffering, the longing eyes, the absolute commitment to dying for each other — it's very romantic, it really is.\" The light fixture above her flickers as the outer wall shudders, plaster dust drifting from the ceiling. \"We need to get our asses out of here ASAP.\"\n\nThat's my daughter. The thought arrives before I can stop it and I let it stay because I need it.\n\n\"Sort out your love triangle later.\" Marcel’s dry response carries from across the room. \"Preferably when Kol isn't holding my unconscious wife.\"\n\nDavina lets out something between a laugh and a sob — real, involuntary — and walks toward the basement door to stand next to her husband. Waiting with him for Josie.\n\n_Okay. Okay, that's movement. That's the right direction. Two steps forward—_\n\nLizzie flashes to Hope's side.\n\nShe looks at her — the set jaw, the particular brightness in Hope's eyes that I have learned to recognize over years of watching her — and I see the exact moment Lizzie understands what that expression means.\n\n\"No.\" Her hand finds Hope's arm. \"You are not staying.\"\n\nHope's heartbeat is steady. The steadiness of someone who made this decision and has come to terms with it. \n\nI knew it. I knew it the second I saw Hope hug Nikolaus after she watched Freya say goodbye to him, and I saw her face. I noted it under things I was not ready to look at directly—\n\n---\n\"They want me. I'm the one who killed their king. They have been looking for me, razed three continents and most supernaturals on the planet for revenge. If I stay—\"\n\n\"You die.\" Josie's voice fractures on the last word. The fire at the hearth flares — a brief, involuntary spike of heat answering her.\n\n\"The children die if I go.\" There is no apology or softness in her tone. The truth is set down and left there, clean and immovable. \"The caves buy them at most twenty minutes without a diversion. With someone the gods actually want—\"\n\nShe's right. The thought lands in my chest like something cold and heavy. She is completely right. I hate it with every single cell in my body and she is right.\n\n\"Lizzie.\" Hope turns to her and the flatness comes off her voice — there is something warmer underneath, something that is just the two of them. \"You and I are each other's partners for the soul possession spell. If both of us stay, and we both die, our souls won't get transferred. We will just be gone.\"\n\nJosie makes a sound. Small. Involuntary. Fractured. The hearth fire jumps for one second, coal embers responding before she can pull it back.\n\nHer heartbeat. My daughter's heartbeat, is doing something I feel in my own chest like a physical impact—\n\n_Box. Right now. If you feel that, you stop moving. You cannot stop moving. Box._\n\nLizzie's heartbeat stumbles — grief hitting it in a wave the rhythm can't hold. Her hand finds Hope's arm. \"You sacrifice yourself and your soul transfers into me when you die? That's your whole plan? Hope—\"\n\n\"Today and tomorrow. Always.\" Hope’s voice is quiet but certain.\n\nThe words stop Lizzie mid-sentence the way that vow always has, the way it always will. That is what those words do between them. I have known that since the night I first heard them say it to each other.\n\n_Right now I am more grateful for them than I have ever been for anything._\n\nThe silence after them is very loud.\n\n---\n\"Always.\" Hope, steady. \"Which means you leave. You stay alive. That is the only way I can come back from this.\"\n\nLizzie's grip on Hope's arm doesn't loosen.\n\nHer heartbeat is doing three things at once — fury and grief and love, all of them occupying the exact same space simultaneously, none of them willing to yield to the others. Which is Lizzie. Which has always been my daughter, every single day of her life, feeling everything at maximum volume all at once, and I love her so much for it and right now it is the thing standing between Hope's plan and the only exit.\n\nShe is not letting go.\n\nKali. We need Josie’s dark alter ego. \n\n_I don't let myself feel what I'm about to do. There isn't time and there isn't space and I will feel it later when I have somewhere to put it._\n\n\"Josie.\" My eyes find her across the room. _I'm sorry, sweetheart. I'm so sorry._ \"We need dark magic on that cave route. Kali's power is our most effective weapon against the gods. She needs to be in the caves protecting the children.\" Every word is exactly what it is and nothing more.\n\n\"I am not—\"\n\nThe shift happens mid-word.\n\nJosie's heartbeat levels — ragged grief draining into something colder and slower all at once, the restlessness leaving her body like a tide going out, the magic at the hearth moving from orange flames to steady cold blue. Dark be proud of you, Hope darling.\" Kol's voice carries across the room, low and certain, as Kali reaches them. \"You are the best of us. Give them Hell.\"\n\n\"Protect our family.\" Hope's voice holds steady. \"I love all of you. Always and Forever.\"\n\nAlways and Forever. The Mikaelson words, in this room, right now. _Do not feel that. You can feel it later. Box._\n\nFreya turns to Hope.\n\n\"I need to stay.\" Steady voice. Unsteady heartbeat — I can hear the difference, the effort it's costing her to hold the first while the second gives her away. \"The boundary spell — the moment I stop channeling my magic into it, it collapses. I'm the only one holding it.\"\n\nHope's jaw sets. \"I'll hold it.\"\n\n\"Hope—\"\n\n---\n\"Nikolaus needs his mother.\" Her tone is certain. It’s the voice of someone who has already closed every other door in the room and is standing in front of this one. \"I won't have my cousin grow up an orphan. Not like me.\"\n\nSomething moves across Freya's face — grief and recognition and something else. She looks at her niece for a long moment. Then she pulls her into a hug — both arms tight, her cheek pressing against Hope's hair — and the room stays quiet around it.\n\nWhen she pulls back her eyes are wet. \"You are everything Klaus always hoped you would be.\" A breath. \"He would be so proud of you.\"\n\nKlaus’s name. In this room, right now, and I am — I am absolutely not doing that right now. That goes so far into the box I will need an excavation team.\n\nFreya turns to look at her brother at the basement door. \"I'm staying to help Hope hold the barrier as long as I can. I'll come out behind you.\"\n\nKol holds his sister's gaze for one second. Something passes between them — a whole conversation in the space of a look, years of knowing each other compressed into a single exchange. He nods to her. \n\nI look at the crack in the plaster above the east window. Six inches. Seven. Spreading slowly and steadily toward the vault ceiling, completely indifferent to every single thing happening in this room. Incredible. Genuinely incredible, the indifference of architecture. \n\n\"I'm staying.\"\n\nBonnie.\n\nHer voice comes from beside the basement door, her jaw is set in a way that means the decision is already made and she is now simply waiting for the rest of the room to catch up. I know the stubbornness in her jaw. I know that rhythm in her heartbeat. I have known both of them for over two decades. She will stand on this exact spot until this building comes down around her if that is what it takes.\n\n_Bonnie. No. No, no, no-_\n\n\"You have sacrificed and died enough times for all of us.\" I flash to her side. Keep my voice even. Keep it even, Caroline. Even and certain. \"Today that's not happening.\"\n\n\"Caroline.\" Her eyes find mine, direct and steady. \"You aren't staying either.\"\n\n_Okay. Okay, I can work with this. I just need to get her through that door. One task. One very specific task._\n\n---\n“I'll wait for Freya and come out behind you.” The lie comes out clean and steady. I feel it leave my mouth. I feel what it costs, noting it under things I will have to live with. “I promise.”\n\nShe reads my face. She takes her time doing it, which is how I know she already suspects. \n\n\"You and Freya. Both of you.\" It’s not an agreement. It’s a condition with teeth.\n\n\"Both of us.\"\n\nOne more second. Her eyes are holding mine. And then... they widen.\n\n\"You are planning to stay.\"\n\n_Oh God._\n\nTwenty-nine years of friendship, and she reads me like I'm printed text. She is the person on this planet who knows me best and I looked her in the face and lied and she saw through it in under ten seconds which is honestly — I don't even have the bandwidth to be embarrassed about how badly I underestimated her, I just feel it landing in my chest on top of everything else already in the box—\n\nBonnie's magic builds fast. Warm green-bright earth-smell of Bennett power crawling up my forearms, alive and enormous and absolutely certain of itself — the hearth fire flares hard in response. She is going to make me leave by force if she has to.\n\nPart of me — not a small part — loves her completely and entirely for it.\n\nBut she can't. She can't, and I need her to not, and I hate that I need her to not, and that combination of things is sitting in my chest doing something I cannot name and cannot afford to feel right now.\n\nI look at Valerie.\n\nIn twenty-nine years Bonnie has never once decided for me. Not when she disagreed. Not when she was right. I'm about to do that to her anyway — because she loves me too much to leave me behind, and I love her too much to let her stay.\n\nOne small gesture with my head in Bonnie's direction.\n\nValerie moves — vampire speed, hands coming up—\n\nBonnie catches it the instant it starts. Her magic pivots mid-build — the warm electric charge of it spiking sharp and hot, the earth-smell turning acrid — and it hits Valerie with a force that takes her completely off her feet and throws her into the far wall. The impact is a loud, bone-cracking sound that reverberates off the vault ceiling.\n\n---\nValerie — I clock the hit, clock that she's already moving, already getting up—\n\nLizzie is already moving, ruby-red syphon magic crackling at her fingers, a blur of motion at my left—\n\nHope moves faster.\n\n**Crack.**\n\nLizzie's neck breaking echoes through the room.\n\nOne moment there — elevated, furious, alive, Lizzie, the heartbeat I learned the night she was born and have tracked through every single good and terrible and mundane and extraordinary thing in the twenty years since — and then not there.\n\nIt presses against the inside of my ribs with actual physical force and I cannot — I genuinely cannot — I cannot feel that right now, I cannot, if I feel that I stop, and I cannot stop—\n\n_Box. It goes in the box. It goes in the box right now and you will get it back later and she is going to wake up furious at you and that is something to look forward to, that is a reason, hold onto that—_\n\nHope sets Lizzie down on the flagstone with one hand under her head. Carefully. Deliberately. The care of someone who knows exactly what they just did and is carrying it.\n\nKali's breath hitches — audible, brief, surprised, and then releases on a long exhale. She was caught off guard by Bonnie's speed and force. Now she's recalculating. Her eyes find Hope and they start chanting, their voices threading together — Hope's low and intent, Kali's sharp and fast, the copper-metallic smell of Kali's magic is spiking so hard it's sitting on the back of my tongue.\n\nBonnie fights.\n\nHer magic surges so much the light fixture nearest her explodes — glass raining from the ceiling, the explosion's smoke scorches a black streak across the ceiling vault, the room becoming half-dark. The window cracks straight down its center with a sound like a gunshot, every pane splitting in one clean vertical line, cold air rushing through the cracks. She fights with everything she has — warm and alive and rooted and enormous, the full weight of a whole bloodline of Bennett witches at complete extension.\n\nShe is holding her own against Hope's and Kali's combined power, every surge pushing back against both of them — and I am letting her. _I am standing here letting her fight for me, and I am going to have to live with that, and I cannot think about it right now, and I am going to think about it for the rest of my life._\n\nI know, Bonnie. I know. I'm so sorry.\n\n---\nAnd then she isn’t fighting anymore.\n\nThe magic drops. She drops. Kali catches her with both hands, lowering her carefully to the flagstone — and the room goes quiet.\n\nBonnie.\n\n_I'm sorry. I'm so sorry. I'm so sorry._\n\nThree in one night. Three people I love — two heartbeats I have spent years learning to recognize, memorizing then until I could pick them out of any room in any building in any amount of chaos, going silent in the same space within ten minutes of each other. One unconscious best friend on the flagstone.\n\n_You are going to need a very long time and a very large box and possibly a second box and you will deal with all of it later. Later. Not now._\n\nValerie is already walking back toward us with graceful ease, like being thrown into a cement wall by a Bennett witch is a minor scheduling inconvenience.\n\n\"That could have gone worse.\" She observes, looking between Bonnie and Lizzie on the floor.\n\n\"It could have gone better.\" Kol remarks dryly from the doorway. \"Now we will have to carry them out. Someone is going to have to vampire-speed them through the caves, and I've got my hands full.\" He gestures down with his head toward his sister.\n\n\"Caroline can take Bonnie.\" Hope says steadily. The exact same steadiness as before. There is not a flicker of deviation or a single crack in her voice. \"Get her to the caves. I'll take Lizzie to one of the other vampires and they'll carry her the rest of the way.\"\n\n_Oh._\n\nOh, she thinks — she genuinely thinks that if she hands me a task I'll —\nShe is not wrong that I respond to tasks. She has known me long enough to know that giving me something to do is the fastest way to get me moving. She is not wrong about any of that.\n\nShe is wrong about this one.\n\n\"I'm staying.\"\n\nHope goes still.\n\nThe room goes still with her, actually — Marcel at the window, Valerie at my left, Kol, Davina, and Kali in the doorway, Freya in the center of the room — everyone landing in the same beat of quiet at the same moment.\n\n---\n\"I'm the headmistress of this school.\" The words come out even and certain, and I am genuinely slightly surprised by how even and certain they are, but there it is. Not a speech. Not a performance. Just the truth, stated plainly, because it is the truth. \"The safety of everyone in this building is my responsibility. Not yours. Not Marcel's. Mine. That is not something I hand off and walk away from.\" A pause. \"I'm staying.\"\n\nThe silence that follows is not the arguing kind. It's the kind that means something has been said that everyone in the room already knew was coming and was waiting to hear out loud.\n\nKali looks down at Lizzie on the flagstone. Then at Bonnie. Something moves across her face — brief, controlled, gone before it fully arrives — and for one second she is not the cold entity who arrived mid-word in Josie's body. For one second she is someone more complicated than that.\n\n\"Josie will be devastated.\" A pause. \"At least Lizzie will be with her for the fallout.\"\nOh.\n\nThat is — somehow — the most genuinely comforting thing anyone has said in the last fifteen minutes and I am choosing to hold onto it with both hands.\n\nKol looks at me for a long moment. Something in his expression I don't have a word for — something quiet and certain and very, very old.\n\n\"You have always been the bravest of the lot of us.\" He says it simply. Like a fact. Like weather. \"Nik would agree.\"\n\nKlaus. I feel his name land somewhere underneath my ribs and I let it. Just for one second. _Okay. I am putting that so far into the box it will need an archaeological dig to retrieve it. Not now. Absolutely not now._\n\nFreya is looking at me the way she looks at her siblings when she has something to say and not enough time to say it correctly.\n\n\"You made my son feel safe.\" The words come out low and steady. \"Every day this school has been open. He knew the exits. He knew the drills. He knew where to run — because you prepared him. Trust doesn’t come easily for any member of my family. We regard very few people as friends, but are a friend to us.\" A breath. Her jaw is tight. \"Thank you. For keeping my son safe. For keeping all of the children safe.\" Her eyes hold mine. \"Come back to us.\"\n\nI nod once. My throat is doing something I don't trust right now.\n\n---\nValerie steps forward. \"You all could use another backup. I'm staying too.\" Her heartbeat is level in the way that means she's already on the other side of the decision.\n \nThere is a beat of silence as everyone left in the room processes her decision. \n\nKol’s gaze moves to Valerie. One beat of quiet between them. \"You do not have to stay.\" It isn't an accusation. It's something closer to recognition.\n\n\"No,\" Valerie agrees. \"I don't.\"\n\nKol nods once. That appears to settle something for him.\n\nMarcel nods once.\n\n\"I don't know you as well as I should.\" Freya says to Valerie. Her voice is direct. There is no ceremony in it. \"But you are standing in this room when you don't have to be. That matters.\" Something moves across her face — quick, controlled. \"Come home.\"\n\nHope looks at Valerie. Something warm moves through her expression — brief but real. \"You've had our backs since before tonight. Thank you for that.\"\n\nValerie receives both of them with a small nod. Not dismissing them, not performing gratitude. That's entirely Valerie.\n\nDavina crosses to me and puts both hands on my face — the gesture she uses when she means every single syllable of what she's about to say, when she needs me to receive it properly and not deflect it into a task list. Her eyes are wet.\n\n\"You come back.\" Her voice is steady by sheer effort. \"You hear me? You find a way back to us.\"\n\nI nod once because my voice is doing something unreliable and I know it.\n\nShe turns to Valerie. Her eyes are still wet. \"Both of you.\"\n\n\"We intend to.\" Valerie receives it with a small nod.\n\n\"That's why you tried to lie to Bonnie.\" Freya states quietly from the center of the room. It’s not an accusation, just a woman who has spent the last decade watching people she loves decide to sacrifice themselves and has learned to recognize every version of how it starts. \"You told her you were waiting for me. Because you knew Lizzie, Josie, and Bonnie wouldn't accept it.\"\n\n\"They would have stayed.\" It’s the whole truth in four words. \"I couldn't let them.\"\n\n---\n\"That,\" Hope says, \"is the understatement of the century.\" A brief smirk appears on her face. \"When Lizzie wakes up and finds out you and I both stayed to fight the gods—\"\n\n\"She is going to be spectacularly furious.\" I can already hear it. The particular tone of Lizzie anger — sharp and hot and thorough, not a single detail left unexamined, not a single grievance left unvoiced, going through every choice we made tonight in precise sequential order and finding fault with all of them. \"She'll probably be angry at both of us for at least a week. Possibly two.\" A pause. \"It will be completely worth it.\"\n\n\"Completely worth it,\" Hope agrees.\n\nHold onto that. That is a thing that exists in the future. Lizzie will be furious at both of us. That is something to come back for.\n\nFreya turns to Marcel. Something in her expression is different from the diplomat she's been all night — quieter than that, more direct.\n\n\"You gave my sister a home when our family couldn't.\" Her voice holds. Barely. \"Come back to her.\"\n\nMarcel looks at her for a long moment. \"Take care of her.\"\n\n\"Always.”\n\nI look at Kali.\n\n\"Protect Lizzie.\" My voice holds. Barely. I feel exactly where it almost doesn't and I pull it back. \"And when Josie and Bonnie wake up — and when Lizzie wakes up furious at me — tell them I love them. All three of them. Tell them I said today and tomorrow. Always.\"\n\nKali holds my gaze for a moment. \"They already know.\" A pause. \"But I will tell them anyway. They will forget being angry at you the moment you come back alive.\" Her voice is flat. A statement of fact, delivered the way she delivers everything — without excess, without softness. \"So make sure they get to that moment.\"\n\nThat is the most words Kali has ever said to me that weren't a tactical assessment. I choose not to examine what that means.\n\nThank you. The words don't make it out but she receives them anyway. I can tell.\n\n\"Hope.\" Marcel. Efficient. The command tone that makes rooms straighten. \"Take Lizzie and Bonnie. Flash them into the caves, give them to Rachel and Diana. After Kol, Marcus is the strongest vampire in their group — his hands need to be free in case the gods breach the cave system. Come straight back.\"\n\n---\nHope doesn't argue. She crouches, gathers Lizzie into her arms with the same careful deliberateness as before — one hand under her head — and she is gone. A blur through the basement door.\n\nThirty seconds.\n\nI count them the way I breathe. One. Two. Three. Keep going. Keep counting.\n\nThe door opens.\n\nHope, and Rachel behind her — tall and jaw-set, taking in the room in one complete sweep. Her gaze moves across all of us. Across the cracked plaster, the extinguished candles, the plaster powder dusting the floor and the oak tables, and Freya standing steady in the center of all of it like the room is trying to come down around her and she has simply decided it isn't.\n\nSomething moves across Rachel's face. It’s not fear or hesitation. It’s something that looks almost like satisfaction — like she has been waiting for the version of this night where it comes down to a handful of people in a room and she is one of them.\n\n\"Make it hurt.\" She looks at each of us for one beat.\n\nThen she walks to Bonnie, bends, scoops her up in both arms — bridal style with no ceremony or  hesitation — and she is through the door before any of us can say a word back to her. It swings shut behind her.\n\nThe room is quieter without Bonnie in it. I feel the shape of that absence and I note it directly into the box before it can do anything to me.\n\n\"The necklace.\" Kol's gaze finds me from the doorway — then cuts to Davina. \"Take it from Rebekah. Give it to Caroline. It will help her fight.\"\n\nDavina's hands are already moving — careful, working the clasp at the back of Rebekah's neck with deliberate fingers. The necklace comes free. She crosses the room and presses it into my palm.\n\n\"Make it count.\" She says to me low and steady.\n\nI hold it for a moment. Warm metal, Hephaestus-forged — made specifically to let its wearer stand against gods, which is either very reassuring or the most terrifying object I have ever held and right now it is somehow both simultaneously. I close my fingers around it and nod to her.\n\nOkay. Okay. That's something. That's a real, concrete thing I can hold in my hand. We have this. We have each other. We have — we have five minutes, maybe less, and we have this necklace and that is what we have, and it is enough, it has to be enough—\n\n---\nAnother loud bang. Closer than the last. The oak tables shake, more plaster dust falling from the vault ceiling in a slow, steady drift.\n\nThe gods have reached the boundary barriers' middle layers. Less than five minutes. Probably less than four. Stop counting down and start counting up. What do we have? What do we do with what we have?\n\nKol carries Rebekah through the basement door. Davina follows. Kali pauses at the threshold. Her head turns — just enough, not fully.\n\nHer eyes find Valerie for one beat. \"You chose to stand with them.\" A pause. \"Don't let it be for nothing.\"\n\nThen she crosses through, and she is gone.\n\nThe candles along the wall gutter out one by one as they go, as if the room is choosing to go dark without them in it. The hot wax smell sharpens for one second and then it’s just smoke. The door swings shut.\n\nTheir heartbeats drop into the caves below and I count them — one, two, three, four — the way I have counted every heartbeat in this building since the night I became its headmistress. The way I will count them until I can't anymore.\n\nFive of us now.\n\nMarcel is still standing at the south window. Valerie is at my left. Hope is beside Freya at the center of the room, channeling power into the last standing boundary barrier, the shape of Lizzie's and Bonnie’s absence are doing something to the air in this room that I am not going to name right now.\n\nThe garlic and basil smell still lingers in the air. Plaster dust is still settling on Petra's empty bench.\n\nTwenty-four heartbeats. That's where we started. Now count the ones in the caves. Nineteen heartbeats getting fainter with distance. Keep counting. Keep them with you.\nValerie moves to my side.\n\n\"Are you certain you want to stay?\"\n\n\"I'm staying.\" The words come out steady and unmoving and I mean all of them. And then, because she has earned more than that — \"We have been through a great deal together since this war with the gods started.\" The words come out slower than usual. Without the self-interruption. Without the pivot into something easier to say. \"You have never once — not once — let me face any of it alone.\" A breath. \"Thank you. For always being there.\"\n\n---\n\"That's what friends do.\" She holds my gaze as she says it. Then she offers me a small, brief smile, and she steps back.\n\nThat is Valerie. Completely and entirely Valerie. All of it is said and received in under thirty seconds with no excess and no waste, and I love her for it, and that goes in the box with everything else because I cannot hold it right now without it undoing something.\n\nI put the necklace on.\n\nThe clasp catches on the first try, which feels like the universe offering me exactly one small mercy, and I'll take it.\n\nWe wait.\n\nThe room breathes around us. The crack in the east window plaster — has grown to eight inches now, maybe nine, still spreading, still completely indifferent. The cold air coming through the fractured south window. The smell of smoke and ozone and that sweet unnatural thing underneath both of them, getting closer with every breath.\n\n**Count. Keep counting. Emma. Theo. Petra. Nia. Soren. Luca. Nikolaus. Kol. Davina. Josie and Kali. Rebekah. Bonnie. Lizzie. Rachel. Diana. Marcus. Maya. Cleo. Sarah.** \n\n_They're in the caves. They're moving. Keep going._\n\n**BOOM.**\n\nThe south window explodes — not shatters, the whole glass panel is fracturing in one violent crack corner to corner, cold air hitting my face and chest in a wall of pressure, plaster dust blowing sideways off the tables in one long sweep.\n\nThe silence after it is enormous. The kind of silence that means something has ended.\n\n\"That's it.\" Freya's voice is flat and certain. \"The last boundary barrier is gone.\"\n\nHope turns to Freya, and picks her up bridal style. “Hold on to me. I will take you to Nikolaus.”\n\nFreya nods, and puts her arms around Hope. Then, they are gone in the next second, flashing out of the room with Original vampire speed.\n\nI count the seconds. Twenty-five seconds pass before the sound of the basement door closing is heard, and Hope appears, standing to my right. \n\nFour of us.\n\n---\nOkay. Four of us against whatever comes through that door next. Hope, Valerie, Marcel, and me. Okay.\n\n\"When they come to the door—\" Hope turns to face the three of us. \"I need you outside.\"\n\nMarcel goes still.\n\n\"Hope.\"\n\n\"I have a surprise waiting for them inside.\" Her tone is even. Like a fact. Like she is describing the weather. \"Something they won't be expecting. But it only works if the building is intact when they cross the threshold. If you're inside when it goes—\"\n\n_Oh._\n\nThe understanding arrives all at once and it arrives like cold water and I hear myself think oh no before I've consciously caught up to what my brain has already worked out—\n\nShe is going to bring the building down.\n\nShe is going to stand in the center of this room and channel everything she has. She is going to take this building and every god that walks through that door down with her. She has been carrying this plan quietly this entire time while she sent everyone else through the basement door—\n\nThat is her plan. That has always been her plan.\n\n\"No.\" The word comes out before I've decided to say it and I don't take it back.\n\n\"Caroline—\"\n\n\"You told Lizzie that both of you dying meant your souls were gone.\" I hear my own voice — controlled, certain, the headmistress tone, the one I reach for when I need something to hold onto. \"Not transferred. Gone.\"\n\n\"Yes.\" There is no hesitation. No apology. She has already sat with that specific fact and made her peace with it.\n\n\"Hope.\" Valerie. She says carefully in a way Valerie's voice almost never needs to be. \"If you do this—\"\n\n\"The soul transfer works as long Lizzie is alive to receive it.\" The voice of someone who has run every version of this and came out the other side of all of them. \"She is.  Which means this isn't permanent.\" A pause. \"This isn't an ending.\"\n\nThe room is very quiet.\n\n---\nShe believes that. I look at her face and she absolutely, completely believes that, and I don't know — I genuinely cannot determine — whether that makes it better or worse and I am going to be turning that question over for a very long time.\n\nMarcel moves to the window. One hand flat against the cracked glass — and I watch him run through every other possibility. Every alternative. Every version of this that doesn't end with Hope standing in this room alone, and coming up empty on all of them, one by one. The moment he runs out of options is visible. His shoulders drop on one long, slow exhale.\n\n\"You're sure.\" Not a question. He asks it anyway.\n\n\"I'm sure.\"\n\nHe looks at her for a long moment. Then turns back to the window and doesn't say anything else, because Marcel Gerard is a man who knows when a decision is final and knows better than to spend the minutes he has left arguing with one.\n\nValerie's heartbeat is the steadiest in the room. She is looking at Hope with an expression I can't fully parse — grief and something that looks almost like pride living in the same space, neither one crowding out the other — and she doesn't argue.\nValerie doesn't argue with the tactically inevitable. It's one of the things I have always admired about her and right now it is the thing that tells me we are out of options.\n\nWhich leaves me.\n\nThe headmistress of this school, who delivered a very certain speech about staying to protect everyone, standing in a room with a twenty-three-year-old woman who has just explained she is going to bring the building down on herself and every god who walks through that door, and I have run every counter-argument and none of them hold and I know it and she knows I know it and the room knows it and—\n\nI hate this. The thought lands with its full weight, no cushioning, no redirect. I hate this so much. I hate that she's right. I hate that I can see exactly why she's right. I hate that there is no version of this I can think of a way out of.\n\nThe box is full. The box has been full for the last ten minutes. I am going to need to build a second box and possibly a third and I will deal with all of it later. The feeling that has been sitting in my stomach since Marcel declared he is staying has grown heavier with every passing minute, every farewell, every decision no one should have to make tonight. It has a name I neither have the time nor the desire to acknowledge. _Later. Right now, I can’t, can’t—_\n\n_There will be a later. There has to be a later. Hold onto that._\n\n---\n\"Lizzie is going to be even more furious than we thought,\" I say finally.\n\nSomething shifts in Hope's face. Not quite a smile — something quieter than that, something that knows exactly what I'm doing and receives it anyway, and receives it with warmth. Like she has been waiting for me to find the thing to hold onto and is glad I found it.\n\n\"Spectacularly furious,\" she agrees.\n\nGood. Hold that. Lizzie being furious at both of us. Lizzie finding out exactly what we did and going through every decision point in precise, thorough, merciless detail. At least a week. Possibly two. Completely worth it. That is a real thing that exists in the future. Hold onto it.\n\n\"Draw them in,\" Marcel says. Still at the window, his back to us, one hand flat on the cracked glass. \"And when the last one crosses the threshold—\"\n\n\"You get clear.\" Hope. Steady as the stone walls, steady as the foundations under our feet. \"All of you.\"\n\nThe four of us stand in the great hall. The smell of burning stone and ozone and that sweet unnatural thing rushing through the cracked window with every breath. Plaster dust on Petra's empty bench. The floor is still vibrating low and steady through my boots and in my jaw and in the base of my skull.\n\nTwenty-four heartbeats at the start of this night. Count where they are now. Count them and know they're there.\nFor one moment nobody moves and nobody speaks.\n\nThen Marcel straightens. Pulls himself to his full height, squaring his shoulders, and turns from the window to face the room.\n\nWe turn to face the door.\n\n\"For our family,\" Marcel says.\n\n\"For the children,\" I say.\n\n\"For all of them.\" Valerie adds.\n\nHope looks at each of us in turn. Something in her expression I have no words for — something old and clear and entirely unafraid. \"Always and Forever.\"\n\nAlways and Forever.","pages":["_Smoke._\n\nThe smell of burning stone, ozone, and something sweet with no name in anything natural coats the back of my throat. It's coming from an open window — and I'm already on my feet before Kol's warning reaches me from the floor below.\n\n**\"They are here. Everyone moves. Now.\"**\n\nThe perimeter monitor alarm screams.\n\nOkay. I'm already running an inventory. Okay. Exits. Main Foyer entrance, kitchen door, back door through the mud room, service door off the Werewolves containment area, basement to the caves. Heartbeats — twenty-four, all accounted for, all spiking.\n\n_Twenty-four. That's good. That's something. Keep going._\n\nWe have fifteen minutes. Maybe less.\n\nI race with vampire speed to the great hall, where everyone is gathering. Shoe rubber squeaks on flagstone as the rest of the school runs in from different parts of the building. The smell of garlic and basil from today's pasta dinner still hangs in the air. Dinner. It was just dinner a few hours ago.\n\n_Put that in the box._\n\nDavina, Freya, and Hope are already chanting, pushing the boundary spells to their limit. Their magic raises the hair on my arms — electric and warm.\n\nA loud bang from the south side of the property signals the direction the attack is coming from. On one of the oak tables, a glass cup left from dinner rolls to the edge and shatters on the flagstone with a crack. More spells ignite simultaneously. The pressure spikes, sharp and immediate.","Twenty-four heartbeats in the room and I know all of them. I made myself learn all of them — spent weeks memorizing every single one — because I was not going to be the headmistress who couldn't tell her kids apart in the dark. _That was the right call. Focus._\n\nEmma's heartbeat runs faster as she moves toward the younger ones without being told. Which is both impressive and something I feel deeply guilty about at three in the morning, because she is twelve and she learned to do that at eight and never stopped. _Think about that later. You will think about that later and you will deal with it properly. Not now._\n\nCleo has already positioned herself at the door, gathering the children. Theo's heartbeat is spiking and dropping and spiking in that particular rhythm that means his body is making decisions before his brain catches up. Soren anxiously watches him. Nia's is wolf-fast, instincts running ahead of her brain. Luca and Soren heartbeats are bleeding into one continuous terrified rhythm. And Petra — four years old and frantic — is asking about a drawing she lost. I cannot fix that right now—\n\n\"It is face-down on the bench right behind you.\" Nia points to it, walks over, folds it, and gives it to her. \"Put it in your pocket. We need to leave.\" She grabs Petra's hand.\n\n_Okay. Good. Nia handled it. One thing is handled._\n\n**\"Caves. Now.\"** My voice comes out loud and demanding. Good. That's right. Keep that tone. \"Children first. Cleo takes point.\"\n\nCleo's already running, boots loud and fast on the flagstone, hair flying, grimoire tucked under her arm before I finished calling her name. _That's why I assigned her to lead the children out. That's exactly why. The basement door slams open under her hands and the cold cave smell comes up from below — limestone and groundwater and mineral dark — and something in my chest unknots by a few degrees.\n\n_The path is clear. One thing is working. I will absolutely take it._\n\n\"Witches first, protect the front, werewolves after, stay together!\" Freya cuts through the noise from the center of the room, both hands already raised, copper-metallic magic sharp and immediate in the air. Her pendant swings with the movement, catching the light from the fixture above her. _Good. Freya has the containment. That is one less thing on the list. One less thing to worry about._\n\n\"Marcus, Diana, Rachel — rear guard, no one gets left.\" Marcel's voice carries from the south window, one hand flat against the glass panel, feeling the ward pressure through it. That’s the tone he drops into when he's commanding — the one that makes every person in a room straighten without meaning to. Myself included, which I notice and note under things to be embarrassed about later when everyone is alive.","I know what's on his mind. Because it's the same thing that's been running alongside every inventory item in my mental list since the alarm went off. It’s the thought I keep pushing to the back of the queue because if I let it move forward I stop functioning.\n\n_Box. It goes in the box._\n\nEmma has Soren's wrist and she is running, pulling him hard, Soren is grabbing Luca without looking back. Theo pushes Nia — go, go — Nia is still holding Petra's hand, Theo right behind her. Sarah is already running, grimoire under her arm, escorting the children inside the basement.\n\nDavina is spinning toward the south wall, the lit candles on the edge of the wall flare up as she walks past, wax running fast and hot down the sides onto the flagstone, their flames bending sideways in her wake. Her hands are raised, a tracking spell is half-built between her fingers, voice low and rapid in the specific cadence of a working spell.\n\nKol moves — and then he is already there, between one breath and the next, Original-fast, his hand is flat against the south wall, feeling what's coming through the wall.\n\nTheir eyes meet across the room.\n\nNeither of them likes what they're reading. _Don't look at that. Don't think about what that means right now. Box._\n\nBonnie is at the basement door. The warm green-bright electric smell of Bennett magic is charging at her fingertips. She is counting the children as they stream past her. Of course she is. That's Bonnie. That's always my best friend. The tightness in my chest moves in two directions simultaneously.\n\nNikolaus runs toward Freya. In the wrong direction of the basement door.\n\nHe pulls on her hand. \"Mom. Come on. The others are leaving.\"\n\nA tear escapes her. She wipes it away fast. \"Go with Cleo and Maya. I will be right behind you. If anyone attacks you, use your magic to help them protect the other children. I love you, honey,” she tells him in a low tone, bending down to hug him.\n\n\"I don't want to go without you.\"\n\nFreya straightens up and looks at Maya. \"Keep him safe.\"\n\n\"I will.\" Maya moves toward them.\n\nHope crosses the room, pulls Nikolaus into a brief hug, and kisses the top of his forehead. \"Come on, little guy. The others are waiting.\"","Maya picks him up and carries him to the basement entrance where Marcus, Diana, and Rachel stand sentinel. \"Go.\" Marcus steps aside. The three of them cross through the door behind Maya.\n\nThirteen heartbeats are dropping into the cave system. Cleo's voice is getting fainter through the stone walls — \"single file, hand on the wall, keep moving\" — and I count them the way I breathe.\n\n**Emma. Theo. Petra. Nia. Soren. Luca. Nikolaus.**\n\n_Good. Keep going. Keep moving._\n\nEleven of us now. The room feels enormous with the children and six adults gone. Plaster dust is still settling on the oak tables and Petra's empty bench. The floor is vibrating low and steady through my boots, my jaw, and in the base of my skull.\n\nAnother loud bang. The boundary barriers are still holding. We have time. We still have time. Probably ten minutes. Maybe less. That's time. That counts.\n\nRebekah blurs across the room — Original speed — toward Marcel at the window. She reaches him, reads his expression. Then, she cups his face with her right hand and turns his head to her, away from the window.\n\n\"We need to leave.\" Her voice drops low, cracking on the last word. She already knows his answer. I read it in her expression.\n\nMarcel stays silent. Not moving. His gaze is fixed on Rebekah's face. His jaw is locked so hard I can see the veins in his neck bulging. And there it is — the thing I have been running calculations around since the alarm went off, keeping it at the back of the queue because putting it at the front means accepting it. We need more time for the children to clear the caves safely. Some of us have to stay behind to buy those precious minutes. Marcel has already decided he's one of them.\n\nHis decision was made the moment the alarm was triggered. I know it because his contemplative expression hasn't changed since the attack started. Put that in the box.\n\nValerie shifts at my right shoulder — barely, just her weight redistributing. Her heartbeat is dropping into that specific rhythm that means she's already made a decision and moved past it and into logistics — and I don't need to look at her. I already know.\n\nThe two of us exchange a brief glance. Yes. I know. I know.\n\nMarcel can't hold the gods alone. He needs backup. Freya is preparing to hold the boundary spells as long as she can, which means she is planning to stay. Hope and the rest of us won’t let Nikolaus lose his mother tonight. That is not happening. _That is not an option. That goes on the list of things that are simply not options._","Josie is at the hearth, arms wrapped around herself, watching Hope with sad eyes. She's already worked it out — Freya staying, Hope intending to replace her aunt and stay in her place. _Add that to the list of things happening that I cannot stop right now._\n\n\"I'm not going.\" Marcel turns from the window to face Rebekah fully. His tone is flat and final.\n\nSomething moves across Rebekah's face. Not surprise. She already knew. The grief of having it said out loud is a different thing entirely from knowing it was coming, and I feel that specific distinction land in my stomach like a heavy stone.\n\n_Box. Right now. Box._\n\n\"We are. Because I'm not leaving without you, and we still have time to make it out.\" Her jaw is set. Every line of her body is immovable.\n\nOh God. I can already see the shape of where this goes — Marcel won't let her stay, Rebekah won't leave without him, and we have maybe eight minutes left on the wards and zero time for the confrontation that's about to happen. Think. Is there an intervention here? Is there a way to — no. _No, there isn't. There is no version of this where I step between Marcel Gerard and his wife right now. Note that. Move on._\n\nDavina is already crossing the room toward them, her footsteps quick and purposeful on the flagstone.\n\n\"We need to buy time for the children.\" Marcel's voice is measured. Decided. His shoulders are squared, every line of him is already somewhere past the argument. \"After Hope, I'm the strongest vampire here. So I'm staying.\"\n\n\"No.\" Rebekah's grip tightens on his arm. \"Marcel. No.\"\n\n\"Bex.\"\n\nJust that. Just his name for her, in the tone he only ever uses for her alone.\n\nShe stops.\n\nI have seen Rebekah Mikaelson not stop for a great many things. I have seen her not stop for gods, for her own family when her own family was wrong. I have never in all the time I have known her seen her stop for a single word.\n\n_I don't have anywhere to put that. That goes in the box with everything else and I will deal with it later and I am absolutely going to deal with it later._","Marcel cups her face in both hands. Her heartbeat under his palms — is elevated, terrified, unmistakably Rebekah's, the one I could pick out of any room on the planet. He looks at her for one long, unbearable second.\n\nThen he moves. Fast. Certain. Gentle in the way that costs everything.\n\n**Crack.**\n\nHer heartbeat stops.\n\nThere and then not there. Something tightens in my chest so hard it takes actual effort to keep my face from doing anything. _I cannot... I cannot feel it right now—_\n\nHe presses his mouth to her forehead and stays there, holding her against him, and the room doesn't breathe.\n\nEight minutes become seven. The floor is still vibrating, plaster dust still settling on the oak tables completely indifferent to everything happening in this room. The universe has always had terrible timing. There is nothing to be done about that right now.\n\n_Keep moving. Keep counting. Keep moving._\n\nKol is at his side in nothing flat — three seconds, silent — his hand on Marcel's shoulder, and something passes between them that doesn't need words.\n\nMarcel lifts his head. \"When she wakes up. Tell her I love her. Tell her to keep going.\" His voice holds. His eyes are still fixed on her face, like he's trying to memorize every detail of it. I am counting every second of it. \"Tell her... tell her, I said always.\"\n\nKol takes his sister from Marcel's arms with deliberate care. He adjusts his hold, tucks her against his chest with the particular gentleness of someone who has done this before... and pauses.\n\nHe looks at Marcel for one moment. Something moves across his face that doesn't usually live there.\n\n\"We have not always agreed, you and I.\" His voice is low. Even. \"But you have loved her well. You put her safety above everything else.\" A beat. \"That makes you Mikaelson enough for me.\"\n\nMarcel holds his gaze. He nods once.\n\nKol turns toward the basement door without another word, because Kol has always understood that some things don't need to be spoken to be completely heard.\n\nA thousand years of practice. I am not examining what that makes me feel right now. That is a box inside a box.","Marcel turns to Davina. Pulls her into a hug without a word, and she goes into it completely — arms tightening around him, face pressing into his shoulder — and her heartbeat breaks in that very specific pattern. Controlled inhale, losing the exhale, trying again. I hear every hitch. I count them the way I count everything, because counting is the only thing I have right now.\n\n\"Having you as my daughter has been a blessing. You and Rebekah are the most important people in my world.\"\n\nHer arms tighten. When she finally speaks, her voice is barely above a whisper, held together by sheer force of will. \"You gave me a home and a family when I had neither. Even if not by blood, you are my dad — you have been my dad from the moment you rescued me from being sacrificed by my coven and my parents.\" A breath. \"Don't you dare make this goodbye.\"\n\nKol stops at the basement door, Rebekah in his arms, and waits. Davina pulls back, wipes her eyes with the back of her hand, turns toward him—\n\n— and stops.\n\nHer gaze finds Josie.\n\nMy daughter is standing at the hearth with wide, watery eyes, watching Davina with an expression I know the way I know her heartbeat — have known it since she was born — and something in my chest does something I don't have a name for right now and don't have time to find one.\n\nDavina goes still for a moment. Then turns to face her fully.\n\n\"We need to move. And I'm not leaving you. I'm not about to lose you too.\" Still wiping the tears spilling freely down her face as she says it, looking directly at Josie.\n\n_Good. That's good. Davina has her. Keep moving._\n\n\"Go.\" Josie's smile is watery and doesn't reach her eyes by a mile. I know that smile. I have worn that smile. It is the smile of someone who has already made a decision and is trying to make it easier for everyone else to accept it.\n\n_Oh God. Josie, no. No, no, no—_\n\n\"I'll wait for Lizzie, mom, Hope, and aunt Bonnie. We'll catch up.\"\n\n\"You don't need to.\" Lizzie has flashed to her twin sister’s side. Her voice is low and tight. Her eyes move once back and forth between Hope and Josie, already cataloguing every worried glance Josie has been sending in their best friend’s direction. She has clocked all of it. Of course she has. These two have been reading each other since before they could talk. \"We are leaving. Now.\" Her hand finds Josie's, her jaw set.","_Thank you, Lizzie. Thank you._\n\n\"Cleo has seven children with her.\" Bonnie's voice carries from the doorway, flat and certain. \"They need your magic down there, Josie.” She already noticed Josie's resistance to leave.\n\n\"Davina and I aren't moving without you, Josie.\" Kol, from the doorway. Steady. Immovable. Arms still full with Rebekah's unconscious body, eyes fixed on Josie with the intensity of someone who means every syllable.\n\nLizzie's gaze moves across the three of them — Kol in the doorway, Davina frozen mid-step, Josie at the hearth wearing a smile that isn't fooling a single person in this room — and something shifts in her expression.\n\n\"I am genuinely moved by the three of you. The silent suffering, the longing eyes, the absolute commitment to dying for each other — it's very romantic, it really is.\" The light fixture above her flickers as the outer wall shudders, plaster dust drifting from the ceiling. \"We need to get our asses out of here ASAP.\"\n\nThat's my daughter. The thought arrives before I can stop it and I let it stay because I need it.\n\n\"Sort out your love triangle later.\" Marcel’s dry response carries from across the room. \"Preferably when Kol isn't holding my unconscious wife.\"\n\nDavina lets out something between a laugh and a sob — real, involuntary — and walks toward the basement door to stand next to her husband. Waiting with him for Josie.\n\n_Okay. Okay, that's movement. That's the right direction. Two steps forward—_\n\nLizzie flashes to Hope's side.\n\nShe looks at her — the set jaw, the particular brightness in Hope's eyes that I have learned to recognize over years of watching her — and I see the exact moment Lizzie understands what that expression means.\n\n\"No.\" Her hand finds Hope's arm. \"You are not staying.\"\n\nHope's heartbeat is steady. The steadiness of someone who made this decision and has come to terms with it.\n\nI knew it. I knew it the second I saw Hope hug Nikolaus after she watched Freya say goodbye to him, and I saw her face. I noted it under things I was not ready to look at directly—","\"They want me. I'm the one who killed their king. They have been looking for me, razed three continents and most supernaturals on the planet for revenge. If I stay—\"\n\n\"You die.\" Josie's voice fractures on the last word. The fire at the hearth flares — a brief, involuntary spike of heat answering her.\n\n\"The children die if I go.\" There is no apology or softness in her tone. The truth is set down and left there, clean and immovable. \"The caves buy them at most twenty minutes without a diversion. With someone the gods actually want—\"\n\nShe's right. The thought lands in my chest like something cold and heavy. She is completely right. I hate it with every single cell in my body and she is right.\n\n\"Lizzie.\" Hope turns to her and the flatness comes off her voice — there is something warmer underneath, something that is just the two of them. \"You and I are each other's partners for the soul possession spell. If both of us stay, and we both die, our souls won't get transferred. We will just be gone.\"\n\nJosie makes a sound. Small. Involuntary. Fractured. Th
