 in place with tree roots and I lost complete control and roared at her like an animal? That Caroline may not wake for hours? Days?\n\n\"Truth, if you wish. Though I doubt she'll believe it completely until Caroline wakes and demonstrates her new nature.\" Gaia's voice harmonizes with wind through the branches above us, the boundary between her words and the forest indistinct and deliberately so.\n\nWhen. When Caroline wakes. Not if. She said when, which means—\n\nStop. Do not reach for reassurance from the creature who arranged every moment of this morning. Focus on getting Caroline somewhere safer than a clearing where nature is actively trying to reclaim her.\n\nAnother root snakes toward her unconscious body, reaching with the slow devotion of something that has all the time in the world. The tendril finds her wrist and curls there, gentle and implacable at once — protective, as Gaia said, but protection that will not stop when she needs to wake, and the distinction between protected and claimed is one I intend to make very clear.\n\n\"But I suggest haste. Nature can prove... overprotective of its chosen ones.\"\n\nI move to lift Caroline. The vines and roots wrapped around her release her, as if they have decided to retreat now that she is in my arms.\n\nThe details arrive all at once the way they do when my body is paying full attention without being asked to: the faint golden radiance pulsing beneath her skin in time with her heartbeat — that rhythm I have apparently memorized without deciding to. She feels lighter than she should, as though gravity affects her differently now. And she crackles — power contained beneath the surface of her, raising the fine hairs along my forearms, a specific charge that puts me in mind of Benjamin Franklin's Philadelphia workshop in 1752, lightning barely contained within inadequate vessels that hummed with it, that felt liable to split open at any moment.\n\nWhat if she wakes while I'm carrying her? What if the power comes up before she has any control of it and—\n\nWhat if she doesn't wake at all?\n\nHer scent reaches me through the charged air — transformed almost entirely, familiar vampire coolness replaced by something wild and old and inexplicable: petrichor like rains that ended famines, wildflowers in impossible abundance, and underneath it that spice-floral electrical current that has been threading through my awareness since this morning, except now it is not a thread or a current. It is simply her. Simply what she smells like now.\n\nShe fits in my arms with disturbing rightness. Cradled against my chest while unconscious and vulnerable and transformed into something new, powerful, and divine.\n\nThe territorial satisfaction this provokes should alarm me more than it does.","It does alarm me. Except it also feels inevitable, like puzzle pieces clicking into place, like I've been waiting a millennium to find exactly this. Her. This moment. This inexplicable certainty that she BELONGS here, in my arms, under my protection, despite every rational reason that makes no sense.\n\n\"Remember,\" Gaia calls as we depart, small stones near her feet rising briefly into orbit before settling again with casual indifference to the natural laws governing such things. \"She'll require time when consciousness returns. Her powers will be... unstable initially.”\n\nUnstable. A newly-made goddess with unstable powers, no control of them, and every supernatural faction that will sense her emergence within—\n\nHow long? Hours? Days? How long before every ancient being realizes new divine authority just manifested? How long before threats converge seeking to eliminate or control or—\n\n\"Wonderful.\" I mutter, adjusting Caroline in my arms as Elijah moves ahead to clear our path of grasping vines that recoil from him like sentient things recognizing supernatural authority.\n\n\"A newly-made goddess with unstable powers. What could possibly go wrong.\"\n\nEverything. The list assembles itself without invitation: she could lose control before she understands what she is carrying. She could be targeted before she has learned to defend herself.\n\nDon't. She survived the transformation. She is breathing. Her heartbeat is increasingly steady against my chest with every step I take away from that clearing.\n\nWhen she wakes.\n\nNot if. When.\n\nI hold onto that with both hands and walk.\n\nLooking down at Caroline's features — still traced with golden runes pulsing in time with her breathing, the light of them steady now, patient — I find the question surfacing before I can stop it: will she still be her when she wakes. Will she remain the stubborn impossible girl who called me predictable and placed her neck within reach of my teeth to deliver a warning I wasn't heeding. Or will godhood change her into something unrecognizable, divine authority burning away everything underneath until what opens those storm-blue eyes is something I have no existing name for.\n\nThe possibility sits in my chest with a specific weight I am not going to examine while Elijah is watching.\n\nThe sacred-flame warmth radiating from her body is unlike anythingI have felt in a millennium of encounters with the supernatural. Not vampire chill. Not werewolf heat. Something older than either, something that presses against my skin with the patient certainty of a thing that knows exactly where it belongs.","The runes pulse faintly with each breath. Small flowers break through soil in our wake with soft popping sounds — petals opening and closing in rapid succession, the earth responding to her even now, even unconscious, nature turning toward its new mistress the way it turns toward the sun.\n\n\"This represents unprecedented development,\" Elijah muses beside me, scholarly fascination barely contained beneath eleven centuries of diplomatic composure. His shoes bear stains that would horrify him under normal circumstances. They do not appear to be registering yet. \"A new goddess, manifesting in modern times. The implications for supernatural hierarchies—\"\n\n\"Can wait.\"\n\nCaroline stirs. The sound she makes is soft — halfway between sigh and murmur — and the trees around us respond immediately: branches bending inward with creaking protests, like a concerned parent reaching to check on a sleeping child. Leaves rustle with unexpected animation, a particularly enthusiastic maple nearly removes my eye with a questing branch that moves with purpose. Though this particular scene is more reminiscent of reaching, skeletal hands in a nightmare painting.\n\nThe air warms then cools in rapid cycles — building and releasing in unpredictable patterns that press against my skin like weather that cannot decide what it is. Her power, surfacing without direction, reaching for the world around her because it does not yet know how not to.\n\n\"Astounding,\" Elijah observes, ducking under an oak branch with the practiced grace of a man who has survived considerably worse. \"Her connection to nature appears instinctive, even while unconscious. One wonders what she will manage when she is awake and attempting something.\"\n\n\"Less observing. More walking.\"\n\nHe does not take offense. After a thousand years he has learned which of my tones require a response and which do not, and he increases his pace without comment, moving ahead to clear grasping vines from the path — vegetation still recoils from him like it did in the clearing.\n\nMove faster. Get her somewhere contained before her power draws the attention of every supernatural faction within range, before the residents of Mystic Falls notice trees bending forward and flowers sprouting in our footsteps. The electric current of her power pulses against my arms with each surge and release, the charge of it raising the fine hairs of my forearms, and I hold her closer instinctively and do not examine why that helps.\n\nRemnants of Gaia's roots still cling to my clothing — bark splinters pressing through the fabric of my shirt where the roots had coiled, each one a small specific reminder of kneeling in cold soil unable to reach her. I am aware of them with every step. I leave them where they are.\n\nThe silence holds for several minutes. Then Elijah's pace evens, his voice shifting to the particular register he uses when he has decided something must be said plainly regardless of reception.\n\n\"She knew.\" Level. Careful. Delivering something he has been sitting with since the clearing. \"The goddess. Before you made a sound — before the roots, before you called Caroline's name — she already knew.\"","A beat of silence that is genuinely his.\n\n\"The way she said your vampire.\" He does not look at me when he says it. His eyes remain on the path, pace unchanged. \"That was not a slip of phrasing, Niklaus. That was confirmation. She had already assessed what Caroline Forbes represents to you, and she used it accordingly.\"\n\nAnother pause. A thousand years of shared catastrophe, and I have learned to read every quality of Elijah's silences. This one is not dramatic. It is simply true.\n\n\"I would suggest that whatever you intend to do next — whatever arrangement you consider making with her, whatever cooperation she requests — you do so with the understanding that she will deploy that knowledge. She already has. She will again.\"\n\nHe does not say what we are both thinking. He does not need to. The space between us has carried worse things than this.\n\nThe damage is done. Gaia knows. Elijah knows. And Caroline will know when she wakes — because Gaia will tell her, or because she will simply look at me with those storm-blue eyes and read it herself the way she has been reading me since she arrived in the wood this morning, with the exasperated accuracy of someone who has had years of practice with the target.\n\nThat, I what? Lost control. Showed exactly how much she matters, revealed it in front of a primordial goddess and my brother and the whole of that clearing with roots and screaming and her name torned raw from my throat.\n\n'Tis done. Cannot be undone. Move forward.\n\n\"I have not seen anything like that in a thousand years.\"\n\nElijah's voice, after a silence that has been doing its own work. Not the tone of a man disturbed — the tone of a man who has finished noting something and is now reporting his conclusions with the careful precision of someone who understands the information is important. \"The blast. What Miss Forbes produced inside that dome, without waking, without intending to — I cannot name a supernatural force in my experience that would have survived it. The vegetation was ash. Not burned. Not scorched. Ash, Niklaus. In the space of a single breath.\"\n\nA beat.\n\n\"And Gaia stood in the centre of it entirely untouched.\"\n\nHe does not elaborate. He does not need to. The implication assembles itself with quiet efficiency: Caroline produced something that would have killed anything in that clearing, and Gaia contained it with a dome barrier and emerged from it as though the temperature had been mildly inconvenient. Which tells us with considerable precision where both of them sit relative to each other and to anything else currently walking this earth.","\"When she wakes,\" Elijah continues, \"with no knowledge of what she is carrying, no experience of its scale, no understanding of what a moment of strong emotion or an involuntary response could produce in the middle of a populated town—\"\n\n\"I am aware,\" I say.\n\nI am, in fact, only partially aware.\n\nThe other part of my attention — the part that should by any reasonable measure be occupied with the exact concerns Elijah is articulating, with the very real and pressing question of what it means that Caroline Forbes can reduce everything within a contained radius to nothing without regaining consciousness — is occupied instead with the precise quality of morning light against the long line of her back. The way the runes pooled in the hollow of her spine in patterns that moved like breathing. The specific angle of her shoulder blade. The contrast between the mathematical precision of the divine markings and the entirely human curve beneath them.\n\nVenus Anadyomene. I had thought it involuntarily and I am thinking it again, with the specific persistence of images that have decided they intend to be painted. I am already composing the piece in my mind — the arrangement of light, the quality of the glow, the particular challenge of rendering radiance that originates beneath the skin rather than striking it from without. I would need to invent a technique for—\n\nElijah is saying something about threat assessment.\n\n\"—the question being not whether she represents a danger but to whom, and under what circumstances, and whether proximity to her when her powers are unstable constitutes an acceptable risk given—\"\n\n\"Elijah.\"\n\n\"Yes.\"\n\n\"She turned things to ash. I understand.\"\n\nHe looks at me with the specific expression of a man who suspects I do not, in fact, entirely understand, and has decided to let the suspicion sit without naming it directly. After a thousand years he has learned which arguments are worth the expenditure. This one, apparently, is not.\n\nI adjust Caroline in my arms. The warmth of her presses steadily against my chest. Her heartbeat has evened further, the rhythm of it settling into something deep and unhurried, and I am tracking it without deciding to, and I am thinking about the quality of gold against pale skin in morning light, and somewhere underneath all of it Elijah's observations are doing their necessary work.\n\nLater. I will examine it later. I will think about what it means that Gaia stood unmoved in the centre of Caroline's power. I will think about what it means that Caroline produced that power without waking, without deciding to, in response to nothing more than pain.","Later.\n\nElijah's suit unfortunate condition becomes more apparent in the light away from the clearing — mud streaking his white shirt, expensive jacket bearing tears where thorny vines wrapped his arms, dark hair holding fragments of moss and small twigs with democratic impartiality. His jaw tightens almost imperceptibly as he catches his reflection in a car window. The sight would amuse me under different circumstances. His vanity regarding appearance is one of the few reliable constants across ten centuries and I have never once been able to resist it.\n\n\"Elijah.\"\n\nHe glances over.\n\n\"You have oak bark in your hair.\"\n\nThe expression that crosses his face is worth considerably more than this morning has cost me.\n\nThrough peripheral vision, I detect his discomfort radiating like heat as we move towards the Forbes residence. Elijah despises presenting anything less than sartorial perfection, especially to authority figures.\n\nThe irony isn't lost on me — we're about to meet the mother of a new goddess while appearing as though we've been buried alive and clawed our way out.\n\nWhich, considering we were bound by roots and divine power while Caroline underwent divine transformation, isn't far from accurate.\n\nCaroline's weight shifts in my arms as we approach the Forbes residence — morning sun breaking through clouds with theatrical timing, light catching the gold of the runes on her skin so they flare briefly before settling. The warmth of her radiates steadily through the chill air, pressing against my chest with that same patient certainty. Her heartbeat reaches me clearly now: steady, evening further with every step, less like drowning, more like sleep.\n\nWhen she wakes. That is the only version I am holding.\n\nSheriff Forbes' vehicle sits in the driveway. Naturally. Probably awake since before dawn, worried sick about her daughter's whereabouts after last night. How long has Caroline been missing from her perspective? Does she know her daughter left at all?, or has she been sitting at that kitchen table since—\n\nI briefly consider compelling her — simpler, cleaner, eliminates the conversation entirely. The golden runes on Caroline's skin pulse fractionally faster at the thought, a single irregular beat that resolves back to steady before I have finished having the idea.\n\nAs if she knows. As if whatever remains conscious in her beneath the transformation has sensed the direction of my thinking and has registered its disapproval with the specific efficiency of someone who has had to register disapproval at me before.","The runes settle.\n\nIt is, mayhap, the most reassuring thing that has happened all morning. Whatever godhood has made her, it has not made her someone who would be less annoyed at me for the same reasons.\n\n\"Perhaps I should address the sheriff first,\" Elijah suggests, straightening his tie with the unconscious precision of a man who has been making difficult introductions for a millennium, apparently unaware that the tie in question is crusted with forest debris. \"Explain the situation diplomatically.\"\n\n\"And what situation would that be, precisely?\" I look down at Caroline's glowing form, then back at my brother. \"That her vampire daughter just became a goddess of magic and nature? I'm certain that will proceed splendidly.\"\n\nEspecially when Caroline is literally illuminated from within and covered in divine script and radiating enough power that the trees lining the Forbes' front path are already bending inward at our approach, branches reaching toward her with the slow devotion of things that have decided she is theirs.\n\nThere is no diplomatic version of this.\n\nBefore either of us can determine what there is, the front door opens.\n\nNot opens — flies. Enough force to rebound against the interior wall with a crack that carries clean across the quiet morning street. The smell inside the house reaches me in the same moment: coffee, faint traces of gun oil, the specific sharp note of someone who has not slept and has been awake long enough that the stress of it has become its own scent.\n\nSheriff Forbes stands in the doorway, service weapon already drawn, morning light catching the metal with the same gleam I have seen in the weapons of a thousand soldiers across a thousand years preparing for the thing they cannot prevent. Her eyes take in the scene in a single sweep — her daughter unconscious in my arms, golden runes on her skin, divine light pulsing beneath pale flesh, two supernatural creatures disheveled and tense on her front lawn, like grave robbers caught in daylight, like the answer to every nightmare she has had since she learned what this town contains.\n\nThe breath she draws before she speaks has the specific quality of a woman deciding between grief and fury, and choosing fury because it is more useful.\n\n\"What did you do to my daughter?\"\n\nThe words come out with the specific force of a woman who has stood between her child and the world for seventeen years and intends to keep standing there regardless of what the world currently looks like.\n\nI have faced armies with less conviction.\n\nWhatever I say next — whatever explanation exists for this morning — it will not be sufficient. But she is asking, and Caroline is warm and breathing in my arms, and that is, per aspera, the only answer I actually have."],"transitionImage":"","transitionImageLabel":"","transitionImageColor":"gold"}],"premise":"How far would you go to save everyone you lost? What price is too high — and what happens when you've already paid it?\n\nI have seen the end of the world. I watched gods rise from myth into nightmare. I watched cities burn and the supernatural world hunted to the edge of extinction. I watched the people I loved die — one by one — until there was  almost no one left to save.\n\nSo I made a deal with Gaia.\n\nNow I'm back. Same town. Same faces. The same future bearing down on all of us like something inevitable — and I am not the only one carrying memories of a timeline that must never happen.\n\nWe are scattered across the past, each of us carrying knowledge that was never meant to exist here. Every person laughing beside me is someone I already mourned. Every choice we make could save a life — or collapse the very future we crossed time to reforge. And the magic that sent us back is already collecting what it's owed.\n\nBut Gaia's bargain was never free.\n\nShe doesn't grant second chances out of mercy. She moves through fate the way blood moves through stone — slowly, inevitably, consuming whatever it touches. Her price is me. Bound. Marked. Purposed for something none of us fully understand yet.\n\nThe blood spilled in the future follows us here.\n\nIt always does.\n\n                                                                                                                                                                                                           — Caroline Forbes","byb":"_A note from the author_\n\nWhat you are about to read was not written to be finished and set aside. It was written to be returned to — in the quiet after a chapter closes, in the space between one voice and the next, in the moment when a piece of the story lands and you find yourself wanting to know more about how it came to exist.\n\nThis journal has a back matter. Most books do, and most readers never find their way there. This one is worth finding.\n\nAt the back of this book, behind the final chapter and the closing seal, there are pages written for you specifically — notes, analysis, and context that exist outside the story itself but illuminate it from within. Some of what lives there will change the way you read what comes before it. Some of it will answer questions the story raises without fully resolving. Some of it simply tells you how this world was built, and why it was built the way it was.\n\nTwo sections in particular are meant to grow alongside the story rather than wait until the end. The Author's Notes contain chapter-specific reflections written after each chapter was completed — thoughts on the writing, the decisions made, the things that changed between intention and the final page. The Character POV Transitioning notes are my own observations on the POV transitioning artwork, written as the portraits are added. Both of these sections will continue to expand as new chapters and new portraits arrive. They are worth returning to each time something new is added. There is always something there that the chapter or the image alone does not say.\n\nThe rest of the back matter — the pages gathered under About the Story, About the Author, and the sections that explain the visual world of this book — those contain the kind of context that earns its full meaning once you have spent time inside the narrative. You will recognize what they are describing. You will understand why it mattered.\n\nYou do not have to read any of it before you begin. But you will want to.\n\n**What comes next has been waiting for you.** \n\n— Bluezahera","authorNotes":[{"chapterLabel":"Prologue","chapterTitle":"Zero Hour","body":"I still need to write something"}],"aboutStory":{"storyInspiration":"I have to write something here.  \n\n— Bluezahera","logo":"**This is the story's visual identity**\n\n**The entire logo is the story compressed into a single image** — a time-fractured world contained within the unbreakable frame of thousands years of divine and supernatural history. Every color, every symbol, every structural choice is a piece of the story itself — a visual prologue that, once you have read the full narrative, you will look back on and understand in an entirely new way. \n\n!!The Circle and the Chain!!\n\nBefore anything else, notice the shape that contains everything: a perfect circle, framed by a braided bronze and copper chain.\n\nThat chain represents the unbroken sequence of cause and consequence — the chain of events that defined a catastrophic future and made the past a battlefield. Every choice made across two thousand years of supernatural history, every alliance forged and broken, every sacrifice that seemed final — these are the links. The chain loops into a full circle because that is precisely what happens in this story: the future curves back and bites the past, and the past becomes the only weapon the future has left.\n\nThe emerald-green gems are the color of the living world, nature, and magic that anchor the chain in place.\n\nThe bronze and copper color represent the span of time. The metal carries the weight of centuries — of the Mikaelson family's millennium of survival, of Greek gods who predate written history, of a supernatural world that has been quietly shaping human civilization from the shadows since before memory. This frame does not just hold the image together. It holds the **world** together.\n\n!!The Clock at the Center!!\n\nThe great mechanical clock at the heart of the logo is the story's engine made visible.\n\n**Echoes of Tomorrow** exists because time can be broken. Because a group of supernatural beings, facing the end of everything they loved, chose to do the most dangerous thing imaginable: reach backward into the past and try to unmake a future that had already happened. The clock represents that premise — not as a timepiece, but as a cosmic mechanism, its gears exposed, its workings visible, because in this story time is not a passive river you float through. It is something that can be reshaped if someone is clever enough, strong enough, and willing enough to pay the price of it.\n\n---\nThe Roman numerals echo the manuscript's own chapter structure — a deliberate choice to remind you, as you move through each numbered chapter, that you are always inside the clock. You are always inside the mechanism. The **gold** color represents the divine presence and influence on the past, present, and future events of this story. The gold hands mark not hours but moments of consequence, the pivot points where one choice sends everything in a different direction. The story you are reading is the story of people trying to move those hands before they lock into place forever.\n\n!!The Energy Tendrils: Life, Magic, and the Hand That Guides Everything!!\n\nThe living energy that moves through this image does not choose a straight path. It winds, it reaches, it threads through ruins and city alike, through clock and portal and smoke.\n\nThe Green here is the color of **life itself**. Of the living world's pulse, the energy that runs through every growing thing and every magical working and every supernatural being who has ever drawn power from the earth beneath their feet. It is the color of **nature** — not gentle, domesticated nature, but nature in its oldest and most sovereign form, the kind that was old before human civilization had words for it.  It is the color of **magic** at its most primal, before it is shaped by any individual wielder's will. And it is inseparably the color of **Gaia**, the Primordial earth goddess who exists beneath and behind everything in this story, who does not rule so much as permeate, whose influence is felt in every alliance that forms and every power that awakens and every choice that somehow, against all odds, lands exactly where it needed to.\n\nGaia is the entity who moves behind everything in **Echoes of Tomorrow**. She does not announce herself. She does not command. She harmonizes, positions, creates conditions — and then she waits for the pieces she has placed to move according to their own natures. The tendrils move through the entire image because Gaia moves through the entire story. She is in the conditions that make certain meetings possible and certain events inevitable. She accesses fragments of future memory not because she is omniscient, but because she has been tending this web of connected souls long enough to read where the threads are pulling. The green energy filling this image is her web, made visible. Every character in this story exists somewhere inside it.\n\nBut look carefully at the tendrils, and you will see that green does not travel alone.\n\nThreading through it are traces of **red** — the color of vampire blood, of the violence and passion and sacrifice that has shaped a thousand years of this world's history, the cost written in a color that does not wash out. And wound through it alongside the red is **gold** — the divine, the Olympian and Titan sacred light, the color of the blessings that will transform these characters into something beyond what they were born as. Three colors in a single current: life and nature, blood and sacrifice, divine fire. These are the three forces this story is built on, and they do not move separately. They move together, each one threading through the others, because in **Echoes of Tomorrow** no single power exists without the others pressing against it. They are entangled. They always were.\n\n---\n!!The Vortex Portal: The Door Between Then and Now!!\n\nAbove the clock, feeding down into it, a spiral of green energy turns without end — and it is not merely a symbol. It’s a **door**.\n\nThis is the portal. This is the physical, magical reality of what the time travel spell creates: a tear between what was and what is, held open long enough for a group of supernatural beings carrying the weight of a destroyed future to step through it and land in a past that still had a chance. The vortex is positioned above the clock because it must be — magic opens the door, and time is what lies on the other side. The portal does not exist inside time. It exists above it, outside it, at the point where something very powerful can reach through the mechanisms of time and move its hands.\n\nThat the portal that makes this entire story possible glows in Gaia's green color is the logo's quietest and most significant truth. She was there at the beginning of the mission. She had been there before the mission was even conceived.\n\nThe spiral turns without stopping because Gaia's work is never finished. The door opened. The travelers went through. But the vortex remains — because the story is still moving, and she is still watching, and the chain of events she is influencing has not yet reached its final link.\n\n!!The Runic Script: What Cannot Be Fully Read!!\n\nInside the circular frame, runic symbols move **alongside the energy tendrils** — threading through the living green current beside the red and gold, carried within the flow of life, magic, and divine energy which threads through every part of the supernatural world in this story.\n\nIn **Echoes of Tomorrow**, runic magic is not something that exists separately from the characters who wield it. It emerges **from*8 them — from the intersection of their supernatural nature and their divine blessings. Each character’s sphere of power is shaped from who they are and what they are. When these characters cast their power, when they reach into the power that has been grafted onto their supernatural nature by gods older than recorded history, what emerges takes the form of **symbols**. Written power. Language that does not describe the world but **changes** it.\n\nThe runes also speak to Gaia's web directly. The runic symbols moving through the green current are not random markings — they are the signatures of the soul bonds, bloodline adoptions, and divine links that connect every character in this story to every other. The chain in the frame holds the world together structurally. The runes threading through the living energy hold it together **magically** — the invisible writing that records every connection, every binding, every irrevocable link that has been forged between these people across a thousand years and two timelines. It is all there, moving through the current, partially legible and endlessly present.\n\n---\n!!The Smoke: The Death Realms!!\n\nBehind everything — behind the energy, behind the clock, behind the ruins and the city and the vortex — grey smoke drifts.\n\nThese are the death realms.\n\nNot a dramatic presence. Not a violent one. A **constant** one — moving behind the living world, hidden inside it, threading through it the way cold air threads through a warm room. The death realms in this story are not a distant destination or a final punishment. They are a layer of reality that has always been present, always exerting pressure, always shaping what happens among the living even when the living cannot perceive it. Souls linger in them. Power is drawn from them. Characters who have died — and there are many — exist in proximity to the living world through them.\n\nThe grey smoke does not overwhelm the image because the death realms do not overwhelm the living world in this story. But they are never absent. Every bright color in this logo exists against that grey smoky background, just as every moment of survival and love and triumph in this narrative exists against the ever-present knowledge of what death costs and what it contains. You cannot look at this image without looking through death to see the living world.\n\n!!The Ruins and the City: Two Worlds, One Story!!\n\nOn the left side of the inner circle, an ancient **Roman temple** rises, in the time when Primordial gods shaped the earth, Olympians governed the sky, and divine power moved openly through human civilization. \n\nOn the right, a modern small city downtown glows with electric light in the present time when the gods have become legends and myths. \n\nThis split is the story's central tension given visual form. The characters of **Echoes of Tomorrow** are ancient beings — vampires over a thousand years old, witches carrying bloodlines that stretch back to the ancient world — navigating a present-day setting while carrying the full weight of everything they have survived. The gods they will encounter and the divine powers they will receive connect directly back to that left side of the image, to a world that most people in **2010 Mystic Falls** believe never existed.\n\nThe ancient and the modern world do not exist separately in this story. They occupy the same space, just as they occupy both sides of the same circular image — held together by the chain, wound through by the same living energy, both equally real.\n\n---\n!!The Title: Metal Being Forged!!\n\nFinally, the words themselves: **Echoes of Tomorrow**, rendered in letters that glow red and deep amber. The lettering evokes the visual of metal in a forge, heated past the point of rigidity, malleable and dangerous and bright.\n\nThe future in this story is not fixed. It is material. It can be heated, reshaped, beaten against the past until it takes a different form. Though, forging it is never a painless process. The red glow of these letters carries within it everything the travelers brought back with them: the memory of a future that was destroyed, the losses that cannot be undone even if the catastrophe can be prevented, the sacrifices made by people who died in a timeline that will cease to exist if the mission succeeds. They lived that future and paid the price of it.\n\nThe title glows with that cost.\n\n!!Everything, Together!!\n\nThe **Echoes of Tomorrow** logo is the story in miniature. Look at it as you begin, and you will see a striking image. Look at it again when you have finished, and you will see a map of everything that happened — the ancient and the modern world held inside a chain of events and consequences, the death realms breathing grey behind the living world, the full spectrum of supernatural and divine power woven together in light and smoke and color, a vortex of magic, and at the center of it all, a clock surrounded, its hands moving toward the past that one group of extraordinary, flawed, powerful, grieving beings is determined to change before it becomes an inevitable future.\n\nThe image does not promise you that they succeed.\n\nIt only promises you that they tried with everything they had.\n\n**That is the story. Welcome to it.**\n\n— Bluezahera","bookmark":"I have to write something here.","bookCreation":"I have to write something here.\n\n!!Subtitle!!\n\nI have to write something else here.\n\n!!Subtitle!!\n\nI still have to write some more here.","navigation":"_A note on navigating this book_\n\nWhat you are holding — or rather, what you are reading across whatever screen has brought you here — is not a conventional book. It is a journal. A collection of handwritten personal recollections assembled from the people who lived through the events described in these pages, who fought and survived and lost and chose, and who wrote it all down afterward in their own hands, in their own voices, in ink that still carries the weight of everything it cost them.\n\nA journal of this kind deserves to be moved through with intention. Every feature built into this reading experience was designed to serve that movement — to let you find your own pace, lose yourself completely, and never have to flip through countless pages to find your place inside it. Here is how it works.\n\n!!Turning the Pages!!\n\nThe left and right arrow buttons at the bottom of the screen carry you forward and backward through the journal. If you are reading on a desktop or laptop, your keyboard arrow keys do the same — left and right, or up and down.\n\nOn any touch screen — a phone, a tablet, a convertible laptop, any device screen that responds to your hands — a short horizontal swipe is all you need. Swipe left to move forward. Swipe right to go back. A single flick anywhere across the book will do it.\n\nBut look also at the corners of the frame. The ornate metal corners that hold this journal's edges together are part of the story aesthetic woven into every design choice in this book, and they respond to you. The **bottom-right corner** moves you forward one page. The **top-right corner** takes you back. The chain holds the world together. The corners let you move through it.\n\n___\n!!Saving Your Place!!\n\nThe **ribbon** in the top-left corner of every page is your bookmark.\n\nTap or click it to mark any page you want to return to. When you do, the ribbon unfurls — a full bookmark image opens across the page, holding your place the way a physical ribbon pressed between paper would. To dismiss it and continue reading, tap anywhere on the darkened page. The bookmark folds back down, but it does not return entirely to its unmarked state. It stays open, smaller, in its bookmark state  — a quiet signal that this page has been claimed, that something here mattered enough to mark. It will stay that way for as long as your bookmark remains set.\n\nThe bookmark icon in the navigation bar at the bottom mirrors this behavior exactly, and shows you its active state while you are on the page you have saved.\nOnce a bookmark is placed, a numbered button appears in the navigation bar. Tap it from anywhere in the book and it will bring you directly back to your saved page — no searching, no scrolling, no retracing.\n\nYour bookmark does not disappear when you close the book. Return another day and a banner will ask whether you want to resume from where you left off. Tap **Resume** and the journal opens to your page. Tap **Dismiss** and it opens from the beginning — though the bookmark remains, waiting, for whenever you want it.\n\nTo remove a bookmark, tap the small bookmark image again while you are already on the bookmarked page, or tap the bookmark button at the bottom of the screen.\n\n___\n!!The Table of Contents!!\n\nThe **Contents button** at the bottom of the screen opens the full table of contents window — every page of this journal listed in order. Front matter, chapters, character portraits, back matter, author's notes. All of it accessible from anywhere in the book in a single tap.\n\nThe page title currently open in the journal appears in red inside the contents window. Titles change to red when you hover over them. Tap any title to jump directly to that page.\n\nThe chapters and back matter sections — _Author's Notes, About the Story, and About the Author_ — each expand when tapped, revealing their individual entries beneath. Close the window by tapping the X in the upper corner, or by tapping anywhere outside it.\n\nThe Table of Contents located inside the journal mirrors the Contents window navigation features. \n\n___\n!!Scrolling Long Pages!!\n\nSome pages hold more than a single frame can contain at once. When that happens, swipe up or down inside the book to read what lies below the visible edge. The scrollbar stays out of sight to keep the reading experience unbroken — but the content moves freely under your finger. Let it breathe. Some of these voices had a great deal to say.\n\n!!Two Ways to Read: Story Immersion and Easier Reading!!\n\nThis journal was written to be _felt_ as much as it is read.\n\nEvery character who takes the pen in these pages narrates in their own hand. The fonts you see are not interchangeable typographic choices — they are voices. Each handwriting style was chosen to carry a specific character's personality, their history, the particular way they think and process and remember. Reading in the full handwritten fonts is reading the way the journal was meant to be experienced: entering each narrator's mind through the shape of the letters themselves, feeling the shift in character voice as the pen changes hands.\n\nThat experience has a name here. It is called **Story Immersion**, and it is how the book opens.\n\nBut handwritten styles ask something of your eyes that print-style typefaces do not. On a difficult night, on a smaller screen, in the particular light of wherever you are reading — sometimes the most important thing is simply to let the words reach you without effort. For those moments, a small toggle sits at the bottom of every page, beside the Contents button. One tap shifts the text into **Easier Reading**: polished, print-style typefaces chosen to let the story breathe without losing its elegance. Chapter titles settle into Cinzel Decorative. Epigraphs take on the quiet grace of Quintessential Italic. The body of every chapter flows through EB Garamond, and the author's pages open into Lora Italic. The table of contents, the signatures, and the decorative elements of every page remain exactly as they are — they belong to the bones of this book, and those do not change with the mode.\n\nTap the toggle again — now reading **Story Immersion** — and the handwritten world returns. The fonts shift back. The voices reclaim their ink. The immersion closes around you once more.\n\nWhichever mode you choose, the journal remembers. Close it, come back another day, and it will open in the voice you last chose — because continuity matters here, in a story built entirely on the premise that what we carry forward shapes everything that comes next.\n\n!!Reading on Any Screen!!\n\nThis journal adjusts itself to whatever screen you bring to it. On a phone it fills the width of your display. On a wider screen it appears at its full designed size. Portrait orientation gives the most comfortable reading experience on phones and tablets, though the book will meet you however you arrive.\n\n___\n!!A Final Word Before You Begin!!\n\nEvery feature described here — the corners, the ribbon, the toggle, the swipe — was built to stay out of the way of the story. To let you find your rhythm and lose yourself inside it.\n\nBecause this is not a novel in the conventional sense. It is a journal assembled from the handwritten recollections of extraordinary people — vampires, witches, the divine, the grieving, the determined — who traveled back through time carrying the weight of a future that had already ended, and tried to unmake it.\n\nThey paid for the chance to be here, on these pages, telling you what happened. The least this book can do is make it easy for you to listen, to allow you to immerse yourself into their story and become part of that experience.\n\n**Turn the page. Their voices are waiting.**\n\n— Bluezahera\n","coverArt":"!!Cover Art!!\n\ function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,function(c){
    return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function processInline(text){
  var s=escapeHtml(text);
  s=s.replace(/\*\*([^*]+)\*\*/g,'<span class="beat">$1</span>');
  s=s.replace(/_([^_]+)_/g,'<em>$1</em>');
  s=s.replace(/\n+/g,' ');
  return s;
}

function parseChapterText(text){
  var rawPages=text.split(/\n[ \t]*(?:---|___)[ \t]*\n/);
  var pages=[];
  rawPages.forEach(function(rawPage,pageIdx){
    var paras=rawPage.split(/\n/).map(function(p){return p.trim();}).filter(Boolean);
    if(paras.length===0)return;
    var html='';
    paras.forEach(function(p,paraIdx){
      var t=p.trim();
      var sub2Match=t.match(/^!!!(.+)!!!$/);
      if(sub2Match){html+='<p class="sub2">'+processInline(sub2Match[1])+'</p>';return;}
      var subMatch=t.match(/^!!(.+)!!$/);
      if(subMatch){html+='<p class="sub">'+processInline(subMatch[1])+'</p>';return;}
      if(t.startsWith('>')){
        var lines=t.split('\n'),quote=[],author='';
        lines.forEach(function(ln){
          ln=ln.trim();
          if(ln.startsWith('>>'))author=ln.substring(2).trim();
          else if(ln.startsWith('>'))quote.push(ln.substring(1).trim());
        });
        html+='<p class="eq">&ldquo;'+processInline(quote.join(' '))+'&rdquo;</p>';
        if(author)html+='<p class="eqa">&mdash; '+processInline(author)+'</p>';
        return;
      }
      var beatMatch=t.match(/^\*\*([\s\S]+)\*\*$/);
      if(beatMatch&&!beatMatch[1].includes('**')){
        html+='<p class="beat">'+processInline(beatMatch[1])+'</p>';
        return;
      }
      if(t.startsWith('—')){
        html+='<p class="em-sig-p" style="font-size:1.08em;font-weight:700;margin-top:1.2em;text-align:right">'+processInline(t)+'</p>';
        return;
      }
      html+='<p>'+processInline(t)+'</p>';
    });
    pages.push(html);
  });
  return pages;
}

function chapterHeader(ch){
  var s='';
  if(ch.label)s+='<div class="cn">'+escapeHtml(ch.label)+'</div>';
  if(ch.title)s+='<h2 class="ct">'+escapeHtml(ch.title)+'</h2>';
  if(ch.title||ch.epigraph)s+='<hr class="div">';
  if(ch.epigraph){
    s+='<p class="eq">&ldquo;'+processInline(ch.epigraph)+'&rdquo;</p>';
    if(ch.epauth)s+='<p class="eqa">&mdash; '+processInline(ch.epauth)+'</p>';
    s+='<hr class="div">';
  }
  if(ch.section)s+='<p class="ch">'+escapeHtml(ch.section)+'</p>';
  return s;
}

function rebuildP(){

  EXTRA.forEach(function(ch){
    var pages=ch.body?parseChapterText(ch.body):[];
    pages.forEach(function(content,pi){
      var header=(pi===0)?chapterHeader(ch):'';
      arr.push(buildExtraPage(content,pageNum,header,ch.pov));
      pageNum++;
    });
    if(ch.transitionImage){
      imgSet.add(arr.length+7+TOC_PAGES); // portrait transition flipbook index
      arr.push(charPortrait(ch.transitionImage));
      pageNum++;
    }
  });
  P=arr;
  IMAGE_PAGES=imgSet;

  // Build Author's Notes pages (back matter)
  var noteArr=[];
  if(AUTHOR_NOTES.length){noteArr.push(buildAuthorNotesDivider(pageNum));pageNum++;}
  AUTHOR_NOTES.forEach(function(note){
    var notePages=note.body?parseChapterText(note.body):[];
    if(!notePages.length)notePages=[''];
    var total=notePages.length;
    notePages.forEach(function(content,pi){
      noteArr.push(buildAuthorNotePage(note,content,pageNum,pi===0,pi===total-1));
      pageNum++;

  });
  NOTE_PAGES=noteArr;
  // Build About the Story pages (back matter)
  var aboutArr=[];
  var cfg=getFixedAboutPageConfig();
  var hasAbout=false;
  cfg.forEach(function(pg){if(ABOUT_STORY[pg.key]&&ABOUT_STORY[pg.key].trim())hasAbout=true;});
  if(CHAR_PSYCH_PAGES.length)hasAbout=true;
  if(hasAbout){
    aboutArr.push(buildAboutSectionDivider(pageNum));pageNum++;
    cfg.forEach(function(pg){
      var body=ABOUT_STORY[pg.key]||'';
      if(!body.trim())return;
      var pageTexts=parseChapterText(body);
      pageTexts.forEach(function(content,pi){

// ===== TOC =====
// Convert integer to lowercase Roman numeral (supports 1–49)
function toRoman(n){
  var v=[40,10,9,5,4,1],s=['xl','x','ix','v','iv','i'],r='';
  for(var i=0;i<v.length;i++){while(n>=v[i]){r+=s[i];n-=v[i];}}
  return r;
}

// Count how many real flipbook pages the TOC will need.
// Called at the top of rebuildP() so TOC_PAGES is set before chapter indices are computed.
function computeTocPageCount(){
  var MAX=20;
  // Build just the row-type array (no HTML needed — we only need the count for pagination)
  var types=['s']; // Front Matter section header
  for(var fi=0;fi<7;fi++) types.push('i'); // 7 front matter items
  types.push('s'); // Chapters section header
  // Groups of 10 chapters (collapsed = 1 row each), minimum 1 group for Caroline
  var numGroups=Math.ceil(EXTRA.length/10)||1;
  for(var gi=0;gi<numGroups;gi++) types.push('g');
  types.push('s'); // Back Matter section header
  if(AUTHOR_NOTES.length>0) types.push('g');
  var cfg=getFixedAboutPageConfig();
  var hasAbout=false;
  cfg.forEach(function(pg){if(ABOUT_STORY[pg.key]&&ABOUT_STORY[pg.key].trim())hasAbout=true;});
  if(CHAR_PSYCH_PAGES.length) hasAbout=true;
  if(hasAbout) types.push('g');
  var aaConfig=getFixedAboutAuthorConfig();
  var hasAA=false;
  aaConfig.forEach(function(pg){if(ABOUT_AUTHOR[pg.key]&&ABOUT_AUTHOR[pg.key].trim())hasAA=true;});
  if(hasAA) types.push('g');
  types.push('i'); // Book Closing Seal
  types.push('i'); // Back Cover
  // Paginate with orphan rule (section header can't be last on a page)
  var pageCount=0, count=0;
  for(var ri=0;ri<types.length;ri++){
    if(count===MAX-1&&types[ri]==='s'){pageCount++;count=0;}
    else if(count>=MAX){pageCount++;count=0;}
    count++;
  }
  if(count>0) pageCount++;
  return Math.max(1,pageCount);
}

// Render one real flipbook TOC page.  subIdx is 0-based (idx 6 → subIdx 0, idx 7 → subIdx 1, …)
function tocPage(subIdx){
  var MAX=20;
  var tocBg='url(https://lh3.googleusercontent.com/d/1uDH6ZrvsnGFat1sSg4GfnZYFqnEZItZ8) center/cover no-repeat #f4ead0';
  var GOLD_GLOW='0 1px 3px rgba(0,0,0,.5),0 0 10px rgba(201,168,76,.8),0 0 22px rgba(201,168,76,.4)';
  var ROW='border-bottom:1px dotted rgba(139,106,58,.25)';

  // ── Build chapter data (identical logic to buildTocPanel) ─────────────────
  var chapterEntries=[];
  var si=7+TOC_PAGES;
  EXTRA.forEach(function(ch){
    var lbl='';
    if(ch.label)lbl+=escapeHtml(ch.label);
    if(ch.label&&ch.title)lbl+=' &mdash; ';
    if(ch.title)lbl+=escapeHtml(ch.title);
    if(!lbl)lbl='Untitled Chapter';
    var pages=ch.body?parseChapterText(ch.body):[];
    var entry={label:lbl,startIdx:si,pageCount:pages.length};
    si+=pages.length;
    if(ch.transitionImage){
      var imgLbl='POV Transitioning Artwork &mdash; '+escapeHtml(ch.transitionImageLabel||'Character Portrait');
      var tcColor=ch.transitionImageColor;
      entry.portraitLabel=imgLbl;
      entry.portraitIdx=si;
      entry.portraitColor=tcColor==='red'?C_BRIGHT_RED:tcColor==='silver'?C_SILVER_TXT:C_GOLD;
      entry.portraitGlow=tcColor==='red'?GW_RED:tcColor==='silver'?GW_SILVER:GW_GOLD;
      si++;
    }
    chapterEntries.push(entry);
  });
  var startIdx=si; // first back-matter page index

  // ── Build full rows array ─────────────────────────────────────────────────
  var rows=[];

  // Front Matter
  rows.push({h:'<div class="toc-section" style="font-size:34px">Front Matter</div>',t:'s'});
  [{label:'Front Cover Artwork',idx:0},{label:'Book Opening Title Artwork',idx:1},
   {label:'Author\'s Statement',idx:2},{label:'Book Epigraph',idx:3},
   {label:'Story Premise',idx:4},{label:'Before you Begin',idx:5},
   {label:'Table of Contents',idx:6}
  ].forEach(function(it){
    rows.push({h:'<div class="ti" onclick="goto('+it.idx+')" style="'+ROW+'"><span class="tn" style="font-size:28px">'+it.label+'</span></div>',t:'i'});
  });

  // Chapters — groups of 10, same structure as the TOC popup overlay
  rows.push({h:'<div class="toc-section" style="font-size:34px">Chapters</div>',t:'s'});
  var GRP=10;
  var carolineIdx=6+TOC_PAGES;
  var numGroups=Math.ceil(chapterEntries.length/GRP)||1;
  for(var gi=0;gi<numGroups;gi++){
    var gs=gi*GRP, ge=Math.min(gs+GRP-1,chapterEntries.length-1);
    var grpChapters=chapterEntries.slice(gs,ge+1);
    var firstNum=gs+1, lastNum=ge+1;
    var grpLabel=(firstNum===lastNum)?'Chapter '+firstNum:'Chapters '+firstNum+' &ndash; '+lastNum;
    var innerHtml='';
    if(gi===0){
      innerHtml+='<div class="ti" onclick="goto('+carolineIdx+')" style="'+ROW+'">'
        +'<span class="tn" style="font-size:24px;color:#8b6914;text-shadow:'+GOLD_GLOW+'">POV Transitioning Artwork &mdash; Caroline Forbes</span></div>';
    }
    grpChapters.forEach(function(e){
      innerHtml+='<div class="ti" onclick="goto('+e.startIdx+')" style="'+ROW+'">'
        +'<span class="tn" style="font-size:24px">'+e.label+'</span></div>';
      if(e.portraitIdx!==undefined){
        innerHtml+='<div class="ti" onclick="goto('+e.portraitIdx+')" style="'+ROW+'">'
          +'<span class="tn" style="font-size:24px;color:'+e.portraitColor+';text-shadow:'+e.portraitGlow+'">'+e.portraitLabel+'</span></div>';
      }
    });
    rows.push({h:
      '<div class="ti" onclick="toggleAnList(this)" style="'+ROW+'">'
        +'<span class="tn" style="font-size:28px"><span class="toc-an-arrow">&#9658;</span> '+grpLabel+'</span></div>'
        +'<div class="toc-an-list">'+innerHtml+'</div>',
      t:'g'});
  }

  // Back Matter
  var aboutStartIdx=startIdx;
  if(AUTHOR_NOTES.length>0)aboutStartIdx++;
  AUTHOR_NOTES.forEach(function(note){var np=note.body?parseChapterText(note.body):[];if(!np.length)np=[''];aboutStartIdx+=np.length;});
  var aboutTocData=computeAboutTocData(aboutStartIdx);
  var authorStartIdx=aboutStartIdx+ABOUT_PAGES.length;
  var authorTocData=computeAuthorTocData(authorStartIdx);

  rows.push({h:'<div class="toc-section" style="font-size:34px">Back Matter</div>',t:'s'});
  if(AUTHOR_NOTES.length>0){
    var anH='<div class="ti" onclick="toggleAnList(this)" style="'+ROW+'">'
      +'<span class="tn" style="font-size:28px"><span class="toc-an-arrow">&#9658;</span> Author\'s Notes</span></div>'
      +'<div class="toc-an-list">'
      +'<div class="ti" onclick="goto('+startIdx+')" style="'+ROW+'">'
      +'<span class="tn" style="font-size:24px">Author\'s Notes &mdash; Book Divider Artwork</span></div>';
    var noteIdx=startIdx+1;
    AUTHOR_NOTES.forEach(function(note){
      var noteLbl='';
      if(note.chapterLabel)noteLbl+=escapeHtml(note.chapterLabel);
      if(note.chapterLabel&&note.chapterTitle)noteLbl+=' &mdash; ';
      if(note.chapterTitle)noteLbl+=escapeHtml(note.chapterTitle);
      if(!noteLbl)noteLbl='Author\'s Note';else noteLbl+=' &mdash; Notes';
      anH+='<div class="ti" onclick="goto('+noteIdx+')" style="'+ROW+'">'
        +'<span class="tn" style="font-style:italic;font-size:24px">'+noteLbl+'</span></div>';
      var np=note.body?parseChapterText(note.body):[];if(!np.length)np=[''];noteIdx+=np.length;
    });
    anH+='</div>';
    rows.push({h:anH,t:'g'});
  }
  if(aboutTocData){
    // Split regular about pages from character psych pages (same nesting as popup)
    var nonCharItems=aboutTocData.items.filter(function(it){return !it.isChar;});
    var charItems=aboutTocData.items.filter(function(it){return it.isChar;});
    var abH='<div class="ti" onclick="toggleAnList(this)" style="'+ROW+'">'
      +'<span class="tn" style="font-size:28px"><span class="toc-an-arrow">&#9658;</span> About the Book &amp; the Story</span></div>'
      +'<div class="toc-an-list">';
    nonCharItems.forEach(function(it){
      abH+='<div class="ti" onclick="goto('+it.idx+')" style="'+ROW+'">'
        +'<span class="tn" style="font-size:24px">'+it.label+'</span></div>';
    });
    if(charItems.length){
      // Nested: Character POV Transitioning Artwork dropdown inside About the Book
      abH+='<div class="ti" onclick="toggleAnList(this)" style="'+ROW+'">'
        +'<span class="tn" style="font-size:24px"><span class="toc-an-arrow">&#9658;</span> Character POV Transitioning Artwork &mdash; Notes</span></div>'
        +'<div class="toc-an-list">';
      charItems.forEach(function(it){
        abH+='<div class="ti" onclick="goto('+it.idx+')" style="'+ROW+'">'
          +'<span class="tn" style="font-size:24px;color:'+it.color+';text-shadow:'+it.glow+'">'+it.label+'</span></div>';
      });
      abH+='</div>'; // close inner toc-an-list
    }
    abH+='</div>'; // close outer toc-an-list
    rows.push({h:abH,t:'g'});
  }
  if(authorTocData){
    var auH='<div class="ti" onclick="toggleAnList(this)" style="'+ROW+'">'
      +'<span class="tn" style="font-size:28px"><span class="toc-an-arrow">&#9658;</span> About the Author</span></div>'
      +'<div class="toc-an-list">';
    authorTocData.items.forEach(function(it){
      auH+='<div class="ti" onclick="goto('+it.idx+')" style="'+ROW+'">'
        +'<span class="tn" style="font-size:24px">'+it.label+'</span></div>';
    });
    auH+='</div>';
    rows.push({h:auH,t:'g'});
  }
  rows.push({h:'<div class="ti" onclick="goto('+(TOTAL+7+TOC_PAGES)+')" style="'+ROW+'"><span class="tn" style="font-size:28px">Book Closing Seal Artwork</span></div>',t:'i'});
  rows.push({h:'<div class="ti" onclick="goto('+(TOTAL+8+TOC_PAGES)+')" style="'+ROW+'"><span class="tn" style="font-size:28px">Back Cover Artwork</span></div>',t:'i'});

  // ── Paginate rows ─────────────────────────────────────────────────────────
  var pages=[], page=[];
  for(var ri=0;ri<rows.length;ri++){
    var row=rows[ri];
    if(page.length===MAX-1&&row.t==='s'){pages.push(page);page=[];}
    else if(page.length>=MAX){pages.push(page);page=[];}
    page.push(row);
  }
  if(page.length)pages.push(page);

  // ── Render the requested page ─────────────────────────────────────────────
  var sp=Math.min(Math.max(subIdx,0),pages.length-1);
  var content='';
  if(pages[sp])pages[sp].forEach(function(r){content+=r.h;});

  var isFirst=sp===0;
  var isLast=sp===pages.length-1;
  var header=isFirst
    ?'<h2 class="toc-h" style="font-size:48px">Table of Contents</h2><hr class="div">'
    :'<div style="font-family:\'Charm\',cursive;font-size:22px;color:#555555;text-align:center;padding:6px 0 10px;letter-spacing:2px">&#8213; Continued Table of Contents &#8213;</div>';

  // "continues" banner — placed in-flow after the last row so it never overlaps content.
  // margin-top pushes it 2-3 lines below the last item; margin-bottom + the wrapper's
  // padding-bottom keep it well above the absolute page-number at the very bottom.
  var continuesBanner=!isLast
    ?'<div style="margin-top:44px;margin-bottom:36px;text-align:center;'
        +'font-family:\'Charm\',cursive;font-size:16px;color:#2a2a2a;letter-spacing:1px;">'
        +'Table of Contents continues in the next page &#8594;</div>'
    :'';

  return '<div class="pc" style="background:'+tocBg+'">'
    +header
    +'<div style="margin-top:4px;padding-bottom:54px">'+content+continuesBanner+'</div>'
    +pn(toRoman(6+sp))
    +'</div>';
}

// ===== Render =====
function render(idx){
  if(idx===0)return cover();
  if(idx===1)return titlePage();
  if(idx===2)return authorDisclaimer();
  if(idx===3)return bookEpigraph();
  if(idx===4)return storyPremise();
  if(idx===5)return beforeYouBegin();
  if(idx>=6&&idx<6+TOC_PAGES)return tocPage(idx-6); // one or more real TOC pages
  if(idx===6+TOC_PAGES)return carolinePortrait();
  var chIdx=idx-(7+TOC_PAGES);
  if(chIdx<P.length)return P[chIdx]||'';
  chIdx-=P.length;
  if(chIdx<NOTE_PAGES.length)return NOTE_PAGES[chIdx]||'';
  chIdx-=NOTE_PAGES.length;
  if(chIdx<ABOUT_PAGES.length)return ABOUT_PAGES[chIdx]||'';
  chIdx-=ABOUT_PAGES.length;
  if(chIdx<AUTHOR_PAGES.length)return AUTHOR_PAGES[chIdx]||'';
  chIdx-=AUTHOR_PAGES.length;
  if(chIdx===0)return logoInteriorPage();
  if(chIdx===1)return backCoverPage();
  return '';
}

  el.style.background=(idx===0||idx===1||idx===6+TOC_PAGES||idx===TOTAL+8+TOC_PAGES||IMAGE_PAGES.has(idx))?'transparent':'#f4ead0';
}

function updateUI(){
  var last=TOTAL+8+TOC_PAGES;
  document.getElementById('pb').disabled=cur===0;
  document.getElementById('nb').disabled=cur===last;
  document.getElementById('pi').textContent=(cur+1)+' / '+(TOTAL+9+TOC_PAGES);
  setBg(document.getElementById('pg'),cur);
  var ps=document.querySelector('.page-shell');
  var spineWrap=document.getElementById('spine-wrap');if(spineWrap)spineWrap.style.display='block';
  if(cur===0||cur===TOTAL+8+TOC_PAGES){ps.style.left='0';ps.style.width='100%';}
  else if(cur===6+TOC_PAGES||IMAGE_PAGES.has(cur)){ps.style.left='40px';ps.style.width='calc(100% - 40px)';}
  else{ps.style.left='50px';ps.style.width='calc(100% - 50px)';}
  // show/hide corner folds at boundaries
  var cn=document.getElementById('corner-next');
  var cp=document.getElementById('corner-prev');
  if(cn) cn.classList.toggle('hidden',cur===last);
  if(cp) cp.classList.toggle('hidden',cur===0);
  if(cn) cn.classList.toggle('dim',cur===0);
  if(cp) cp.classList.toggle('dim',cur===last);
  updateBookmarkUI();
}

// ===== Navigation =====
function go(dir){
  if(busy)return;
  if(bookmarkOpen){bookmarkOpen=false;updateBookmarkUI();}
  var newIdx=cur+dir;
  if(newIdx<0||newIdx>TOTAL+8+TOC_PAGES)return;
  busy=true;
  var pg=document.getElementById('pg');
  var inc=document.getElementById('inc');
  inc.innerHTML=render(newIdx);
  setBg(inc,newIdx);
  inc.style.display='block';
  pg.classList.remove('afo','afi','afob','afib');
  inc.classList.remove('afo','afi','afob','afib');
  void inc.offsetWidth;
  if(dir>0){pg.classList.add('afob');inc.classList.add('afib');}
  else{pg.classList.add('afo');inc.classList.add('afi');}
  setTimeout(function(){
    pg.innerHTML=render(newIdx);
    setBg(pg,newIdx);
    pg.classList.remove('afo','afob');
    inc.classList.remove('afi','afib');
    inc.style.display='none';
    inc.innerHTML='';
    cur=newIdx;
    updateUI();
    busy=false;
  },320);
}

function goto(targetIdx){
  if(busy)return;
  if(targetIdx<0||targetIdx>TOTAL+8+TOC_PAGES)return;
  if(targetIdx===cur){closeToc();return;}
  var pg=document.getElementById('pg');
  pg.classList.remove('afo','afi','afob','afib');
  pg.innerHTML=render(targetIdx);
  setBg(pg,targetIdx);
  cur=targetIdx;
  updateUI();
  closeToc();
}

document.addEventListener('keydown',function(e){
  if(document.getElementById('toc-overlay').classList.contains('open'))return;
  if(e.key==='ArrowRight'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(e.key==='ArrowDown'){e.preventDefault();var pc=document.querySelector('#pg .pc');if(pc)pc.scrollBy({top:80,behavior:'smooth'});}
  else if(e.key==='ArrowUp'){e.preventDefault();var pc=document.querySelector('#pg .pc');if(pc)pc.scrollBy({top:-80,behavior:'smooth'});}
});

// ===== TOC Overlay =====
function buildTocPanel(){
  var items=[
    {label:'Front Cover Artwork',idx:0},
    {label:'Book Opening Title Artwork',idx:1},
    {label:'Author\'s Statement',idx:2},
    {label:'Book Epigraph',idx:3},
    {label:'Story Premise',idx:4},
    {label:'Before you Begin',idx:5},
    {label:'Table of Contents',idx:6}
  ];
  var GOLD_GLOW='0 1px 3px rgba(0,0,0,.5),0 0 10px rgba(201,168,76,.8),0 0 22px rgba(201,168,76,.4)';
  var ROW='border-bottom:1px dotted rgba(139,106,58,.25)';
  var ACTIVE_STYLE='color:#8b1a1a;font-weight:600';

  // ── Build chapter data (indices + portrait info) while tracking startIdx ─────
  var chapterEntries=[]; // {label, startIdx, pageCount, portraitLabel?, portraitIdx?, portraitColor?, portraitGlow?}
  var si=7+TOC_PAGES;
  EXTRA.forEach(function(ch){
    var lbl='';
    if(ch.label)lbl+=escapeHtml(ch.label);
    if(ch.label&&ch.title)lbl+=' &mdash; ';
    if(ch.title)lbl+=escapeHtml(ch.title);
    if(!lbl)lbl='Untitled Chapter';
    var pages=ch.body?parseChapterText(ch.body):[];
    var entry={label:lbl,startIdx:si,pageCount:pages.length};
    si+=pages.length;
    if(ch.transitionImage){
      var imgLbl='POV Transitioning Artwork &mdash; '+escapeHtml(ch.transitionImageLabel||'Character Portrait');
      var tcColor=ch.transitionImageColor;
      entry.portraitLabel=imgLbl;
      entry.portraitIdx=si;
      entry.portraitColor=tcColor==='red'?C_BRIGHT_RED:tcColor==='silver'?C_SILVER_TXT:C_GOLD;
      entry.portraitGlow=tcColor==='red'?GW_RED:tcColor==='silver'?GW_SILVER:GW_GOLD;
      si++;
    }
    chapterEntries.push(entry);
  });
  var startIdx=si; // first back-matter page index

  // ── Generate HTML ─────────────────────────────────────────────────────────
  var html='<div class="toc-section">Front Matter</div>';
  items.forEach(function(it){
    // TOC entry stays at idx 6 but should highlight for all TOC pages (6 through 6+TOC_PAGES-1)
    var isActive=(it.idx===6)?(cur>=6&&cur<6+TOC_PAGES):(cur===it.idx);
    var active=isActive?' style="'+ACTIVE_STYLE+'"':'';
    html+='<div class="ti" onclick="goto('+it.idx+')" style="'+ROW+'"><span class="tn"'+active+'>'+it.label+'</span></div>';
  });

  html+='<div class="toc-section">Chapters</div>';

  // Chapter groups — 10 chapters per dropdown.
  // Caroline Forbes (the opening POV portrait before chapter 1) is the first entry in group 1.
  // Each chapter's POV transition portrait follows it immediately inside its group, matching story order.
  var GRP=10;
  var carolineIdx=6+TOC_PAGES;
  var numGroups=Math.ceil(chapterEntries.length/GRP)||1; // always at least 1 group (holds Caroline even if 0 chapters)
  for(var gi=0;gi<numGroups;gi++){
    var gs=gi*GRP, ge=Math.min(gs+GRP-1,chapterEntries.length-1);
    var grpChapters=chapterEntries.slice(gs,ge+1);
    var firstNum=gs+1, lastNum=ge+1;
    var grpLabel=(firstNum===lastNum)?'Chapter '+firstNum:'Chapters '+firstNum+' &ndash; '+lastNum;
    // Active: Caroline (group 1 only) OR any chapter/portrait in this group
    var isCarolineActive=gi===0&&cur===carolineIdx;
    var anyGrpActive=isCarolineActive||grpChapters.some(function(e){
      if(cur>=e.startIdx&&cur<e.startIdx+e.pageCount)return true;
      if(e.portraitIdx!==undefined&&cur===e.portraitIdx)return true;
      return false;
    });
    html+='<div class="ti" onclick="toggleAnList(this)" style="'+ROW+'">'
      +'<span class="tn"'+(anyGrpActive?' style="'+ACTIVE_STYLE+'"':'')+"><span class='toc-an-arrow'>"+(anyGrpActive?'&#9660;':'&#9658;')+"</span> "+grpLabel+"</span></div>";
    html+='<div class="toc-an-list'+(anyGrpActive?' open':'')+'">';
    // Caroline Forbes appears first in group 1 — she opens the story before chapter 1
    if(gi===0){
      html+='<div class="ti" onclick="goto('+carolineIdx+')" style="'+ROW+'">'
        +'<span class="tn" style="font-size:20px;color:'+(isCarolineActive?'#8b1a1a':'#8b6914')+';'+(isCarolineActive?'font-weight:600;':'')+'text-shadow:'+GOLD_GLOW+'">POV Transitioning Artwork &mdash; Caroline Forbes</span></div>';
    }
    grpChapters.forEach(function(e){
      var isChAct=cur>=e.startIdx&&cur<e.startIdx+e.pageCount;
      html+='<div class="ti" onclick="goto('+e.startIdx+')" style="'+ROW+'">'
        +'<span class="tn" style="font-size:20px'+(isChAct?';'+ACTIVE_STYLE:'')+'">'+e.label+'</span></div>';
      if(e.portraitIdx!==undefined){
        var isPAct=cur===e.portraitIdx;
        html+='<div class="ti" onclick="goto('+e.portraitIdx+')" style="'+ROW+'">'
          +'<span class="tn" style="font-size:20px;color:'+(isPAct?'#8b1a1a':e.portraitColor)+';'+(isPAct?'font-weight:600;':'')+'text-shadow:'+e.portraitGlow+'">'+e.portraitLabel+'</span></div>';
      }
    });
    html+='</div>';
  }

  var aboutStartIdx=startIdx;
  if(AUTHOR_NOTES.length>0)aboutStartIdx++;
  AUTHOR_NOTES.forEach(function(note){var np=note.body?parseChapterText(note.body):[];if(!np.length)np=[''];aboutStartIdx+=np.length;});
  var aboutTocData=computeAboutTocData(aboutStartIdx);
  var aboutActive=aboutTocData&&cur>=aboutStartIdx&&cur<aboutStartIdx+ABOUT_PAGES.length;
  var authorStartIdx=aboutStartIdx+ABOUT_PAGES.length;
  var authorTocData=computeAuthorTocData(authorStartIdx);
  var authorActive=authorTocData&&cur>=authorStartIdx&&cur<authorStartIdx+AUTHOR_PAGES.length;
  html+='<div class="toc-section">Back Matter</div>';
  if(AUTHOR_NOTES.length>0){
    var noteIdx=startIdx+1;var anyNoteActive=cur===startIdx;var noteItems=[];
    noteItems.push('<div class="ti" onclick="goto('+startIdx+')" style="border-bottom:1px dotted rgba(139,106,58,.25)"><span class="tn" style="font-size:20px'+(cur===startIdx?';color:#8b1a1a;font-weight:600':'')+'">Author\'s Notes &mdash; Book Divider Artwork</span></div>');
    AUTHOR_NOTES.forEach(function(note){
      var noteLbl='';
      if(note.chapterLabel)noteLbl+=escapeHtml(note.chapterLabel);
      if(note.chapterLabel&&note.chapterTitle)noteLbl+=' &mdash; ';
      if(note.chapterTitle)noteLbl+=escapeHtml(note.chapterTitle);
      if(!noteLbl)noteLbl='Author\'s Note';else noteLbl+=' &mdash; Notes';
      var np=note.body?parseChapterText(note.body):[];if(!np.length)np=[''];
      var active=cur>=noteIdx&&cur<noteIdx+np.length;
      if(active)anyNoteActive=true;
      var activeStyle=active?' style="color:#8b1a1a;font-weight:600;font-style:italic;font-size:20px"':' style="font-style:italic;font-size:20px"';
      noteItems.push('<div class="ti" onclick="goto('+noteIdx+')" style="border-bottom:1px dotted rgba(139,106,58,.25)"><span class="tn"'+activeStyle+'>'+noteLbl+'</span></div>');
      noteIdx+=np.length;
    });
    html+='<div class="ti" onclick="toggleAnList(this)" style="border-bottom:1px dotted rgba(139,106,58,.25)">'
      +'<span class="tn"'+(anyNoteActive?' style="color:#8b1a1a;font-weight:600"':'')+"><span class='toc-an-arrow'>"+(anyNoteActive?'&#9660;':'&#9658;')+"</span> Author's Notes</span></div>";
    html+='<div class="toc-an-list'+(anyNoteActive?' open':'')+'">'+noteItems.join('')+'</div>';
  }
  if(aboutTocData){
    // Split: regular about-story pages vs. character psych (POV) pages
    var nonCharItems=aboutTocData.items.filter(function(it){return !it.isChar;});
    var charItems=aboutTocData.items.filter(function(it){return it.isChar;});
    var firstCharIdx=charItems.length?charItems[0].idx:-1;
    var charActive=firstCharIdx>0&&cur>=firstCharIdx&&cur<aboutStartIdx+ABOUT_PAGES.length;

    // About the Book & the Story — outer dropdown (always shown when about data exists)
    html+='<div class="ti" onclick="toggleAnList(this)" style="border-bottom:1px dotted rgba(139,106,58,.25)">'
      +'<span class="tn"'+(aboutActive?' style="'+ACTIVE_STYLE+'"':'')+"><span class='toc-an-arrow'>"+(aboutActive?'&#9660;':'&#9658;')+"</span> About the Book &amp; the Story</span></div>";
    html+='<div class="toc-an-list'+(aboutActive?' open':'')+'">';

    // Fixed about pages (story inspiration, world-building, etc.)
    nonCharItems.forEach(function(it){
      var isActive=cur===it.idx;
      var style='font-size:20px'+(isActive?';'+ACTIVE_STYLE:'');
      html+='<div class="ti" onclick="goto('+it.idx+')" style="border-bottom:1px dotted rgba(139,106,58,.25)"><span class="tn" style="'+style+'">'+it.label+'</span></div>';
    });

    // Character POV Transitioning Artwork — nested dropdown inside About the Book & the Story
    if(charItems.length){
      html+='<div class="ti" onclick="toggleAnList(this)" style="border-bottom:1px dotted rgba(139,106,58,.25)">'
        +'<span class="tn"'+(charActive?' style="'+ACTIVE_STYLE+'"':'')+"><span class='toc-an-arrow'>"+(charActive?'&#9660;':'&#9658;')+"</span> Character POV Transitioning Artwork &mdash; Notes</span></div>";
      html+='<div class="toc-an-list'+(charActive?' open':'')+'">';
      charItems.forEach(function(it){
        var isActive=cur===it.idx;
        var style='font-size:20px;color:'+(isActive?'#8b1a1a':it.color)+';'+(isActive?'font-weight:600;':'')+'text-shadow:'+it.glow;
        html+='<div class="ti" onclick="goto('+it.idx+')" style="border-bottom:1px dotted rgba(139,106,58,.25)"><span class="tn" style="'+style+'">'+it.label+'</span></div>';
      });
      html+='</div>'; // close inner toc-an-list
    }

    html+='</div>'; // close outer toc-an-list
  }
  if(authorTocData){
    var authorItems=[];
    authorTocData.items.forEach(function(it){
      var isActive=cur===it.idx;
      var style='font-size:20px'+(isActive?';color:#8b1a1a;font-weight:600':'');
      authorItems.push('<div class="ti" onclick="goto('+it.idx+')" style="border-bottom:1px dotted rgba(139,106,58,.25)"><span class="tn" style="'+style+'">'+it.label+'</span></div>');
    });
    html+='<div class="ti" onclick="toggleAnList(this)" style="border-bottom:1px dotted rgba(139,106,58,.25)">'
      +'<span class="tn"'+(authorActive?' style="color:#8b1a1a;font-weight:600"':'')+"><span class='toc-an-arrow'>"+(authorActive?'&#9660;':'&#9658;')+"</span> About the Author</span></div>";
    html+='<div class="toc-an-list'+(authorActive?' open':'')+'">'+authorItems.join('')+'</div>';
  }
  var logoIdx=TOTAL+7+TOC_PAGES;
  var logoActive=cur===logoIdx;
  html+='<div class="ti" onclick="goto('+logoIdx+')" style="border-bottom:1px dotted rgba(139,106,58,.25)"><span class="tn"'+(logoActive?' style="color:#8b1a1a;font-weight:600"':'')+'>Book Closing Seal Artwork</span></div>';
  var bcIdx=TOTAL+8+TOC_PAGES;
  var bcActive=cur===bcIdx;
  html+='<div class="ti" onclick="goto('+bcIdx+')" style="border-bottom:1px dotted rgba(139,106,58,.25)"><span class="tn"'+(bcActive?' style="color:#8b1a1a;font-weight:600"':'')+'>Back Cover Artwork</span></div>';
  document.getElementById('toc-panel-body').innerHTML=html;
}

  if(bookmark===cur){
    // Already bookmarked — remove it and close image
    bookmark=null;
    localStorage.removeItem(BM_KEY);
    bookmarkOpen=false;
  }else{
    // Not bookmarked — set it and open image
    bookmark=cur;
    localStorage.setItem(BM_KEY,String(cur));
    bookmarkOpen=true;
  }
  updateBookmarkUI();
}

  // Close the image overlay but keep the bookmark active
  bookmarkOpen=false;

}

}

function updateBookmarkUI(){
  var active=bookmark===cur;
  var isOpen=active&&bookmarkOpen;
  var hasGoto=bookmark!==null&&bookmark!==cur;
  var ribbon=document.getElementById('bm-ribbon');
  var btn=document.getElementById('bm-btn');
  var overlay=document.getElementById('bm-overlay');
  var gotoBtn=document.getElementById('bm-goto');
  var gotoNum=document.getElementById('bm-goto-num');
  if(ribbon){
    ribbon.classList.toggle('active',active);
    ribbon.classList.toggle('open',isOpen);
  }
  if(btn) btn.classList.toggle('active',active);
  if(overlay) overlay.classList.toggle('show',isOpen);
  if(gotoBtn) gotoBtn.classList.toggle('show',hasGoto);
  if(gotoNum&&hasGoto) gotoNum.textContent=bookmark+1;
}

    document.getElementById('resume-txt').textContent='Resume from page '+(bookmark+1)+'?';
