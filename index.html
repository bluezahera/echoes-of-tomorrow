// ===== PDF Export Mode =====
window.startExport = function(callback) {
  rebuildP();

  // Minimal CSS: page dimensions, colour fidelity, page breaks.
  // No @media-print hide/show tricks — the body is already clean in export mode.
  var xStyle = document.createElement('style');
  xStyle.textContent =
    '@page{size:137.58mm 195.79mm;margin:0}' +
    'html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}' +
    'html,body{scrollbar-width:none!important;-ms-overflow-style:none!important}' +
    '*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}' +
    '#export-container{display:block;width:622px}' +
    '.export-page{position:relative;width:622px;height:740px;overflow:hidden;' +
      'break-before:page;page-break-before:always}' +
    '.export-page:first-child{break-before:auto;page-break-before:auto}' +
    'a.ti{display:flex;align-items:center;text-decoration:none;color:inherit}' +
    // TOC fix 1: the collapsible sub-lists are display:none by default — force them open.
    '.toc-an-list{display:block!important;padding-left:4px!important}' +
    // TOC fix 2: hide the expand/collapse arrow (useless in PDF).
    '.toc-an-arrow{display:none!important}';
  // TOC fix 3: compress TOC item sizing on ALL TOC pages so entries fit within 740px.
  // Selectors are built dynamically since TOC_PAGES may be > 1.
  (function(){
    var tocSels=[];
    for(var t=0;t<TOC_PAGES;t++) tocSels.push('#pg-'+(6+t));
    var sel=tocSels.join(',');
    xStyle.textContent+=
      sel+' .toc-h{font-size:22px!important;margin-bottom:6px!important}'+
      sel+' .toc-section{font-size:14px!important;margin:5px 0 1px!important;letter-spacing:1px!important}'+
      sel+' .ti{padding:1px 0!important}'+
      sel+' .tn{font-size:12px!important}'+
      sel+' .tp{font-size:11px!important}';
  })();
  document.head.appendChild(xStyle);

  // The body already contains only #export-container in export mode — just fill it.
  // Fallback: create it if somehow missing.
  var container = document.getElementById('export-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'export-container';
    document.body.appendChild(container);
  }

  var last = TOTAL + 8 + TOC_PAGES;
  for (var i = 0; i <= last; i++) {
    var pg = document.createElement('div');
    pg.id = 'pg-' + i;
    pg.className = 'export-page';
    var isImgPage = (i === 0 || i === 1 || i === 6+TOC_PAGES || i === last || IMAGE_PAGES.has(i));
    if (!isImgPage) pg.style.background = pageBg(i);
    try {
      pg.innerHTML = render(i);
    } catch(e) {
      // If one page crashes, render a placeholder so the loop continues
      pg.innerHTML = '<div style="padding:40px;color:#999;font-family:serif;font-size:11px;text-align:center">Page ' + (i + 1) + '</div>';
    }
    container.appendChild(pg);
  }

  // Post-process all TOC pages: replace onclick elements with real anchor links so
  // Chromium's PDF engine creates genuine named-destination hyperlinks.
  // goto(N) → <a href="#pg-N">
  // toggleAnList(this) → remove onclick (section is already expanded by CSS)
  for (var tp = 0; tp < TOC_PAGES; tp++) {
  var tocEl = document.getElementById('pg-' + (6 + tp));
  if (tocEl) {
    tocEl.querySelectorAll('[onclick]').forEach(function(el) {
      var onclick = el.getAttribute('onclick') || '';
      var m = onclick.match(/goto\((\d+)\)/);
      if (m) {
        var a = document.createElement('a');
        a.href = '#pg-' + m[1];
        a.className = el.className;
        a.style.cssText = el.style.cssText;
        a.innerHTML = el.innerHTML;
        if (el.parentNode) el.parentNode.replaceChild(a, el);
      } else {
        // toggleAnList or other interactive handler — just remove onclick so it's inert
        el.removeAttribute('onclick');
        el.style.cursor = 'default';
      }
    });
  }
  } // end for(tp) TOC pages loop

  // Wait for fonts + all <img> elements to load (20 s safety timeout), then signal ready.
  var imagesDone = new Promise(function(res) {
    var imgs = Array.from(document.images);
    if (!imgs.length) { res(); return; }
    var n = imgs.length;
    var tid = null;
    function done() { if (!--n) { clearTimeout(tid); res(); } }
    tid = setTimeout(res, 20000);
    imgs.forEach(function(img) {
      if (img.complete) { done(); return; }
      img.addEventListener('load', done);
      img.addEventListener('error', done);
    });
  });
  Promise.all([document.fonts.ready, imagesDone]).then(function() {
    setTimeout(callback, 1000);
  });
};

// ===== Responsive scaling =====
function fitBook(){
  if(EXPORT_MODE)return;
  // Scale only to fit width — keeps text as large as possible; page scrolls vertically if needed
  var availW=window.innerWidth-16;
  var s=Math.min(availW/622,1);
  if(s<0.25)s=0.25;
  document.documentElement.style.setProperty('--book-scale',s.toFixed(4));
}
window.addEventListener('resize',fitBook);
window.addEventListener('orientationchange',function(){setTimeout(fitBook,150);});

// ===== Touch swipe navigation =====
(function(){
  var tx=0,ty=0,ts=0;
  document.addEventListener('touchstart',function(e){
    tx=e.touches[0].clientX;
    ty=e.touches[0].clientY;
    ts=Date.now();
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(document.getElementById('toc-overlay').classList.contains('open'))return;
    if(Date.now()-ts>800)return;
    var dx=e.changedTouches[0].clientX-tx;
    var dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>Math.abs(dy)+10&&Math.abs(dx)>44){
      if(dx<0)go(1);else go(-1);
    }
  },{passive:true});
})();

if (!EXPORT_MODE) { initFlipbook(); }
</script>
